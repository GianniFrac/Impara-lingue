  // le frasi lunghe si dividono in pezzi (alcuni browser interrompono le letture lunghe)
  pezzi(testo) {
    const parti = testo.match(/[^.!?;:،؟]+[.!?;:،؟]*\s*/g) || [testo];
    const pezzi = [];
    let corrente = "";
    for (const p of parti) {
      if ((corrente + p).length > 180 && corrente) { pezzi.push(corrente); corrente = p; } else corrente += p;
    }
    if (corrente.trim()) pezzi.push(corrente);
    return pezzi;
  },
  ferma() { try { speechSynthesis.cancel(); } catch (e) { /* niente */ } },
  // velocità: da -10 a 10 come nella versione per Windows (-3 = un po' lenta)
  pronuncia(testo, lingua, velocita, alFine) {
    if (!("speechSynthesis" in window) || !testo) { setTimeout(alFine, 50); return () => {}; }
    this.ferma();
    const pezzi = this.pezzi(testo);
    let fermato = false, timer = null;
    const rate = Math.min(2, Math.max(0.5, 1 + velocita * 0.07));
    const voce = this.trova(lingua);
    const prossimo = (i) => {
      if (fermato) return;
      if (i >= pezzi.length) { fermato = true; alFine(); return; }
      const u = new SpeechSynthesisUtterance(pezzi[i]);
      u.lang = voce ? voce.lang : LOCALE[lingua];
      if (voce) u.voice = voce;
      u.rate = rate;
      let passato = false;
      const avanti = () => { if (passato) return; passato = true; clearTimeout(timer); prossimo(i + 1); };
      u.onend = avanti;
      u.onerror = avanti;
      // alcuni tablet non segnalano la fine della lettura: dopo un tempo ragionevole si va avanti lo stesso
      timer = setTimeout(avanti, 2500 + pezzi[i].length * 110 / rate);
      speechSynthesis.speak(u);
    };
    prossimo(0);
    return () => { fermato = true; clearTimeout(timer); this.ferma(); };
  },
};

// ---------------------------------------------------------------- riconoscimento vocale
const Riconoscimento = {
  Classe: window.SpeechRecognition || window.webkitSpeechRecognition || null,
  negato: false,
  android: /Android/i.test(navigator.userAgent),
  get disponibile() { return !!this.Classe && !this.negato; },
  // avvia l'ascolto; richiami: interim(testo), fine(alternative[]), errore(codice)
  avvia(lingua, richiami, daUtente = false) {
    if (!this.disponibile) { richiami.errore("non-disponibile"); return () => {}; }
    let r;
    try { r = new this.Classe(); } catch (e) { richiami.errore("non-disponibile"); return () => {}; }
    r.lang = LOCALE[lingua];
    r.interimResults = true;
    r.maxAlternatives = 5;
    // sul computer l'ascolto continua finché non si fa una pausa; sui tablet Android il modo
    // continuo ripete i risultati, quindi si usa quello semplice
    r.continuous = !this.android;
    const finali = [];               // per ogni pezzo detto, le alternative proposte
    let chiuso = false, pausa = null;
    const pausaFine = 1800;
    const chiudi = () => {
      if (chiuso) return;
      chiuso = true;
      clearTimeout(pausa);
      try { r.stop(); } catch (e) { /* già fermo */ }
      // le alternative si combinano: la migliore di ogni pezzo, più le varianti dell'ultimo pezzo
      if (!finali.length) { richiami.fine([]); return; }
      const base = finali.map((a) => a[0]).join(" ").trim();
      const alternative = [base];
      const ultimo = finali[finali.length - 1];
      const prima = finali.slice(0, -1).map((a) => a[0]).join(" ");
      ultimo.slice(1).forEach((alt) => alternative.push((prima + " " + alt).trim()));
      richiami.fine([...new Set(alternative.filter(Boolean))]);
    };
    r.onresult = (ev) => {
      let provvisorio = "";
      for (let i = ev.resultIndex; i < ev.results.length; i++) {
        const ris = ev.results[i];
        if (ris.isFinal) finali.push(Array.from(ris).map((a) => a.transcript.trim()));
        else provvisorio += ris[0].transcript;
      }
      richiami.interim((finali.map((a) => a[0]).join(" ") + " " + provvisorio).trim());
      if (r.continuous) { clearTimeout(pausa); pausa = setTimeout(chiudi, pausaFine); }
    };
    r.onerror = (ev) => {
      // un rifiuto dopo un tocco sul microfono è definitivo; senza tocco può dipendere solo dal browser
      if (daUtente && (ev.error === "not-allowed" || ev.error === "service-not-allowed")) this.negato = true;
      if (ev.error !== "no-speech" && ev.error !== "aborted") richiami.errore(ev.error);
    };
    r.onend = chiudi;
    try { r.start(); } catch (e) { richiami.errore("avvio"); return () => {}; }
    return () => { chiuso = true; clearTimeout(pausa); try { r.abort(); } catch (e) { /* niente */ } };
  },
};

// ---------------------------------------------------------------- traduzioni automatiche
async function traduciOnline(testo, da, a) {
  const chiave = `${da}>${a}|${testo}`;
  if (archivio.traduzioni[chiave]) return archivio.traduzioni[chiave];
  let risultato = "";
  try {
    const url = "https://translate.googleapis.com/translate_a/single?client=gtx&dt=t&sl=" + da + "&tl=" + a +
      "&q=" + encodeURIComponent(testo);
    const r = await fetch(url);
    if (r.ok) {
      const dati = await r.json();
      risultato = (dati[0] || []).map((p) => p[0]).join("").trim();
    }
  } catch (e) { /* si prova con MyMemory */ }
  if (!risultato) {
    try {
      const r = await fetch("https://api.mymemory.translated.net/get?langpair=" + da + "|" + a + "&q=" + encodeURIComponent(testo));
      const dati = await r.json();
      const t = dati && dati.responseData && dati.responseData.translatedText;
      if (t && !/MYMEMORY WARNING|QUERY LENGTH LIMIT/i.test(t)) risultato = t.trim();
    } catch (e) { /* nessuna traduzione */ }
  }
  if (risultato) {
    const chiavi = Object.keys(archivio.traduzioni);
    if (chiavi.length > 3000) chiavi.slice(0, 1000).forEach((k) => delete archivio.traduzioni[k]);
    archivio.traduzioni[chiave] = risultato;
    salvaArchivio();
  }
  return risultato;
}

// ---------------------------------------------------------------- articoli e libri
function estraiArticolo(html) {
  const doc = new DOMParser().parseFromString(html, "text/html");
  const og = doc.querySelector('meta[property="og:title"]');
  const titolo = ((og && og.getAttribute("content")) || (doc.querySelector("title") || {}).textContent || "").trim();
  doc.querySelectorAll("script,style,noscript,nav,header,footer,aside,figure,form,svg,button").forEach((e) => e.remove());
  let radice = doc.body || doc;
  const articolo = doc.querySelector("article");
  if (articolo && articolo.querySelectorAll("p").length >= 3) radice = articolo;
  const paragrafi = [];
  radice.querySelectorAll("p").forEach((p) => {
    const t = p.textContent.split(/\s+/).filter(Boolean).join(" ");
    if (t.split(" ").length >= 8 && !paragrafi.includes(t)) paragrafi.push(t);
  });
  return { titolo, testo: paragrafi.join("\n\n") };
}

async function articoloWikinews(lingua) {
  const api = `https://${lingua}.wikinews.org/w/api.php`;
  for (let i = 0; i < 6; i++) {
    const c = await (await fetch(api + "?action=query&list=random&rnnamespace=0&rnlimit=1&format=json&origin=*")).json();
    const titolo = c.query.random[0].title;
    const d = await (await fetch(api + "?action=parse&prop=text&formatversion=2&format=json&origin=*&page=" +
      encodeURIComponent(titolo))).json();
    const html = ((d.parse || {}).text || "").split(/<h2\b/)[0];
    const testo = estraiArticolo("<body>" + html + "</body>").testo;
    if (dividiInFrasi(testo).length >= 5) {
      return { titolo, testo, fonte: `https://${lingua}.wikinews.org/wiki/` + encodeURIComponent(titolo.replace(/ /g, "_")) };
    }
  }
  throw new Error(T("Non ho trovato un articolo abbastanza lungo: riprova."));
}

function caricaScript(src) {
  return new Promise((ok, ko) => {
    const s = document.createElement("script");
    s.src = src; s.onload = ok; s.onerror = () => ko(new Error("script"));
    document.head.appendChild(s);
  });
}

async function leggiLibro(file) {
  if (/\.epub$/i.test(file.name)) {
    if (!window.JSZip) await caricaScript("https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js");
    const zip = await JSZip.loadAsync(file);
    // ordine dei capitoli: dal file .opf (spine), altrimenti in ordine di nome
    let ordine = Object.keys(zip.files).filter((n) => /\.x?html?$/i.test(n)).sort();
    const opf = Object.keys(zip.files).find((n) => /\.opf$/i.test(n));
    if (opf) {
      const x = new DOMParser().parseFromString(await zip.file(opf).async("string"), "application/xml");
      const base = opf.includes("/") ? opf.slice(0, opf.lastIndexOf("/") + 1) : "";
      const voci = {};
      x.querySelectorAll("manifest item").forEach((it) => { voci[it.getAttribute("id")] = base + decodeURIComponent(it.getAttribute("href")); });
      const spine = [...x.querySelectorAll("spine itemref")].map((r) => voci[r.getAttribute("idref")]).filter((n) => n && zip.file(n));
      if (spine.length) ordine = spine;
    }
    const parti = [];
    for (const nome of ordine) {
      let h = await zip.file(nome).async("string");
      h = h.replace(/<(script|style)[^>]*>[\s\S]*?<\/\1>/gi, " ")
        .replace(/<\/(p|div|h\d|li)\s*>/gi, "\n\n").replace(/<br\s*\/?>/gi, "\n");
      const d = new DOMParser().parseFromString("<body>" + h.replace(/<[^>]+>/g, " ") + "</body>", "text/html");
      parti.push(d.body.textContent);
    }
    return parti.join("\n");
  }
  const byte = new Uint8Array(await file.arrayBuffer());
  try { return new TextDecoder("utf-8", { fatal: true }).decode(byte).replace(/^﻿/, ""); } catch (e) {
    return new TextDecoder("windows-1252").decode(byte);
  }
}

// =============================================================================
// Esercizio: la sessione di un livello (stessa logica della versione per Windows)
// =============================================================================
"use strict";

class Interrotto extends Error {}
class SaltaFrase extends Error {}
class NonLoSo extends Error {}
const attendiMs = (ms) => new Promise((ok) => setTimeout(ok, ms));
const COL = { blu: "blu", verde: "verde", rosso: "rosso", arancio: "arancio", grigio: "grigio" };

class Esercizio {
  constructor(app, livello, lingua, frasi, opzioni) {
    this.app = app;
    this.ui = app;
    this.livello = livello;
    this.lingua = lingua;
    this.madre = app.madre;
    this.frasi = frasi;
    this.istruzioni = opzioni.istruzioni;
    this.mostraTesto = opzioni.mostraTesto;
    const imp = archivio.impostazioni;
    this.tentativi = Math.max(1, +imp.tentativi || 3);
    this.indulgente = livello <= (+imp.indulgente_fino_a);
    this.stop = false; this.pausa = false; this.prova = false;
    this.richiestaSalta = false; this.richiestaNonLoSo = false;
    this.annulla = null;
    this.alternative = [];
  }

  get velocita() { return +archivio.impostazioni.velocita; }

  // ------------------------------------------------------------ comandi dell'utente
  termina() { this.stop = true; Voce.ferma(); if (this.annulla) this.annulla(new Interrotto()); }
  salta() {
    if (this.annulla) { Voce.ferma(); this.annulla(new SaltaFrase()); } else this.richiestaSalta = true;
  }
  nonLoSo() {
    if (!this.prova) return;
    if (this.annulla) { Voce.ferma(); this.annulla(new NonLoSo()); } else this.richiestaNonLoSo = true;
  }
  cambiaPausa() { this.pausa = !this.pausa; return this.pausa; }

  async controlla() {
    if (this.stop) throw new Interrotto();
    while (this.pausa) {
      await attendiMs(200);
      if (this.stop) throw new Interrotto();
    }
    if (this.richiestaSalta) { this.richiestaSalta = false; throw new SaltaFrase(); }
    if (this.richiestaNonLoSo && this.prova) { this.richiestaNonLoSo = false; throw new NonLoSo(); }
  }

  // Attesa interrompibile da Termina, Salta e «Non lo so»
  async attendi(esecutore) {
    await this.controlla();
    return new Promise((ok, ko) => {
      let pulisci = null, finito = false;
      const fine = () => { finito = true; this.annulla = null; if (pulisci) pulisci(); };
      this.annulla = (err) => { if (!finito) { fine(); ko(err); } };
      pulisci = esecutore((v) => { if (!finito) { fine(); ok(v); } }) || null;
      if (finito && pulisci) pulisci();
    });
  }

  async conProva(fn) {
    this.richiestaNonLoSo = false;
    this.prova = true;
    this.ui.statoProva(true);
    try { return await fn(); } finally { this.prova = false; this.ui.statoProva(false); }
  }
  chiudiProva() { this.prova = false; this.ui.statoProva(false); }

  // ------------------------------------------------------------ voce, ascolto, scrittura
  parla(testo, lingua, velocita) {
    return this.attendi((ok) => Voce.pronuncia(testo, lingua, velocita, ok));
  }
  async istruzione(chiave) {
    if (this.istruzioni && ISTRUZIONI[chiave]) await this.parla(ISTRUZIONI[chiave][this.madre], this.madre, 0);
  }
  // Ascolto: risposta a voce (o scritta nella casella, anche con il microfono della tastiera)
  async ascolta(lingua, invito) {
    this.alternative = [];
    const testo = await this.attendi((ok) => this.ui.chiediVoce(lingua, invito, (alternative) => {
      this.alternative = alternative;
      ok(alternative[0] || "");
    }));
    return testo;
  }
  // Tra le varianti capite dal riconoscimento vocale si tiene quella che va meglio
  miglioreVoce(testo, valuta) {
    const candidati = this.alternative.length ? this.alternative : [testo];
    let migliore = null, scelto = testo;
    for (const c of candidati) {
      const e = valuta(c);
      if (!migliore || e.punteggio > migliore.punteggio) { migliore = e; scelto = c; }
    }
    migliore.testo_detto = scelto;
    return migliore;
  }
  attendiTesto(invito, opzioni = {}) {
    return this.attendi((ok) => this.ui.chiediTesto(invito, opzioni, ok, (r) => opzioni.riascolto &&
      Voce.pronuncia(r[0], r[1], r[2], () => {})));
  }
  attendiScelta(invito, testi, riascolto) {
    return this.attendi((ok) => this.ui.chiediScelta(invito, testi, ok, () =>
      Voce.pronuncia(riascolto[0], riascolto[1], riascolto[2], () => {})));
  }
  attendiValutazione(riferimento, detto) {
    this.ui.stato(T("Confronta e valuta la tua traduzione"), COL.rosso);
    return this.attendi((ok) => this.ui.chiediValutazione(riferimento, detto, ok));
  }

  // ------------------------------------------------------------ sessione
  async esegui() {
    try {
      if (this.livello === 0) await this.lavoroVocaboli();
      else if (this.livello >= 4) await this.lavoroTesti();
      else await this.lavoroFrasi();
    } catch (e) {
      if (!(e instanceof Interrotto)) { console.error(e); this.ui.errore(e); }
    } finally {
      Voce.ferma();
      this.ui.lavoroFinito();
    }
  }

  async lavoroFrasi() {
    const risultati = [];
    for (let n = 1; n <= this.frasi.length; n++) {
      const frase = this.frasi[n - 1];
      let verso = "originale";
      if (this.livello === 3) verso = Math.random() < 0.5 ? "ascolto_italiano" : "ascolto";
      else if (this.livello === 2 && Math.random() < 0.5) verso = "italiano";
      let ok1 = false, ok2 = false;
      try {
        await this.controlla();
        this.ui.nuovaFrase(n, this.frasi.length, frase, this.lingua, verso);
        if (verso === "originale") [ok1, ok2] = await this.eseguiFrase(frase);
        else if (verso === "italiano") [ok1, ok2] = await this.eseguiFraseInversa(frase);
        else if (verso === "ascolto_italiano") [ok1, ok2] = await this.eseguiFraseInversa(frase, true);
        else [ok1, ok2] = await this.eseguiFraseAscolto(frase);
      } catch (e) {
        if (!(e instanceof SaltaFrase)) throw e;
        ok1 = ok2 = false;
        this.ui.risposta(false);
        if (verso !== "originale") this.ui.mostraOriginale(frase[this.lingua], frase, this.lingua, false, []);
        if (verso === "originale" || verso === "ascolto") this.ui.mostraTraduzione(frase, false);
        if (verso === "ascolto_italiano") this.ui.mostraItaliano(frase);
        this.ui.stato(T("Frase saltata"), COL.grigio);
      }
      const ok = ok1 && ok2;
      risultati.push([frase, ok]);
      this.ui.risultatoFrase(this.livello, this.lingua, frase.id, ok);
    }
    this.ui.fineSessione(risultati);
  }

  // ------------------------------------------------------------ livello 0: vocaboli
  async lavoroVocaboli() {
    const lingua = this.lingua, madre = this.madre, parole = this.frasi;
    const esiti = {};
    parole.forEach((p) => { esiti[p.id] = true; });
    const nome = nl(lingua);

    const nuove = parole.filter((p) => p._nuova);
    for (let n = 1; n <= nuove.length; n++) {
      const p = nuove[n - 1];
      try {
        await this.controlla();
        this.ui.nuovaParola(n, nuove.length, p, lingua, "Scopri");
        this.ui.stato(T("Ascolta e impara la parola nuova"), COL.blu);
        await this.parla(p[lingua], lingua, this.velocita);
        await this.parla(p[madre], madre, 0);
        await this.parla(p[lingua], lingua, this.velocita);
        const detto = await this.ascolta(lingua, T("Ripeti la parola in {nome} (senza voto)", { nome }));
        const esito = this.miglioreVoce(detto, (t) => confrontaParola(p[lingua], t, lingua, SOGLIE.PAROLA_PRONUNCIA_FACILE, true));
        this.ui.esitoRipetizione(1, esito, lingua, "Ripeti");
        this.ui.stato(esito.superata ? T("Bene!") : T("La imparerai nei prossimi passi"), esito.superata ? COL.verde : COL.arancio);
      } catch (e) {
        if (!(e instanceof SaltaFrase || e instanceof NonLoSo)) throw e;
      }
    }

    const ordine = mescola([...parole]);
    for (let n = 1; n <= ordine.length; n++) {
      const p = ordine[n - 1];
      let corretta = null;
      try {
        await this.controlla();
        this.ui.nuovaParola(n, ordine.length, p, lingua, "Riconosci");
        const opzioni = mescola([...distrattori(p, this.app.vocaboliSessione || DATI.vocaboli, lingua, madre), p]);
        corretta = opzioni.indexOf(p);
        this.ui.stato(T("Ascolta..."), COL.blu);
        await this.parla(p[lingua], lingua, this.velocita);
        await this.conProva(async () => {
          const scelta = await this.attendiScelta(T("Che cosa significa? Scegli la traduzione"),
            opzioni.map((o) => o[madre]), [p[lingua], lingua, this.velocita]);
          const giusta = scelta === corretta;
          this.chiudiProva();
          this.ui.risposta(giusta);
          this.ui.esitoScelta(scelta, corretta);
          if (giusta) this.ui.stato(T("Esatto!"), COL.verde);
          else {
            esiti[p.id] = false;
            this.ui.stato(T("No: «{x}» significa «{x2}»", { x: p[lingua], x2: p[madre] }), COL.rosso);
            await this.parla(p[madre], madre, 0);
          }
        });
      } catch (e) {
        if (e instanceof NonLoSo) {
          esiti[p.id] = false;
          this.ui.risposta(false);
          this.ui.esitoScelta(null, corretta);
          this.ui.stato(T("«{x}» significa «{x2}»", { x: p[lingua], x2: p[madre] }), COL.arancio);
          await this.parla(p[madre], madre, 0);
        } else if (e instanceof SaltaFrase) {
          esiti[p.id] = false;
          this.ui.risposta(false);
        } else throw e;
      }
      await attendiMs(1000);
      this.ui.nascondiScelta();
    }

    mescola(ordine);
    const risultati = [];
    for (let n = 1; n <= ordine.length; n++) {
      const p = ordine[n - 1];
      let ok = false;
      try {
        await this.controlla();
        this.ui.nuovaParola(n, ordine.length, p, lingua, "Ricorda");
        this.ui.stato(T("Ascolta la parola..."), COL.blu);
        await this.parla(p[lingua], lingua, this.velocita);
        const pronOk = await this.fasePronuncia(p[lingua], true);
        await this.istruzione("Ora nella tua lingua.");
        const tradOk = await this.faseTraduzione(p, true);
        ok = esiti[p.id] && pronOk && tradOk;
      } catch (e) {
        if (!(e instanceof SaltaFrase)) throw e;
        this.ui.risposta(false);
        this.ui.mostraTraduzione(p, false);
        this.ui.stato(T("Parola saltata"), COL.grigio);
      }
      risultati.push([p, ok]);
      this.ui.risultatoFrase(0, lingua, p.id, ok);
    }
    this.ui.fineSessione(risultati);
  }

  // ------------------------------------------------------------ livelli 4, 5 e 6: testi veri
  async lavoroTesti() {
    const lingua = this.lingua, madre = this.madre;
    const orale = this.livello === 6 || !this.mostraTesto;
    const velocita = this.livello === 6 ? 0 : this.velocita;
    const risultati = [];
    for (let n = 1; n <= this.frasi.length; n++) {
      const frase = this.frasi[n - 1];
      let letturaOk = false, traduzioneOk = false;
      try {
        await this.controlla();
        if (frase._testo && !frase[madre]) {
          this.ui.stato(T("Preparo la traduzione..."), COL.blu);
          frase[madre] = (await traduciOnline(frase[lingua], lingua, madre)) || "";
        }
        const inversa = this.livello === 4 && frase[madre] &&
          Math.random() * 100 < +archivio.impostazioni.frasi_inverse_4;
        if (inversa) {
          this.ui.nuovaFrase(n, this.frasi.length, frase, lingua, orale ? "inversa_orale" : "inversa_testi");
          traduzioneOk = await this.faseTraduzioneInversaValutata(frase, orale);
          await this.istruzione("Ora pronunciala.");
          letturaOk = orale ? await this.faseRipetizioneOrale(frase[lingua], this.velocita)
            : await this.faseLettura(frase[lingua]);
        } else {
          this.ui.nuovaFrase(n, this.frasi.length, frase, lingua, orale ? "orale" : "lettura");
          letturaOk = orale ? await this.faseRipetizioneOrale(frase[lingua], velocita) : await this.faseLettura(frase[lingua]);
          await this.istruzione("Ora nella tua lingua.");
          traduzioneOk = await this.faseTraduzioneValutata(frase, orale);
        }
      } catch (e) {
        if (!(e instanceof SaltaFrase)) throw e;
        this.ui.risposta(false);
        this.ui.mostraTraduzione(frase, false);
        this.ui.stato(T("Frase saltata"), COL.grigio);
      }
      const ok = letturaOk && traduzioneOk;
      risultati.push([frase, ok]);
      this.ui.risultatoFrase(this.livello, lingua, frase.id, ok);
    }
    this.ui.fineSessione(risultati);
  }

  async faseRipetizioneOrale(testo, velocita) {
    const lingua = this.lingua;
    try {
      return await this.conProva(async () => {
        for (let t = 1; t <= this.tentativi; t++) {
          this.ui.stato(T("Ascolta la frase..."), COL.blu);
          await this.parla(testo, lingua, velocita);
          const detto = await this.ascolta(lingua, T("Ripeti la frase in {nome}", { nome: nl(lingua) }));
          const esito = this.miglioreVoce(detto, (x) => confronta(testo, x, lingua, SOGLIE.LETTURA_FACILE, true));
          this.ui.esitoRipetizione(t, esito, lingua, "Ripetizione");
          this.ui.risposta(esito.superata);
          if (esito.superata) {
            this.ui.stato(T("Ripetizione corretta!"), COL.verde);
            this.chiudiProva();
            await this.istruzione("Bene!");
            return true;
          }
          if (t < this.tentativi) {
            this.ui.stato(T("Non ancora: riascolta e riprova"), COL.arancio);
            await this.istruzione("Ascolta e riprova.");
          }
        }
        return false;
      });
    } catch (e) {
      if (!(e instanceof NonLoSo)) throw e;
      this.ui.risposta(false);
      return false;
    }
  }

  async faseTraduzioneInversaValutata(frase, orale) {
    const lingua = this.lingua, madre = this.madre, riferimento = frase[lingua];
    await this.parla(frase[madre], madre, 0);
    try {
      return await this.conProva(async () => {
        let testo = await this.ascolta(lingua, T("Di' la traduzione in {lingua}", { lingua: nl(lingua) }));
        if (!testo.trim()) {
          testo = await this.attendiTesto(T("Scrivi la traduzione in {lingua} e premi Invio", { lingua: nl(lingua) }),
            { riascolto: [frase[madre], madre, 0], mostra: orale ? null : [frase[madre], "madre"] });
          this.alternative = [];
        }
        if (!frase._testo) {
          const candidati = [riferimento, ...(frase[`${lingua}_alt`] || [])];
          const esito = this.miglioreVoce(testo, (x) => migliorEsito(candidati.map((c) => confronta(c, x, lingua, SOGLIE.TRADUZIONE, true))));
          if (esito.superata) {
            this.ui.esitoRipetizione(1, esito, lingua, "Traduzione");
            this.ui.risposta(true);
            this.ui.mostraOriginale(riferimento, frase, lingua, true, []);
            this.ui.stato(T("Traduzione corretta!"), COL.verde);
            this.chiudiProva();
            await this.istruzione("Esatto!");
            return true;
          }
        }
        const perc = await this.attendiValutazione(riferimento, testo);
        return this.esitoValutazione(perc, testo, frase, lingua);
      });
    } catch (e) {
      if (!(e instanceof NonLoSo)) throw e;
      this.ui.risposta(false);
      this.ui.mostraOriginale(riferimento, frase, lingua, false, []);
      this.ui.stato(T("Ecco la traduzione giusta"), COL.rosso);
      return false;
    }
  }

  esitoValutazione(percentuale, testo, frase, linguaRisposta) {
    const minima = +archivio.impostazioni.aderenza_minima;
    const giusta = percentuale >= minima;
    const esito = { punteggio: percentuale / 100, superata: giusta, testo_detto: testo,
      detto: testo.split(/\s+/).filter(Boolean).map((w) => [w, giusta]),
      rif: (frase[linguaRisposta] || "").split(/\s+/).filter(Boolean).map((w) => [w, giusta]) };
    if (linguaRisposta === this.madre) {
      this.ui.esitoTraduzione(1, esito);
      this.ui.mostraTraduzione(frase, giusta);
    } else {
      this.ui.esitoRipetizione(1, esito, linguaRisposta, "Traduzione");
      this.ui.mostraOriginale(frase[linguaRisposta], frase, linguaRisposta, giusta, []);
    }
    this.ui.risposta(giusta);
    this.ui.stato(giusta ? T("Aderenza {perc}%: traduzione giusta", { perc: percentuale })
      : T("Aderenza {perc}%: da migliorare (minimo {minima}%)", { perc: percentuale, minima }),
    giusta ? COL.verde : COL.arancio);
    this.chiudiProva();
    return giusta;
  }

  async faseLettura(testo) {
    const lingua = this.lingua;
    const soglia = this.indulgente ? SOGLIE.LETTURA_FACILE : SOGLIE.LETTURA;
    try {
      return await this.conProva(async () => {
        for (let t = 1; t <= this.tentativi; t++) {
          const detto = await this.ascolta(lingua, T("Leggi la frase ad alta voce"));
          const esito = this.miglioreVoce(detto, (x) => confronta(testo, x, lingua, soglia, this.indulgente));
          this.ui.esitoRipetizione(t, esito, lingua, "Lettura");
          this.ui.risposta(esito.superata);
          if (esito.superata) {
            this.ui.stato(T("Lettura corretta!"), COL.verde);
            this.chiudiProva();
            await this.istruzione("Bene!");
            return true;
          }
          this.ui.stato(T("Ascolta come si legge") + (t < this.tentativi ? T(" e riprova") : ""), COL.arancio);
          await this.parla(testo, lingua, this.velocita);
        }
        return false;
      });
    } catch (e) {
      if (!(e instanceof NonLoSo)) throw e;
      this.ui.risposta(false);
      this.ui.stato(T("Ascolta come si legge"), COL.arancio);
      await this.parla(testo, lingua, this.velocita);
      return false;
    }
  }

  async faseTraduzioneValutata(frase, orale = false) {
    const lingua = this.lingua, madre = this.madre, riferimento = frase[madre] || "";
    try {
      return await this.conProva(async () => {
        let testo = await this.ascolta(madre, orale ? T("Di' la traduzione o il significato in {lingua}", { lingua: nl(madre) })
          : T("Di' la traduzione in {lingua}", { lingua: nl(madre) }));
        if (!testo.trim()) {
          testo = await this.attendiTesto(T("Scrivi la traduzione in {lingua} e premi Invio", { lingua: nl(madre) }),
            { riascolto: [frase[lingua], lingua, this.velocita], mostra: orale ? null : [frase[lingua], "straniera"] });
          this.alternative = [];
        }
        if (!frase._testo && riferimento) {
          const candidati = [riferimento, ...(frase[`${madre}_alt`] || [])];
          const esito = this.miglioreVoce(testo, (x) => this.valutaTraduzione(frase, candidati, x, false));
          if (esito.superata) {
            this.ui.esitoTraduzione(1, esito);
            this.ui.risposta(true);
            this.ui.mostraTraduzione(frase, true);
            if (orale) this.ui.mostraOriginale(frase[lingua], frase, lingua, true, []);
            this.ui.stato(T("Traduzione corretta!"), COL.verde);
            this.chiudiProva();
            await this.istruzione("Esatto!");
            return true;
          }
        }
        if (orale) this.ui.mostraOriginale(frase[lingua], frase, lingua, null, []);
        const perc = await this.attendiValutazione(riferimento, testo);
        return this.esitoValutazione(perc, testo, frase, madre);
      });
    } catch (e) {
      if (!(e instanceof NonLoSo)) throw e;
      this.ui.risposta(false);
      if (orale) this.ui.mostraOriginale(frase[lingua], frase, lingua, false, []);
      this.ui.mostraTraduzione(frase, false);
      this.ui.stato(T("Ecco la traduzione giusta"), COL.rosso);
      if (riferimento) await this.parla(riferimento, madre, 0);
      return false;
    }
  }

  // ------------------------------------------------------------ livelli 1, 2 e 3
  async eseguiFrase(frase) {
    const lingua = this.lingua, testo = frase[lingua], nome = nl(lingua);
    let ripOk = false;
    try {
      await this.conProva(async () => {
        for (let t = 1; t <= this.tentativi; t++) {
          this.ui.stato(T("Ascolta la frase..."), COL.blu);
          await this.parla(testo, lingua, this.velocita);
          const detto = await this.ascolta(lingua, T("Ripeti la frase in {nome}", { nome }));
          const esito = this.miglioreVoce(detto, (x) => this.indulgente
            ? confronta(testo, x, lingua, SOGLIE.RIPETIZIONE_FACILE, true) : confronta(testo, x, lingua, SOGLIE.RIPETIZIONE));
          this.ui.esitoRipetizione(t, esito, lingua, "Ripetizione");
          this.ui.risposta(esito.superata);
          if (esito.superata) {
            ripOk = true;
            this.ui.stato(T("Ripetizione corretta!"), COL.verde);
            this.chiudiProva();
            await this.istruzione("Bene!");
            break;
          }
          if (t < this.tentativi) {
            this.ui.stato(T("Non ancora: riascolta e riprova"), COL.arancio);
            await this.istruzione("Riprova.");
          }
        }
      });
    } catch (e) {
      if (!(e instanceof NonLoSo)) throw e;
      this.ui.risposta(false);
    }
    if (!ripOk) this.ui.stato(T("Passiamo alla traduzione"), COL.arancio);
    await this.istruzione("Ora nella tua lingua.");
    const tradOk = await this.faseTraduzione(frase);
    return [ripOk, tradOk];
  }

  async eseguiFraseInversa(frase, soloVoce = false) {
    const lingua = this.lingua, madre = this.madre, nome = nl(lingua);
    this.ui.stato(T("Ascolta la frase in {lingua}...", { lingua: nl(madre) }), COL.blu);
    await this.parla(frase[madre], madre, 0);
    let scrittoOk = false, riferimento = frase[lingua], avvisi = [];
    let invito = T("Scrivi la frase in {nome} e premi Invio", { nome });
    if (lingua === "ar") invito += T(" (anche in traslitterazione)");
    try {
      await this.conProva(async () => {
        for (let t = 1; t <= this.tentativi; t++) {
          const scritto = await this.attendiTesto(invito, { riascolto: [frase[madre], madre, 0], mostra: soloVoce ? null : [frase[madre], "madre"] });
          const esito = valutaScritto(frase, scritto, lingua);
          this.ui.esitoScritto(t, esito);
          this.ui.risposta(esito.superata);
          if (esito.superata) {
            scrittoOk = true; riferimento = esito.riferimento; avvisi = esito.avvisi;
            this.ui.stato(T("Traduzione scritta corretta!"), COL.verde);
            this.chiudiProva();
            await this.istruzione("Esatto!");
            break;
          }
          if (t < this.tentativi) {
            this.ui.stato(T("Non ancora: correggi e riprova"), COL.arancio);
            await this.istruzione("Riprova.");
          }
        }
      });
    } catch (e) {
      if (!(e instanceof NonLoSo)) throw e;
      this.ui.risposta(false);
    }
    if (soloVoce) this.ui.mostraItaliano(frase);
    this.ui.mostraOriginale(riferimento, frase, lingua, scrittoOk, avvisi);
    if (!scrittoOk) {
      this.ui.stato(T("Ecco la frase giusta: ascoltala"), COL.rosso);
      await this.parla(riferimento, lingua, this.velocita);
    }
    await this.istruzione("Ora pronunciala.");
    const pronOk = await this.fasePronuncia(riferimento);
    return [scrittoOk, pronOk];
  }

  async eseguiFraseAscolto(frase) {
    const lingua = this.lingua, testo = frase[lingua], nome = nl(lingua);
    this.ui.stato(T("Ascolta bene la frase..."), COL.blu);
    await this.parla(testo, lingua, this.velocita);
    let scrittoOk = false, avvisi = [];
    let invito = T("Scrivi in {nome} la frase che hai sentito e premi Invio", { nome });
    if (lingua === "ar") invito += T(" (anche in traslitterazione)");
    try {
      await this.conProva(async () => {
        for (let t = 1; t <= this.tentativi; t++) {
          const scritto = await this.attendiTesto(invito, { riascolto: [testo, lingua, this.velocita] });
          const esito = valutaScritto(frase, scritto, lingua, true);
          this.ui.esitoScritto(t, esito);
          this.ui.risposta(esito.superata);
          if (esito.superata) {
            scrittoOk = true; avvisi = esito.avvisi;
            this.ui.stato(T("Dettato corretto!"), COL.verde);
            this.chiudiProva();
            await this.istruzione("Esatto!");
            break;
          }
          if (t < this.tentativi) {
            this.ui.stato(T("Non ancora: riascolta e correggi"), COL.arancio);
            await this.istruzione("Riascolta.");
            await this.parla(testo, lingua, this.velocita);
          }
        }
      });
    } catch (e) {
      if (!(e instanceof NonLoSo)) throw e;
      this.ui.risposta(false);
    }
    this.ui.mostraOriginale(testo, frase, lingua, scrittoOk, avvisi);
    if (!scrittoOk) {
      this.ui.stato(T("Ecco la frase giusta: ascoltala"), COL.rosso);
      await this.parla(testo, lingua, this.velocita);
    }
    await this.istruzione("Ora pronunciala.");
    const pronOk = await this.fasePronuncia(testo);
    await this.istruzione("Ora nella tua lingua.");
    const tradOk = await this.faseTraduzione(frase);
    return [scrittoOk && pronOk, tradOk];
  }

  async fasePronuncia(riferimento, parola = false) {
    const lingua = this.lingua, nome = nl(lingua);
    try {
      return await this.conProva(async () => {
        for (let t = 1; t <= this.tentativi; t++) {
          let esito;
          if (parola) {
            const detto = await this.ascolta(lingua, T("Ripeti la parola in {nome}", { nome }));
            esito = this.miglioreVoce(detto, (x) => this.indulgente
              ? confrontaParola(riferimento, x, lingua, SOGLIE.PAROLA_PRONUNCIA_FACILE, true)
              : confrontaParola(riferimento, x, lingua, SOGLIE.PAROLA_PRONUNCIA));
          } else {
            const detto = await this.ascolta(lingua, T("Pronuncia la frase in {nome}", { nome }));
            esito = this.miglioreVoce(detto, (x) => confronta(riferimento, x, lingua, SOGLIE.RIPETIZIONE));
          }
          this.ui.esitoRipetizione(t, esito, lingua, "Pronuncia");
          this.ui.risposta(esito.superata);
          if (esito.superata) {
            this.ui.stato(T("Pronuncia corretta!"), COL.verde);
            this.chiudiProva();
            await this.istruzione("Bene!");
            return true;
          }
          this.ui.stato(T("Ascolta la pronuncia giusta") + (t < this.tentativi ? T(" e riprova") : ""), COL.arancio);
          if (t < this.tentativi) await this.istruzione("Ascolta e riprova.");
          await this.parla(riferimento, lingua, this.velocita);
        }
        return false;
      });
    } catch (e) {
      if (!(e instanceof NonLoSo)) throw e;
      this.ui.risposta(false);
      this.ui.stato(T("Ecco la pronuncia giusta"), COL.arancio);
      await this.parla(riferimento, lingua, this.velocita);
      return false;
    }
  }

  valutaTraduzione(frase, candidati, testo, parola) {
    const madre = this.madre;
    if (madre === "ar" && testo && frase.ar_translit && !haArabo(testo)) {
      const a = compatta(frase.ar_translit), b = compatta(testo);
      const punteggio = a && b ? new SequenceMatcher(a, b).ratio() : 0;
      const superata = punteggio >= 0.85;
      return { punteggio, superata, detto: [[testo, superata]], rif: [], testo_detto: testo };
    }
    if (parola) return migliorEsito(candidati.map((c) => confrontaParola(c, testo, madre, SOGLIE.PAROLA_TRADUZIONE, true)));
    return migliorEsito(candidati.map((c) => confronta(c, testo, madre, SOGLIE.TRADUZIONE, true)));
  }

  async faseTraduzione(frase, parola = false) {
    const lingua = this.lingua, madre = this.madre;
    let candidati = [frase[madre], ...(frase[`${madre}_alt`] || [])];
    if (parola) candidati = candidati.flatMap((c) => variantiParola(c, madre));
    let dettoAVoce = null, ultimaSbagliata = null;
    try {
      const risultato = await this.conProva(async () => {
        for (let t = 1; t <= this.tentativi; t++) {
          let testo, esito;
          if (dettoAVoce === null) {
            testo = await this.ascolta(madre, T("Di' la traduzione in {lingua}", { lingua: nl(madre) }));
            esito = this.miglioreVoce(testo, (x) => this.valutaTraduzione(frase, candidati, x, parola));
            testo = esito.testo_detto;
          } else {
            let invito = T("Scrivi la traduzione in {lingua} e premi Invio", { lingua: nl(madre) });
            if (madre === "ar") invito += T(" (anche in traslitterazione)");
            testo = await this.attendiTesto(invito, { riascolto: [frase[lingua], lingua, this.velocita],
              mostra: [frase[lingua], "straniera"], contesta: ultimaSbagliata });
            if (Array.isArray(testo)) {
              this.ui.annullaErrore();
              this.ui.mostraTraduzione(frase, true);
              this.ui.stato(T("Risposta aggiunta tra quelle giuste. Grazie!"), COL.verde);
              this.chiudiProva();
              await this.istruzione("Esatto!");
              return true;
            }
            esito = this.valutaTraduzione(frase, candidati, testo, parola);
          }
          this.ui.esitoTraduzione(t, esito);
          this.ui.risposta(esito.superata);
          if (esito.superata) {
            this.ui.mostraTraduzione(frase, true);
            if (dettoAVoce && this.valutaTraduzione({ ar_translit: "" }, [testo], dettoAVoce, parola).punteggio >= 0.6) {
              this.ui.annullaErrore();
              this.ui.stato(T("Avevi detto bene: era il riconoscimento vocale a non capirti. Errore annullato."), COL.verde);
            } else this.ui.stato(T("Traduzione corretta!"), COL.verde);
            this.chiudiProva();
            await this.istruzione("Esatto!");
            return true;
          }
          if (testo && testo.trim()) ultimaSbagliata = testo.trim();
          if (t < this.tentativi) {
            if (dettoAVoce === null) {
              dettoAVoce = testo || " ";
              this.ui.stato(T("Non ti ho capito bene: scrivi la traduzione in {lingua}", { lingua: nl(madre) }), COL.arancio);
            } else this.ui.stato(T("Non ancora: correggi e riprova"), COL.arancio);
            await this.istruzione("Riprova.");
          }
        }
        return null;
      });
      if (risultato) return true;
    } catch (e) {
      if (!(e instanceof NonLoSo)) throw e;
      this.ui.risposta(false);
    }
    this.ui.mostraTraduzione(frase, false);
    this.ui.stato(T("Ecco la traduzione giusta"), COL.rosso);
    await this.parla(frase[madre], madre, 0);
    return false;
  }
}

// Prova del microfono: dice cosa ha capito
class ProvaMicrofono extends Esercizio {
  constructor(app) { super(app, 1, app.madre, [], { istruzioni: false, mostraTesto: true }); }

      const testo = await this.ascolta(this.madre, T("Parla ora: di' una frase in {lingua}", { lingua: nl(this.madre) }));

}

"use strict";

const $ = (sel, radice = document) => radice.querySelector(sel);
function el(tag, attributi = {}, ...figli) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attributi)) {
    if (v === null || v === undefined || v === false) continue;
    if (k === "class") e.className = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else if (k === "testo") e.textContent = v;
    else e.setAttribute(k, v === true ? "" : v);
  }
  for (const f of figli.flat()) if (f !== null && f !== undefined && f !== false) e.append(f instanceof Node ? f : String(f));
  return e;
}
const direzione = (lingua) => (lingua === "ar" ? "rtl" : "ltr");

class App {
  constructor() {
    caricaArchivio();
    this.applicaAlternative();
    this.utenti = archivio.utenti;
    this.utente = this.utenti.ultimo && this.utenti.utenti[this.utenti.ultimo] ? this.utenti.ultimo : (Object.keys(this.utenti.utenti)[0] || "");
    this.madre = (this.utente && this.utenti.utenti[this.utente].madre) || "it";
    this.lingua = (this.utente && this.utenti.utenti[this.utente].lingua) || (this.madre === "en" ? "it" : "en");
    this.livello = 1;
    this.quante = 10;
    this.mostraTesto = true;
    this.istruzioniVoce = true;
    this.fonte = "frasi";
    this.lavoro = null;
    this.sessione = null;
    this.dettaglio = []; this.indiceDettaglio = {}; this.voceCorrente = null;
    LINGUA_UI = this.madre;
    Voce.carica();
    this.costruisci();
    if (!this.utente) setTimeout(() => this.nuovoUtente(true), 300);
  }

  // ------------------------------------------------------------ dati del partecipante
  impostazioni() { return archivio.impostazioni; }
  datiUtente() {
    const u = this.utenti.utenti[this.utente] || (this.utenti.utenti[this.utente] = {});
    u.progressi = u.progressi || {}; u.registro = u.registro || []; u.sbloccati = u.sbloccati || {};
    return u;
  }
  prog(livello) { const p = this.datiUtente().progressi; return p[String(livello)] || (p[String(livello)] = {}); }
  chiave(lingua, madre) { madre = madre || this.madre; return madre === "it" ? lingua : `${madre}-${lingua}`; }
  salva() { salvaArchivio(); }
  sessioneValida(frasi, risposte, errori) {
    const imp = this.impostazioni();
    return frasi >= +imp.frasi_minime && risposte > 0 && errori * 100 / risposte <= +imp.errori_max_percento;
  }
  livelloSbloccato(lingua, livello) {
    if (this.impostazioni().collaudo || livello <= 1) return true;
    if (!this.utente) return false;
    return (this.datiUtente().sbloccati[this.chiave(lingua)] || []).includes(livello);
  }
  livelloSuperato(lingua, livello) {
    return !!this.utente && (this.datiUtente().sbloccati[this.chiave(lingua)] || []).includes(livello + 1);
  }
  unita(livello) { return livello === 0 ? T("parole") : T("frasi"); }
  requisito(lingua, livello) {
    const imp = this.impostazioni();
    let testo = this.livelloSuperato(lingua, livello) ? T("Livello {livello} superato!", { livello })
      : T("Per superare il livello {livello}: una sessione di almeno {frasi_minime} {unita} con al massimo il {errori_max_percento}% di errori.",
        { livello, frasi_minime: imp.frasi_minime, unita: this.unita(livello), errori_max_percento: imp.errori_max_percento });
    const ultime = this.utente ? this.datiUtente().registro.filter((r) => r.lingua === lingua && (r.madre || "it") === this.madre && r.livello === livello) : [];
    if (ultime.length) {
      const r = ultime[ultime.length - 1];
      const perc = r.risposte ? Math.round(r.errori * 100 / r.risposte) : 0;
      testo += T("  Ultima sessione: {frasi} {unita}, {perc}% di errori.", { frasi: r.frasi, unita: this.unita(livello), perc });
    }
    return testo;
  }
  vocabolarioPersonale() {
    if (!this.utente) return [];
    const v = this.datiUtente().vocabolario || (this.datiUtente().vocabolario = {});
    return v[this.chiave(this.lingua)] || (v[this.chiave(this.lingua)] = []);
  }
  datiLibro() { return ((this.datiUtente().libri || {})[this.chiave(this.lingua)]) || null; }
  datiArticolo() { return ((this.datiUtente().articoli || {})[this.chiave(this.lingua)]) || null; }
  totaleElementi() {
    if (this.livello === 0) return DATI.vocaboli.length + this.vocabolarioPersonale().length;
    if (this.livello === 5) { const a = this.utente && this.datiArticolo(); return a ? a.totale : 0; }
    return [4, 6].includes(this.livello) ? DATI.frasi4.length : DATI.frasi.length;
  }

  // Traduzioni alternative aggiunte dall'utente («La mia risposta era giusta»)
  applicaAlternative() {
    const fonti = { parola: DATI.vocaboli, frase: DATI.frasi, frase4: DATI.frasi4 };
    for (const [tipo, elenco] of Object.entries(fonti)) {
      const alt = (archivio.alternative || {})[tipo] || {};
      for (const e of elenco) {
        const a = alt[String(e.id)];
        if (!a) continue;
        for (const [campo, valori] of Object.entries(a)) {
          e[campo] = [...new Set([...(e[campo] || []), ...valori])];
        }
      }
    }
  }

  // ------------------------------------------------------------ finestre (modali)
  modale({ titolo, contenuto, bottoni = [{ testo: T("OK"), valore: true, stile: "primario" }], largo = false }) {
    return new Promise((ok) => {
      const fondo = $("#modale");
      const chiudi = (v) => { fondo.hidden = true; fondo.replaceChildren(); document.removeEventListener("keydown", tasto); ok(v); };
      const tasto = (e) => { if (e.key === "Escape") chiudi(null); };
      const finestra = el("div", { class: "finestra" + (largo ? " larga" : ""), role: "dialog", "aria-modal": "true" },
        el("div", { class: "finestra-testa" },
          el("h2", { testo: titolo || "" }),
          el("button", { class: "chiudi", "aria-label": T("Chiudi"), onclick: () => chiudi(null) }, "✕")),
        el("div", { class: "finestra-corpo" }, typeof contenuto === "string" ? el("p", { class: "a-capo", testo: contenuto }) : contenuto),
        bottoni.length ? el("div", { class: "finestra-piede" }, bottoni.map((b) =>
          el("button", { class: "btn " + (b.stile || ""), onclick: () => chiudi(typeof b.valore === "function" ? b.valore() : b.valore) }, b.testo))) : null);
      fondo.replaceChildren(finestra);
      fondo.hidden = false;
      document.addEventListener("keydown", tasto);
      const primo = finestra.querySelector("input,textarea,select") || finestra.querySelector(".finestra-piede .primario");
      if (primo) setTimeout(() => primo.focus(), 50);
    });
  }
  avviso(titolo, testo) { return this.modale({ titolo, contenuto: testo }); }
  conferma(titolo, testo, si = T("Sì"), no = T("No")) {
    return this.modale({ titolo, contenuto: testo, bottoni: [{ testo: no, valore: false }, { testo: si, valore: true, stile: "primario" }] });
  }
  toast(testo) {
    const t = $("#toast");
    t.textContent = testo; t.hidden = false;
    clearTimeout(this.timerToast);
    this.timerToast = setTimeout(() => { t.hidden = true; }, 3500);

  costruisciInizio() {

                el("button", { class: "btn quieto", onclick: () => this.eliminaUtente() }, T("Elimina")))),
            el("label", { class: "campo", for: "sel-madre" }, el("span", { class: "etichetta una-riga", title: ETICHETTA_LINGUA_MADRE,
              testo: ETICHETTA_LINGUA_MADRE }), selMadre),
            el("label", { class: "campo", for: "sel-lingua" }, el("span", { class: "etichetta", testo: T("Lingua da imparare:") }), selLingua),
            el("label", { class: "campo livello", for: "sel-livello" }, el("span", { class: "etichetta", testo: T("Livello:") }), selLivello),
            el("label", { class: "campo quante", for: "num-quante" }, el("span", { class: "etichetta una-riga", testo: T("Frasi (o parole) per sessione:") }),
              el("div", { class: "riga-stretta" }, quante, el("span", { id: "nota-quante", class: "nota" })))),
          el("p", { id: "desc-livello", class: "descrizione a-capo" }),
          el("div", { class: "spunte" },
            el("label", { class: "spunta" }, el("input", { type: "checkbox", id: "chk-testo", checked: this.mostraTesto,
              onchange: (e) => { this.mostraTesto = e.target.checked; } }), T("Mostra il testo della frase")),
            el("label", { class: "spunta" }, el("input", { type: "checkbox", id: "chk-istruzioni", checked: this.istruzioniVoce,
              onchange: (e) => { this.istruzioniVoce = e.target.checked; } }), T('Istruzioni a voce ("Bene!", "Riprova"...)'))),
          this.costruisciFonti()),
        el("section", { class: "scheda stato-utente" },
          el("p", { id: "statistiche", class: "statistiche" }),

          el("p", { id: "collaudo", class: "banner attenzione", hidden: true,
            testo: T("MODALITÀ COLLAUDO: tutti i livelli sono sbloccati (si disattiva da Impostazioni)") }),
          el("p", { id: "voce-info", class: "nota a-capo" }))),
      el("div", { class: "azioni" },
          el("button", { id: "btn-inizia", class: "btn primario grande", onclick: () => this.inizia() }, T("Inizia la sessione")),
          el("button", { class: "btn", onclick: () => this.provaMicrofono() }, T("Prova il microfono")),
          el("button", { class: "btn", onclick: () => this.apriRegistro() }, T("Registro")),

    const fileLibro = el("input", { type: "file", id: "file-libro", accept: ".txt,.epub,text/plain,application/epub+zip", hidden: true,

          el("button", { class: "btn piccolo", onclick: () => this.articoloWikinews() }, T("Wikinews a caso")),

  aggiornaInfo() {
    const selLiv = $("#sel-livello");
    selLiv.replaceChildren(...LIVELLI.map(([v, nome]) => el("option", { value: String(v), selected: v === this.livello },
      T(nome) + (this.livelloSbloccato(this.lingua, v) ? "" : T("   (bloccato)")))));
    $("#desc-livello").textContent = T(DESCRIZIONE_LIVELLI[this.livello]);
    $("#collaudo").hidden = !this.impostazioni().collaudo;
    $("#fonte4").hidden = ![4, 6].includes(this.livello);
    $("#fonte5").hidden = this.livello !== 5;
    $("#radio-articolo").hidden = this.livello !== 6;
    if ([4, 6].includes(this.livello)) this.aggiornaFonte();
    if (this.livello === 5) this.aggiornaArticolo();
    this.aggiornaNotaFrasi();
    if (!this.utente) {
      $("#statistiche").textContent = T("Crea un partecipante con il pulsante «Nuovo...» per iniziare.");
      $("#livelli-info").textContent = "";
    } else {
      const p = this.prog(this.livello)[this.chiave(this.lingua)] || {};
      let superate = Object.values(p).filter((s) => (s.superate || 0) > 0 && !s.da_ripassare).length;
      const ripassare = Object.values(p).filter((s) => s.da_ripassare).length;
      if (this.livello === 5) { const a = this.datiArticolo(); superate = a ? a.posizione : 0; }
      $("#statistiche").textContent = T("{utente} · {lingua} · livello {livello}:  {unita} superate {superate} su {x}   ·   da ripassare: {ripassare}",
        { utente: this.utente, lingua: NL(this.lingua), livello: this.livello, unita: this.unita(this.livello), superate, x: this.totaleElementi(), ripassare });
      let info;
      if (!this.livelloSbloccato(this.lingua, this.livello)) info = T("Livello {livello} bloccato. ", { livello: this.livello }) + this.requisito(this.lingua, this.livello - 1);
      else info = this.requisito(this.lingua, this.livello);
      if (this.livello === 0) info += "  " + T("Il mio vocabolario") + ": " + this.vocabolarioPersonale().length;
      $("#livelli-info").textContent = info;
    }
    const sbloccato = this.livelloSbloccato(this.lingua, this.livello);
    $("#btn-inizia").disabled = !this.utente || !sbloccato;
    const voce = [];
    if (!Riconoscimento.Classe) voce.push(T("Questo browser non riconosce la voce: rispondi scrivendo (puoi usare il microfono della tastiera). Su tablet usa Chrome."));
    else if (Riconoscimento.negato) voce.push(T("Il microfono non è permesso: rispondi scrivendo, oppure consenti il microfono nelle impostazioni del browser."));
    if (Voce.voci.length) {
      const mancanti = [this.lingua, this.madre].filter((c) => !Voce.trova(c));
      if (mancanti.length) voce.push(T("Manca la voce per: {lingue}. Installala nelle impostazioni di sintesi vocale del tablet.", { lingue: mancanti.map(nl).join(", ") }));
    }
    $("#voce-info").textContent = voce.join("\n");
  }
  aggiornaNotaFrasi() {
    const minime = +this.impostazioni().frasi_minime;
    const n = $("#nota-quante");
    if (!n) return;
    const valida = this.quante >= minime;
    n.textContent = valida ? T("valida per superare il livello (minimo {minime})", { minime })
      : T("solo allenamento: per superare il livello ne servono almeno {minime}", { minime });
    n.className = "nota " + (valida ? "testo-giusto" : "testo-attenzione");
  }
  ricordaLingue() {
    if (!this.utente) return;
    const u = this.datiUtente();
    u.madre = this.madre; u.lingua = this.lingua;
    this.utenti.ultimo = this.utente;
    this.salva();
  }
  cambiaUtente(nome) {
    this.utente = nome;
    const u = this.datiUtente();
    this.madre = u.madre || this.madre;
    this.lingua = u.lingua && u.lingua !== this.madre ? u.lingua : (this.madre === "en" ? "it" : "en");
    this.utenti.ultimo = nome;
    this.salva();
    LINGUA_UI = this.madre;
    this.costruisci();
  }
  cambiaMadre(codice) {
    this.madre = codice;
    LINGUA_UI = codice;
    if (this.lingua === codice) this.lingua = codice === "en" ? "it" : "en";
    this.ricordaLingue();
    this.costruisci();
  }
  async nuovoUtente(benvenuto = false) {
    const nome = el("input", { id: "nuovo-nome", type: "text", maxlength: "40", autocomplete: "off" });
    const madre = el("select", { id: "nuovo-madre" }, CODICI_LINGUE.map((c) => el("option", { value: c, selected: c === this.madre }, ENDONIMI[c])));
    const contenuto = el("div", { class: "modulo" },
      benvenuto ? el("p", { testo: T("Benvenuto! Per iniziare crea il tuo profilo.") }) : null,
      el("label", { class: "campo", for: "nuovo-nome" }, el("span", { class: "etichetta", testo: DOMANDA_NOME }), nome),
      el("label", { class: "campo", for: "nuovo-madre" }, el("span", { class: "etichetta", testo: ETICHETTA_LINGUA_MADRE }), madre));
    const ok = await this.modale({ titolo: T("Nuovo partecipante"), contenuto,
      bottoni: [{ testo: T("Annulla"), valore: false }, { testo: "OK", valore: () => true, stile: "primario" }] });
    const n = nome.value.trim();
    if (!ok || !n) return;
    if (this.utenti.utenti[n]) { await this.avviso(T("Nuovo partecipante"), T("Esiste già un partecipante con questo nome.")); return; }
    this.utenti.utenti[n] = { progressi: {}, registro: [], sbloccati: {}, madre: madre.value };
    this.utente = n;
    this.madre = madre.value;
    this.lingua = this.madre === "en" ? "it" : "en";
    LINGUA_UI = this.madre;
    this.ricordaLingue();
    this.costruisci();
  }
  async eliminaUtente() {
    if (!this.utente) return;
    if (!(await this.conferma(T("Elimina"), T("Eliminare il partecipante «{utente}» con tutti i suoi progressi?", { utente: this.utente })))) return;
    delete this.utenti.utenti[this.utente];
    this.utente = Object.keys(this.utenti.utenti)[0] || "";
    this.utenti.ultimo = this.utente;
    this.salva();
    if (this.utente) this.cambiaUtente(this.utente); else this.costruisci();
  }

  // ------------------------------------------------------------ fonti dei livelli 4, 5 e 6
  aggiornaFonte() {
    let fonte = "frasi";
    if (this.utente) fonte = (this.datiUtente()[`fonte${this.livello}`] || {})[this.chiave(this.lingua)] || "frasi";
    if (fonte === "articolo" && this.livello !== 6) fonte = "frasi";
    this.fonte = fonte;
    document.querySelectorAll('input[name="fonte"]').forEach((r) => { r.checked = r.value === fonte; });
    const libro = this.utente && this.datiLibro(), articolo = this.utente && this.datiArticolo();
    let testo;
    if (fonte === "articolo") {
      testo = articolo ? T("«{titolo}»  (frase {posizione} di {totale})", { titolo: articolo.titolo || T("senza titolo"),
        posizione: Math.min(articolo.posizione + 1, articolo.totale), totale: articolo.totale }) : T("(nessun articolo: sceglilo al livello 5)");
    } else if (libro) {
      testo = T("{nome}  (frase {posizione} di {totale})", { nome: libro.file, posizione: Math.min(libro.posizione + 1, libro.totale), totale: libro.totale });
    } else testo = T("(nessun libro scelto)");
    $("#lbl-libro").textContent = testo;
  }
  cambiaFonte(valore) {
    this.fonte = valore;
    if (this.utente) {
      const d = this.datiUtente();
      (d[`fonte${this.livello}`] = d[`fonte${this.livello}`] || {})[this.chiave(this.lingua)] = valore;
      this.salva();
    }
    if (valore === "libro" && !this.datiLibro()) $("#file-libro").click();
    this.aggiornaFonte();
  }
  async scegliLibro(file) {
    if (!this.utente) return;
    let frasi;
    try { frasi = dividiInFrasi(await leggiLibro(file)); } catch (e) {
      await this.avviso(T("Libro"), T("Non riesco a leggere il libro:\n{errore}", { errore: e.message || e })); return;
    }
    if (!frasi.length) { await this.avviso(T("Libro"), T("Nel file non ho trovato frasi da leggere.")); return; }
    const chiave = this.chiave(this.lingua);
    await LibriDB.scrivi(`${this.utente}|${chiave}`, { nome: file.name, frasi });
    const prima = this.datiLibro();
    const d = this.datiUtente();
    (d.libri = d.libri || {})[chiave] = { file: file.name, posizione: prima && prima.file === file.name ? prima.posizione : 0, totale: frasi.length };
    this.cambiaFonte("libro");
  }
  async frasiDalLibro(quante) {
    const libro = this.datiLibro();
    if (!libro) return null;
    const salvato = await LibriDB.leggi(`${this.utente}|${this.chiave(this.lingua)}`);
    if (!salvato || !salvato.frasi) {
      await this.avviso(T("Libro"), T("Il testo del libro non è più in memoria su questo dispositivo: sceglilo di nuovo con «Scegli libro...». Il segnalibro resta."));
      return null;
    }
    const frasi = salvato.frasi;
    libro.totale = frasi.length;
    if (libro.posizione >= frasi.length) {
      if (!(await this.conferma(T("Libro"), T("Hai finito il libro! Vuoi ricominciare dall'inizio?")))) return null;
      libro.posizione = 0;
    }
    const inizio = libro.posizione, elenco = [];
    for (let i = inizio; i < Math.min(inizio + quante, frasi.length); i++) elenco.push({ id: `t${i}`, [this.lingua]: frasi[i], _testo: true, _indice: i });
    return elenco;
  }

  aggiornaArticolo() {
    const a = this.utente && this.datiArticolo();
    const lbl = $("#lbl-articolo");
    if (!a) { lbl.textContent = T("(nessun articolo: scegline uno con i pulsanti qui sopra)"); return; }
    let sito = "";
    try { sito = a.fonte ? "   ·   " + new URL(a.fonte).hostname : ""; } catch (e) { /* indirizzo non valido */ }
    lbl.textContent = T("«{titolo}»  (frase {posizione} di {totale})", { titolo: a.titolo || T("senza titolo"),
      posizione: Math.min(a.posizione + 1, a.totale), totale: a.totale }) + sito + "\n" + this.inizioArticolo(a);
  }
  inizioArticolo(a, caratteri = 160) {
    const frasi = dividiInFrasi(a.testo);
    if (!frasi.length) return "";
    const prima = frasi[Math.min(a.posizione, frasi.length - 1)];
    return "«" + (prima.length <= caratteri ? prima : prima.slice(0, caratteri).replace(/\s+\S*$/, "") + "…") + "»";
  }
  impostaArticolo(titolo, testo, fonte = "") {
    const frasi = dividiInFrasi(testo);
    if (frasi.length < 2) { this.avviso(T("Articolo"), T("Nel testo non ho trovato abbastanza frasi da leggere.")); return false; }
    const d = this.datiUtente();
    (d.articoli = d.articoli || {})[this.chiave(this.lingua)] = { titolo: titolo.split(/\s+/).join(" ").slice(0, 150), testo, fonte, posizione: 0, totale: frasi.length };
    this.salva();
    this.aggiornaInfo();
    return true;
  }
  async proponiArticolo(titolo, testo, fonte, altro) {
    if (!testo.trim()) {
      await this.avviso(T("Articolo"), T("In quella pagina non ho trovato il testo dell'articolo. Prova a copiarlo e usa «Incolla il testo...»."));
      return;
    }
    const frasi = dividiInFrasi(testo);
    const contenuto = el("div", { class: "anteprima" },
      el("h3", { testo: "«" + (titolo || T("senza titolo")) + "»" }),
      el("p", { class: "citazione", dir: direzione(this.lingua), testo: frasi[0] || testo.slice(0, 300) }),
      el("p", { class: "nota", testo: `${frasi.length} ${T("frasi")}` }));
    const scelta = await this.modale({ titolo: T("Vuoi usare questo articolo?"), contenuto, bottoni: [
      { testo: T("Lascia quello di prima"), valore: null }, { testo: T("Cercane un altro"), valore: "altro" },
      { testo: T("Usa questo articolo"), valore: "usa", stile: "primario" }] });
    if (scelta === "usa") this.impostaArticolo(titolo, testo, fonte);
    else if (scelta === "altro") altro();
  }
  async scaricaArticolo(funzione) {
    if (!this.utente) return;
    this.toast(T("Scarico l'articolo..."));
    try { return await funzione(); } catch (e) {
      await this.avviso(T("Articolo"), T("Non sono riuscito a scaricare l'articolo:\n{errore}", { errore: e.message || e }) + "\n\n" +
        T("Molti siti non permettono di leggere le pagine da un'altra app: apri l'articolo nel browser, copia il testo e usa «Incolla il testo...»."));
      return null;
    }
  }
  async articoloDaIndirizzo() {
    if (!this.utente) return;
    const campo = el("input", { id: "url-articolo", type: "url", placeholder: "https://", autocomplete: "off" });
    const ok = await this.modale({ titolo: T("Articolo da Internet"), contenuto: el("label", { class: "campo", for: "url-articolo" },
      el("span", { class: "etichetta", testo: T("Indirizzo (URL) di un articolo in {lingua}:", { lingua: nl(this.lingua) }) }), campo),
    bottoni: [{ testo: T("Annulla"), valore: false }, { testo: "OK", valore: true, stile: "primario" }] });
    let indirizzo = campo.value.trim();
    if (!ok || !indirizzo) return;
    if (!/^https?:\/\//.test(indirizzo)) indirizzo = "https://" + indirizzo;
    const r = await this.scaricaArticolo(async () => {
      const risposta = await fetch(indirizzo);
      return estraiArticolo(await risposta.text());
    });
    if (r) this.proponiArticolo(r.titolo, r.testo, indirizzo, () => this.articoloDaIndirizzo());
  }
  async articoloWikinews() {
    const r = await this.scaricaArticolo(() => articoloWikinews(this.lingua));
    if (r) this.proponiArticolo(r.titolo, r.testo, r.fonte, () => this.articoloWikinews());
  }
  async articoloIncollato() {
    if (!this.utente) return;
    const titolo = el("input", { id: "art-titolo", type: "text", autocomplete: "off" });
    const testo = el("textarea", { id: "art-testo", rows: "10", dir: direzione(this.lingua) });
    const ok = await this.modale({ titolo: T("Incolla l'articolo"), largo: true, contenuto: el("div", { class: "modulo" },
      el("label", { class: "campo", for: "art-titolo" }, el("span", { class: "etichetta", testo: T("Titolo:") }), titolo),
      el("label", { class: "campo", for: "art-testo" }, el("span", { class: "etichetta", testo: T("Testo dell'articolo in {lingua}:", { lingua: nl(this.lingua) }) }), testo)),
    bottoni: [{ testo: T("Annulla"), valore: false }, { testo: T("Usa questo articolo"), valore: true, stile: "primario" }] });
    const contenuto = testo.value.trim();
    if (ok && contenuto) this.impostaArticolo(titolo.value.trim() || contenuto.split("\n")[0].slice(0, 80), contenuto);
  }
  cambiaArticolo() {
    const a = this.utente && this.datiArticolo();
    if (a && a.fonte && !a.fonte.includes("wikinews.org")) this.articoloDaIndirizzo();
    else if (a && !a.fonte) this.articoloIncollato();
    else this.articoloWikinews();
  }
  async frasiDallArticolo(quante) {
    const a = this.datiArticolo();
    if (!a) { await this.avviso(T("Articolo"), T("Scegli prima un articolo con i pulsanti del livello 5.")); return null; }
    const frasi = dividiInFrasi(a.testo);
    a.totale = frasi.length;
    if (a.posizione >= frasi.length) {
      if (!(await this.conferma(T("Articolo"), T("Hai finito questo articolo! Vuoi rileggerlo dall'inizio?\n(Altrimenti scegline uno nuovo.)")))) return null;
      a.posizione = 0;
    }
    const elenco = [];
    for (let i = a.posizione; i < Math.min(a.posizione + quante, frasi.length); i++) elenco.push({ id: `a${i}`, [this.lingua]: frasi[i], _testo: true, _indice: i });
    return elenco;
  }

  // ------------------------------------------------------------ inizio della sessione
  async inizia() {
    if (this.lavoro || !this.utente) return;
    if (!this.livelloSbloccato(this.lingua, this.livello)) return;
    await this.permessoMicrofono();
    // la voce del browser va «sbloccata» da un tocco: si pronuncia un testo vuoto subito
    try { speechSynthesis.speak(new SpeechSynthesisUtterance(" ")); } catch (e) { /* niente voce */ }
    const quante = Math.max(1, this.quante);
    let frasi;
    if (this.livello === 0) {
      this.vocaboliSessione = [...this.vocabolarioPersonale(), ...DATI.vocaboli];
      frasi = scegliParole(this.vocaboliSessione, this.prog(0)[this.chiave(this.lingua)] || {}, quante, +this.impostazioni().parole_nuove);
    } else if (this.livello === 5 || (this.livello === 6 && this.fonte === "articolo")) {
      frasi = await this.frasiDallArticolo(quante);
    } else if ([4, 6].includes(this.livello) && this.fonte === "libro") {
      if (!this.datiLibro()) { await this.avviso(T("Libro"), T("Scegli prima un libro con il pulsante «Scegli libro...».")); return; }
      frasi = await this.frasiDalLibro(quante);
    } else if ([4, 6].includes(this.livello)) {
      frasi = scegliFrasi(DATI.frasi4, this.prog(this.livello)[this.chiave(this.lingua)] || {}, quante);
    } else {
      frasi = scegliFrasi(DATI.frasi, this.prog(this.livello)[this.chiave(this.lingua)] || {}, quante);
    }
    if (!frasi || !frasi.length) return;
    this.ricordaLingue();
    this.sessione = { lingua: this.lingua, madre: this.madre, livello: this.livello, frasi: 0, risposte: 0, errori: 0, inizio: Date.now() };
    this.dettaglio = []; this.indiceDettaglio = {}; this.voceCorrente = null;
    this.preparaEsercizio();
    this.mostra("esercizio");
    this.tieniSchermoAcceso(true);
    this.lavoro = new Esercizio(this, this.livello, this.lingua, frasi, { istruzioni: this.istruzioniVoce, mostraTesto: this.mostraTesto });
    this.lavoro.esegui();
  }
  async tieniSchermoAcceso(si) {
    try {
      if (si && "wakeLock" in navigator) this.blocco = await navigator.wakeLock.request("screen");
      else if (!si && this.blocco) { await this.blocco.release(); this.blocco = null; }
    } catch (e) { /* non disponibile */ }
  }
  // Chiede il microfono una volta sola, al primo «Inizia»: così il browser non lo richiede a ogni risposta
  // (sugli indirizzi https il permesso resta anche per le volte successive)
  async permessoMicrofono() {
    if (this.microfonoChiesto || !Riconoscimento.disponibile || !navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return;
    this.microfonoChiesto = true;
    try {
      const flusso = await navigator.mediaDevices.getUserMedia({ audio: true });
      flusso.getTracks().forEach((t) => t.stop());
    } catch (e) {
      if (e && e.name === "NotAllowedError") Riconoscimento.negato = true;
    }
  }
  async provaMicrofono() {
    if (this.lavoro) return;
    await this.permessoMicrofono();
    this.sessione = null;
    this.dettaglio = []; this.indiceDettaglio = {}; this.voceCorrente = null;
    this.preparaEsercizio(true);
    this.mostra("esercizio");
    this.lavoro = new ProvaMicrofono(this);
    this.lavoro.esegui();
  }
  esitoProvaMicrofono(testo) {
    if (testo) this.avviso(T("Prova microfono"), T("Ho capito:\n\n«{testo}»\n\nSe è giusto, il microfono funziona.", { testo }));
    else this.avviso(T("Prova microfono"), T("Non ho sentito nulla."));
  }

  // ------------------------------------------------------------ schermata dell'esercizio
  costruisciEsercizio() {
    const s = $("#esercizio");
    s.replaceChildren(
      el("div", { class: "testa-esercizio" },
        el("p", { id: "progresso", class: "progresso" }),
        el("p", { id: "contatore", class: "contatore" })),
      el("p", { id: "stato", class: "stato", role: "status", "aria-live": "polite" }),
      el("div", { class: "pagine" },
        el("section", { class: "pagina" }, el("h3", { id: "titolo-sx", class: "titolo-pagina" }),
          el("div", { id: "log-sx", class: "log", onclick: (e) => this.toccaParola(e) })),
        el("section", { class: "pagina" }, el("h3", { id: "titolo-dx", class: "titolo-pagina" }),
          el("div", { id: "log-dx", class: "log" }))),
      el("div", { id: "zona-risposta", class: "zona-risposta", hidden: true }),
      el("div", { class: "barra-comandi" },
        el("button", { id: "btn-pausa", class: "btn", onclick: () => this.pausa() }, T("Pausa")),
        el("button", { id: "btn-salta", class: "btn", onclick: () => this.lavoro && this.lavoro.salta() }, T("Salta frase")),
        el("button", { id: "btn-nonloso", class: "btn", disabled: true, onclick: () => this.lavoro && this.lavoro.nonLoSo() }, T("Non lo so")),
        el("button", { id: "btn-rivedi", class: "btn", hidden: true, onclick: () => this.apriRiepilogo(this.dettaglio) }, T("Rivedi la sessione")),
        el("button", { id: "btn-termina", class: "btn pericolo", onclick: () => this.termina() }, T("Termina sessione"))));
  }
  preparaEsercizio(prova = false) {
    $("#log-sx").replaceChildren(); $("#log-dx").replaceChildren();
    $("#log-sx").dir = direzione(this.lingua); $("#log-dx").dir = direzione(this.madre);
    $("#titolo-sx").textContent = NL(this.lingua);
    $("#titolo-dx").textContent = NL(this.madre);
    $("#progresso").textContent = prova ? T("Prova microfono") : "";
    $("#contatore").textContent = "";
    $("#stato").textContent = ""; $("#stato").className = "stato";
    for (const id of ["btn-pausa", "btn-salta"]) { $("#" + id).disabled = false; $("#" + id).hidden = false; }
    $("#btn-nonloso").hidden = false;
    $("#btn-pausa").textContent = T("Pausa");
    $("#btn-rivedi").hidden = true;
    $("#btn-termina").textContent = T("Termina sessione");
    this.nascondiRisposta();
    this.aggiornaContatore();
  }
  pausa() {
    if (!this.lavoro) return;
    const inPausa = this.lavoro.cambiaPausa();
    $("#btn-pausa").textContent = inPausa ? T("Riprendi") : T("Pausa");
    if (inPausa) { Voce.ferma(); this.stato(T("In pausa"), "grigio"); }
  }
  termina() {
    if (this.lavoro) { this.lavoro.termina(); return; }
    this.tornaAllInizio();
  }
  tornaAllInizio() {
    this.chiudiPopup();
    this.tieniSchermoAcceso(false);
    this.mostra("inizio");
    this.aggiornaInfo();
  }
  lavoroFinito() {
    const sessioneAperta = this.sessione;
    this.lavoro = null;
    this.nascondiRisposta();
    if (sessioneAperta) {
      // sessione interrotta con «Termina»: si registra quello che è stato fatto
      this.registraSessione();
      this.modoRevisione();
    } else if (!this.revisione) this.tornaAllInizio();
    this.revisione = false;
  }
  modoRevisione() {
    this.revisione = true;
    for (const id of ["btn-pausa", "btn-salta", "btn-nonloso"]) $("#" + id).hidden = true;
    $("#btn-rivedi").hidden = !this.dettaglio.length;
    $("#btn-termina").textContent = T("Torna al menu");
    if (!this.dettaglio.length) this.tornaAllInizio();
  }
  errore(e) { this.avviso(T("Errore"), String(e && e.message || e)); }

  stato(testo, colore = "") {
    const s = $("#stato");
    s.textContent = testo;
    s.className = "stato " + (colore ? "stato-" + colore : "");
  }
  statoProva(attiva) { $("#btn-nonloso").disabled = !attiva; }
  aggiornaContatore() {
    const s = this.sessione, imp = this.impostazioni(), c = $("#contatore");
    if (!s) { c.textContent = ""; return; }
    const perc = s.risposte ? Math.round(s.errori * 100 / s.risposte) : 0;
    c.textContent = T("Errori: {errori} su {risposte} risposte ({perc}%, max {errori_max_percento}%)",
      { errori: s.errori, risposte: s.risposte, perc, errori_max_percento: imp.errori_max_percento });
    c.className = "contatore " + (perc > +imp.errori_max_percento ? "testo-sbagliato" : "testo-giusto");
  }

  // righe dei due quaderni
  riga(lato, classe, ...contenuto) {
    const log = $(lato === "sx" ? "#log-sx" : "#log-dx");
    const r = el("p", { class: "riga " + (classe || "") }, ...contenuto);
    log.append(r);
    log.scrollTop = log.scrollHeight;
    return r;
  }
  parole(coppie, lingua) {
    // in arabo colorare le singole parole ne altera l'ordine: si colora la frase intera
    if (lingua === "ar") {
      const sbagliate = coppie.filter(([, g]) => !g).map(([p]) => p);
      return [el("span", { class: sbagliate.length ? "parola-ko" : "parola-ok" }, sbagliate.length ? T("da correggere:") + " " + sbagliate.join("  ") : T("tutto giusto"))];
    }
    return coppie.map(([p, g]) => el("span", { class: g ? "parola-ok" : "parola-ko" }, p + " "));
  }
  percentuale(esito) { return el("span", { class: "perc " + (esito.superata ? "testo-giusto" : "testo-sbagliato") }, ` ${Math.round(esito.punteggio * 100)}%`); }

  voceDettaglio(elemento, lingua) {
    const chiave = String(elemento.id);
    if (!this.indiceDettaglio[chiave]) {
      const voce = { straniera: elemento[lingua], madre: elemento[this.madre] || "", ok: null, risposte: [], id: elemento.id,
        tipo: this.tipoElemento(elemento), cod_madre: this.madre };
      if (lingua === "ar" && elemento.ar_translit) voce.translit = elemento.ar_translit;
      this.indiceDettaglio[chiave] = voce;
      this.dettaglio.push(voce);
    }
    this.voceCorrente = this.indiceDettaglio[chiave];
    this.voceCorrente._frase = elemento;
    return this.voceCorrente;
  }
  tipoElemento(e) {
    if (String(e.id).startsWith("p")) return "personale";
    if (e._testo) return "testo";
    if (this.livello === 0) return "parola";
    return [4, 6].includes(this.livello) ? "frase4" : "frase";
  }
  annota(etichetta, testo, giusta) {
    if (this.voceCorrente) this.voceCorrente.risposte.push([etichetta, testo || "", !!giusta]);
  }

  nuovaFrase(n, totale, frase, lingua, verso) {
    this.voceDettaglio(frase, lingua);
    $("#progresso").textContent = T("{utente}  ·  Livello {livello}  ·  Frase {n} di {totale}", { utente: this.utente, livello: this.livello, n, totale });
    const numero = el("span", { class: "numero" }, `${n}.`);
    const frasePagina = (testo, l) => el("span", { class: "frase", lang: l, dir: direzione(l) }, testo);
    if (verso === "lettura") {
      this.riga("sx", "inizio-frase", numero, frasePagina(frase[lingua], lingua));
      this.riga("dx", "inizio-frase", el("span", { class: "numero" }, `${n}.`));
    } else if (verso === "orale") {
      this.riga("sx", "inizio-frase", numero, el("span", { class: "tenue" }, T("(ascolta la frase)")));
      this.riga("dx", "inizio-frase", el("span", { class: "numero" }, `${n}.`));
    } else if (verso === "inversa_testi" || verso === "inversa_orale") {
      this.riga("sx", "inizio-frase", numero, el("span", { class: "tenue" }, T("(di' la traduzione in {lingua})", { lingua: nl(lingua) })));
      this.riga("dx", "inizio-frase", el("span", { class: "numero" }, `${n}.`), verso === "inversa_testi" ? frasePagina(frase[this.madre], this.madre)
        : el("span", { class: "tenue" }, T("(ascolta la frase in {lingua})", { lingua: nl(this.madre) })));
    } else if (verso === "originale") {
      if (this.mostraTesto) {
        this.riga("sx", "inizio-frase", numero, frasePagina(frase[lingua], lingua));
        if (lingua === "ar" && frase.ar_translit) this.riga("sx", "translit", frase.ar_translit);
      } else this.riga("sx", "inizio-frase", numero, el("span", { class: "tenue" }, T("(ascolta la frase)")));
      this.riga("dx", "inizio-frase", el("span", { class: "numero" }, `${n}.`));
    } else if (verso === "ascolto") {
      this.riga("sx", "inizio-frase", numero, el("span", { class: "tenue" }, T("(ascolta e scrivi la frase nel riquadro in basso)")));
      this.riga("dx", "inizio-frase", el("span", { class: "numero" }, `${n}.`));
    } else if (verso === "ascolto_italiano") {
      this.riga("sx", "inizio-frase", numero, el("span", { class: "tenue" }, T("(scrivi la traduzione nel riquadro in basso)")));
      this.riga("dx", "inizio-frase", el("span", { class: "numero" }, `${n}.`), el("span", { class: "tenue" }, T("(ascolta la frase in {lingua})", { lingua: nl(this.madre) })));
    } else {
      this.riga("sx", "inizio-frase", numero, el("span", { class: "tenue" }, T("(scrivi la traduzione nel riquadro in basso)")));
      this.riga("dx", "inizio-frase", el("span", { class: "numero" }, `${n}.`), frasePagina(frase[this.madre], this.madre));
    }
  }
  nuovaParola(n, totale, p, lingua, fase) {
    this.voceDettaglio(p, lingua);
    $("#progresso").textContent = T("{utente}  ·  Livello 0  ·  {fase}: parola {n} di {totale}", { utente: this.utente, fase: T(fase), n, totale });
    if (n === 1) {
      const titoli = { Scopri: T("1. SCOPRI le parole nuove"), Riconosci: T("2. RICONOSCI le parole"), Ricorda: T("3. RICORDA: ripeti e traduci") };
      this.riga("sx", "sezione", titoli[fase]); this.riga("dx", "sezione", titoli[fase]);
    }
    if (fase === "Scopri" || this.mostraTesto) {
      this.riga("sx", "inizio-frase", el("span", { class: "numero" }, `${n}.`), el("span", { class: "frase", lang: lingua, dir: direzione(lingua) }, p[lingua]));
      if (lingua === "ar" && p.ar_translit) this.riga("sx", "translit", p.ar_translit);
    } else this.riga("sx", "inizio-frase", el("span", { class: "numero" }, `${n}.`), el("span", { class: "tenue" }, T("(ascolta la parola)")));
    if (fase === "Scopri") {
      this.riga("dx", "inizio-frase", el("span", { class: "numero" }, `${n}.`), el("span", { class: "frase", lang: this.madre }, p[this.madre]),
        el("span", { class: "tenue" }, `  (${T(p.tema).toLowerCase()})`));
    } else this.riga("dx", "inizio-frase", el("span", { class: "numero" }, `${n}.`));
  }
  esitoRipetizione(tentativo, esito, lingua, etichetta = "Ripetizione") {
    if (etichetta !== "Ripeti") this.annota(etichetta, esito.testo_detto, esito.superata);
    this.riga("sx", "esito", el("span", { class: "etichetta-esito" }, `${T(etichetta)} ${tentativo}:`), ...this.parole(esito.rif, lingua),
      etichetta === "Ripeti" ? null : this.percentuale(esito));
    this.riga("sx", "detto", T("    Hai detto: {x}\n", { x: esito.testo_detto || T("(niente)") }).trim());
  }
  esitoTraduzione(tentativo, esito) {
    this.annota("Traduzione", esito.testo_detto, esito.superata);

    this.salva();

        fine: (alternative) => {

        },
        errore: (codice) => {
