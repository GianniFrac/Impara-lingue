  // ------------------------------------------------------------ traduzione delle parole toccate
  toccaParola(evento) {
    let testo = (window.getSelection && String(window.getSelection())).trim();
    if (!testo) {
      const bersaglio = evento.target.closest(".frase, .parola-ok, .parola-ko, .detto");
      if (!bersaglio) return;
      let range = null;
      if (document.caretRangeFromPoint) range = document.caretRangeFromPoint(evento.clientX, evento.clientY);
      else if (document.caretPositionFromPoint) {
        const p = document.caretPositionFromPoint(evento.clientX, evento.clientY);
        if (p) { range = document.createRange(); range.setStart(p.offsetNode, p.offset); }
      }
      if (!range || range.startContainer.nodeType !== 3) return;
      const s = range.startContainer.textContent, i = range.startOffset;
      const parola = /[\p{L}\p{M}'’-]/u;
      let a = i, b = i;
      while (a > 0 && parola.test(s[a - 1])) a--;
      while (b < s.length && parola.test(s[b])) b++;
      testo = s.slice(a, b);
    }
    testo = testo.split(/\s+/).join(" ").replace(/^[\s.,;:!?¿¡«»"'()“”‘’]+|[\s.,;:!?¿¡«»"'()“”‘’]+$/g, "");
    if (!testo || testo.length > 200) return;
    this.apriPopup(testo, evento.clientX, evento.clientY);
  }
  async apriPopup(testo, x, y) {
    const p = $("#popup");
    const corpo = el("p", { class: "popup-traduzione" }, "…");
    p.replaceChildren(el("p", { class: "popup-parola", dir: direzione(this.lingua) }, testo), corpo,
      el("button", { class: "btn piccolo", onclick: () => Voce.pronuncia(testo, this.lingua, +archivio.impostazioni.velocita, () => {}) }, "🔊 " + T("Ascolta")));
    p.hidden = false;
    const larghezza = Math.min(320, window.innerWidth - 32);
    p.style.left = Math.max(16, Math.min(x - larghezza / 2, window.innerWidth - larghezza - 16)) + "px";
    p.style.top = Math.min(y + 16, window.innerHeight - 160) + "px";
    p.style.width = larghezza + "px";
    clearTimeout(this.timerPopup);
    this.timerPopup = setTimeout(() => this.chiudiPopup(), 9000);
    const lingua = this.lingua, madre = this.madre;
    const risultato = await traduciOnline(testo, lingua, madre);
    if (p.hidden) return;
    if (!risultato) { corpo.textContent = T("Traduzione non disponibile (serve la connessione a Internet)."); return; }
    corpo.textContent = risultato;
    if (this.aggiungiAlVocabolario(testo, risultato)) corpo.append(el("span", { class: "aggiunta" }, "✓ " + T("aggiunta al tuo vocabolario")));
  }
  chiudiPopup() { $("#popup").hidden = true; }
  aggiungiAlVocabolario(parola, traduzione) {
    parola = parola.replace(/^[\s.,;:!?¿¡«»"'()“”‘’]+|[\s.,;:!?¿¡«»"'()“”‘’]+$/g, "");
    traduzione = String(traduzione).split(/\s+/).join(" ").replace(/^[ .]+|[ .]+$/g, "");
    if (!this.utente || !parola || !traduzione || parola.split(" ").length > 4) return false;
    const elenco = this.vocabolarioPersonale();
    const norm = normalizza(parola, this.lingua).join(" ");
    if (elenco.some((v) => normalizza(v[this.lingua], this.lingua).join(" ") === norm)) return false;
    const numero = Math.max(0, ...elenco.map((v) => +String(v.id).slice(1) || 0)) + 1;
    elenco.push({ id: `p${numero}`, tema: "Il mio vocabolario", [this.lingua]: parola, [this.madre]: traduzione });
    this.salva();
    return true;
  }

  // ------------------------------------------------------------ traduzioni alternative
  async aggiungiAlternativa(tipo, id, madre, risposta, fraseGiusta) {
    risposta = String(risposta).split(/\s+/).join(" ").replace(/^[ .]+|[ .]+$/g, "");
    if (!risposta || !["parola", "frase", "frase4", "personale"].includes(tipo)) return false;
    risposta = risposta.charAt(0).toUpperCase() + risposta.slice(1);
    if (!(await this.conferma(T("Aggiungi traduzione"), T("Aggiungere «{risposta}» tra le traduzioni giuste di «{frase}»?\n\nDa ora in poi verrà accettata.", { risposta, frase: fraseGiusta })))) return false;
    const campo = `${madre}_alt`;
    if (tipo === "personale") {
      for (const e of this.vocabolarioPersonale()) if (e.id === id) (e[campo] = e[campo] || []).push(risposta);
    } else {
      const alt = archivio.alternative[tipo] || (archivio.alternative[tipo] = {});
      const voce = alt[String(id)] || (alt[String(id)] = {});
      const elenco = voce[campo] || (voce[campo] = []);
      if (!elenco.includes(risposta)) elenco.push(risposta);
      const fonte = { parola: DATI.vocaboli, frase: DATI.frasi, frase4: DATI.frasi4 }[tipo];
      const e = fonte.find((x) => String(x.id) === String(id));
      if (e && !(e[campo] || []).includes(risposta)) (e[campo] = e[campo] || []).push(risposta);
    }
    this.salva();
    return true;
  }

  // ------------------------------------------------------------ riepilogo e registro
  apriRiepilogo(dettaglio, titolo) {
    const corpo = el("div", { class: "riepilogo" });
    if (!dettaglio || !dettaglio.length) corpo.append(el("p", { testo: T("Nessun dettaglio per questa sessione.") }));
    const gruppi = [[T("Da ripassare"), dettaglio.filter((d) => d.ok === false), false], [T("Giuste"), dettaglio.filter((d) => d.ok), true]];
    for (const [intestazione, gruppo, ok] of gruppi) {
      if (!gruppo.length) continue;
      corpo.append(el("h3", { class: "sezione-riepilogo" }, `${intestazione} (${gruppo.length})`));
      for (const d of gruppo) {
        const voce = el("div", { class: "voce-riepilogo " + (ok ? "giusta" : "sbagliata") },
          el("p", { class: "frase", dir: "auto" }, (ok ? "✓  " : "✗  ") + d.straniera),
          d.translit ? el("p", { class: "translit", testo: d.translit }) : null,
          d.madre ? el("p", { class: "traduzione", dir: "auto", testo: "= " + d.madre }) : null);
        for (const [etichetta, risposta, giusta] of d.risposte || []) {
          const riga = el("p", { class: "risposta-riepilogo" }, el("span", { class: "tenue" }, T(etichetta) + ": "),
            el("span", { class: giusta ? "testo-giusto" : "testo-sbagliato", dir: "auto" }, (risposta || T("(niente)")) + (giusta ? "  ✓" : "  ✗")));
          if (etichetta === "Traduzione" && !giusta && (risposta || "").trim() && "id" in d && d.tipo !== "testo") {
            const link = el("button", { class: "collegamento", onclick: async () => {
              if (await this.aggiungiAlternativa(d.tipo || "frase", d.id, d.cod_madre || this.madre, risposta, d.madre)) {
                link.replaceWith(el("span", { class: "testo-giusto" }, " " + T("[aggiunta ✓]")));
              }
            } }, " " + T("[+ era giusta]"));
            riga.append(link);
          }
          voce.append(riga);
        }
        corpo.append(voce);
      }
    }
    this.modale({ titolo: titolo || T("Riepilogo della sessione"), contenuto: corpo, largo: true, bottoni: [{ testo: T("Chiudi"), valore: true, stile: "primario" }] });
  }
  apriRegistro() {
    if (!this.utente) return;
    const reg = [...this.datiUtente().registro].reverse();
    const corpo = el("div", { class: "registro" });
    if (!reg.length) corpo.append(el("p", { testo: T("Nessuna sessione registrata.") }));
    const tabella = el("table", {},
      el("thead", {}, el("tr", {}, [T("Data"), T("Lingue"), T("Livello"), T("Frasi"), T("Errori"), T("Esito")].map((t) => el("th", { testo: t })))),
      el("tbody", {}, reg.map((r) => {
        const perc = r.risposte ? Math.round(r.errori * 100 / r.risposte) : 0;
        const tr = el("tr", { class: r.dettaglio && r.dettaglio.length ? "apribile" : "", tabindex: "0" },
          el("td", { testo: r.data }), el("td", { testo: `${NL(r.madre || "it")} → ${NL(r.lingua)}` }), el("td", { class: "num", testo: String(r.livello) }),
          el("td", { class: "num", testo: String(r.frasi) }), el("td", { class: "num", testo: `${r.errori}/${r.risposte} (${perc}%)` }),
          el("td", { class: r.superata ? "testo-giusto" : "tenue", testo: (r.superata ? T("superata") : "—") + (r.collaudo ? " · " + T("collaudo") : "") }));
        const apri = () => r.dettaglio && r.dettaglio.length && this.apriRiepilogo(r.dettaglio, `${r.data} · ${NL(r.lingua)} · ${T("Livello:")} ${r.livello}`);
        tr.addEventListener("click", apri);
        tr.addEventListener("keydown", (e) => { if (e.key === "Enter") apri(); });
        return tr;
      })));
    if (reg.length) corpo.append(el("p", { class: "nota", testo: T("Tocca una sessione per rivederne le domande e le risposte.") }), el("div", { class: "tabella-scorre" }, tabella));
    this.modale({ titolo: T("Registro") + " · " + this.utente, contenuto: corpo, largo: true, bottoni: [{ testo: T("Chiudi"), valore: true, stile: "primario" }] });
  }

  // ------------------------------------------------------------ impostazioni
  async apriImpostazioni() {
    const imp = this.impostazioni();
    const numero = (id, valore, min, max, passo = 1) => el("input", { id, type: "number", min: String(min), max: String(max), step: String(passo), value: String(valore), inputmode: "numeric" });
    const campi = {
      errori: numero("imp-errori", imp.errori_max_percento, 0, 100),
      minime: numero("imp-minime", imp.frasi_minime, 1, 100),
      tentativi: numero("imp-tentativi", imp.tentativi, 1, 5),
      nuove: numero("imp-nuove", imp.parole_nuove, 3, 30),
      aderenza: numero("imp-aderenza", imp.aderenza_minima, 0, 100, 5),
      inverse: numero("imp-inverse", imp.frasi_inverse_4, 0, 100, 5),
      velocita: el("input", { id: "imp-velocita", type: "range", min: "-6", max: "4", step: "1", value: String(imp.velocita) }),
      indulgente: el("select", { id: "imp-indulgente" }, [[-1, T("mai")], [0, T("solo livello 0")], [1, T("livelli 0 e 1")], [2, T("livelli 0, 1 e 2")], [9, T("tutti i livelli")]]
        .map(([v, t]) => el("option", { value: String(v), selected: +imp.indulgente_fino_a === v || (v === 9 && +imp.indulgente_fino_a > 2) }, t))),
      collaudo: el("input", { id: "imp-collaudo", type: "checkbox", checked: !!imp.collaudo }),
    };
    const riga = (id, testo, campo, spiegazione) => el("div", { class: "riga-impostazione" },
      el("label", { for: id, testo }), campo, spiegazione ? el("p", { class: "nota", testo: spiegazione }) : null);
    const corpo = el("div", { class: "impostazioni" },
      el("h3", { testo: T("Livelli") }),
      riga("imp-minime", T("Frasi minime nella sessione:"), campi.minime),
      riga("imp-errori", T("Errori massimi (% delle risposte):"), campi.errori),
      el("label", { class: "spunta" }, campi.collaudo, T("Modalità collaudo: tutti i livelli sbloccati")),
      el("h3", { testo: T("Esercizi") }),
      riga("imp-tentativi", T("Tentativi per ogni prova:"), campi.tentativi),
      riga("imp-nuove", T("Parole nuove per sessione (livello 0):"), campi.nuove),
      riga("imp-indulgente", T("Pronuncia valutata con indulgenza:"), campi.indulgente,
        T("Con l'indulgenza una pronuncia imperfetta viene accettata, purché le parole siano quelle giuste. La traduzione nella tua lingua è sempre valutata con indulgenza.")),
      riga("imp-aderenza", T("Aderenza minima della traduzione (livello 4, %):"), campi.aderenza),
      riga("imp-inverse", T("% di frasi in {lingua} (livello 4):", { lingua: nl(this.madre) }), campi.inverse,
        T("Queste frasi arrivano nella tua lingua e le traduci nella lingua da imparare; le altre arrivano nella lingua da imparare. 0 = nessuna, 100 = tutte.")),
      el("h3", { testo: T("Voce") }),
      riga("imp-velocita", T("Velocità della voce (lingua da imparare):"), el("div", { class: "riga-stretta" }, campi.velocita,
        el("button", { class: "btn piccolo", onclick: () => Voce.pronuncia(DATI.frasi[0][this.lingua], this.lingua, +campi.velocita.value, () => {}) }, "🔊 " + T("Prova")))));
    const ok = await this.modale({ titolo: T("Impostazioni"), contenuto: corpo, largo: true,
      bottoni: [{ testo: T("Annulla"), valore: false }, { testo: T("Salva"), valore: true, stile: "primario" }] });
    if (!ok) return;
    const n = (c, min, max) => Math.min(max, Math.max(min, Math.round(+c.value || 0)));
    Object.assign(imp, {
      errori_max_percento: n(campi.errori, 0, 100), frasi_minime: n(campi.minime, 1, 100), tentativi: n(campi.tentativi, 1, 5),
      parole_nuove: n(campi.nuove, 1, 50), aderenza_minima: n(campi.aderenza, 0, 100), frasi_inverse_4: n(campi.inverse, 0, 100),
      velocita: n(campi.velocita, -10, 10), indulgente_fino_a: +campi.indulgente.value, collaudo: campi.collaudo.checked,
    });
    this.salva();
    this.aggiornaInfo();
  }

  // ------------------------------------------------------------ copia dei dati (esporta / importa)
  async apriCopia() {
    const dati = JSON.stringify({ programma: "Impara le Lingue", versione: 1, utenti: this.utenti, impostazioni: archivio.impostazioni,
      alternative: archivio.alternative }, null, 1);
    const area = el("textarea", { id: "copia-dati", rows: "6", readonly: true }, dati);
    const file = el("input", { type: "file", id: "file-copia", accept: ".json,application/json", hidden: true,
      onchange: async (e) => { const f = e.target.files[0]; if (f) await this.importa(await f.text()); } });
    const corpo = el("div", { class: "modulo" },
      el("p", { class: "a-capo", testo: T("I progressi restano solo su questo dispositivo e in questo browser. Salva una copia ogni tanto, oppure per passarli a un altro dispositivo.") }),
      el("div", { class: "riga-stretta a-capo-flex" },
        el("button", { class: "btn", onclick: () => this.scaricaCopia(dati) }, T("Scarica la copia")),
        el("button", { class: "btn", onclick: async () => {
          try { await navigator.clipboard.writeText(dati); this.toast(T("Copiato.")); } catch (e) { area.select(); this.toast(T("Seleziona il testo e copialo.")); }
        } }, T("Copia il testo")),
        el("button", { class: "btn", onclick: () => file.click() }, T("Carica una copia...")), file),
      el("p", { class: "nota", testo: T("Puoi caricare anche il file utenti.json del programma per Windows: i progressi passano sul tablet.") }),
      area);
    await this.modale({ titolo: T("Copia dei dati"), contenuto: corpo, largo: true, bottoni: [{ testo: T("Chiudi"), valore: true, stile: "primario" }] });
  }
  async scaricaCopia(testo) {
    const nome = `impara_lingue_${new Date().toISOString().slice(0, 10)}.json`;
    // dentro claude.ai il salvataggio passa dalla funzione «downloads»; altrove si usa un normale download
    try {
      const downloads = window.claude && window.claude.use ? await window.claude.use("downloads") : null;
      if (downloads) {
        try { await downloads.save({ filename: nome, data: testo }); } catch (e) {
          if (e && e.code !== "declined") this.toast(T("Il download non è permesso qui: usa «Copia il testo»."));
        }
        return;
      }
    } catch (e) { /* si prova il download normale */ }
    try {
      const a = el("a", { href: URL.createObjectURL(new Blob([testo], { type: "application/json" })),
        download: nome });
      document.body.append(a); a.click(); a.remove();
    } catch (e) { this.toast(T("Il download non è permesso qui: usa «Copia il testo».")); }
  }
  async importa(testo) {
    let dati;
    try { dati = JSON.parse(testo); } catch (e) { await this.avviso(T("Copia dei dati"), T("Il file non è una copia valida.")); return; }
    // copia di questa app, oppure utenti.json del programma per Windows
    const utenti = dati.programma ? dati.utenti : dati.utenti && !dati.utenti.utenti ? dati : null;
    if (!utenti || !utenti.utenti) { await this.avviso(T("Copia dei dati"), T("Il file non è una copia valida.")); return; }
    const nomi = Object.keys(utenti.utenti);
    if (!(await this.conferma(T("Copia dei dati"), T("Caricare {n} partecipanti ({nomi})? Chi ha lo stesso nome viene sostituito.", { n: nomi.length, nomi: nomi.join(", ") })))) return;
    Object.assign(this.utenti.utenti, utenti.utenti);
    if (dati.impostazioni) Object.assign(archivio.impostazioni, dati.impostazioni);
    if (dati.alternative) {
      for (const [tipo, voci] of Object.entries(dati.alternative)) {
        const qui = archivio.alternative[tipo] || (archivio.alternative[tipo] = {});
        for (const [id, campi] of Object.entries(voci)) {
          const v = qui[id] || (qui[id] = {});
          for (const [c, valori] of Object.entries(campi)) v[c] = [...new Set([...(v[c] || []), ...valori])];
        }
      }
      this.applicaAlternative();
    }
    this.utente = utenti.ultimo && this.utenti.utenti[utenti.ultimo] ? utenti.ultimo : nomi[0];
    this.salva();
    $("#modale").hidden = true;
    this.cambiaUtente(this.utente);
    this.toast(T("Dati caricati."));
  }
}

window.addEventListener("DOMContentLoaded", () => {
  window.app = new App();
  document.addEventListener("click", (e) => {
    if (!e.target.closest("#popup") && !e.target.closest("#log-sx")) window.app.chiudiPopup();
  });
});

</script>
