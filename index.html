<style>
/* Quaderno a due pagine: a sinistra la lingua da imparare, a destra la tua; la risposta in basso. */
:root {
  --carta: #eef1f6;

  --attenzione: #9a5200;
  --attenzione-fondo: #fcefd8;

  --f-ui: "Atkinson Hyperlegible", "Noto Naskh Arabic", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-testo: "Literata", "Noto Naskh Arabic", Georgia, "Times New Roman", serif;
  --raggio: 10px;
}

  :root:not([data-theme="light"]) {
    --carta: #11151c; --foglio: #1a2029; --inchiostro: #e5e9f0; --tenue: #9aa4b5; --linea: #2d3542;
    --accento: #86a6f4; --accento-tenue: #23304d; --su-accento: #0e1420;
    --giusto: #72d29b; --giusto-fondo: #183022; --sbagliato: #ff8f86; --sbagliato-fondo: #3a1d1b;
    --attenzione: #f0b45e; --attenzione-fondo: #392913; --ombra: 0 1px 2px rgba(0,0,0,.3), 0 4px 16px rgba(0,0,0,.25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --carta: #11151c; --foglio: #1a2029; --inchiostro: #e5e9f0; --tenue: #9aa4b5; --linea: #2d3542;
  --accento: #86a6f4; --accento-tenue: #23304d; --su-accento: #0e1420;

html, body { height: 100%; }
body {

}

/* ---------- esercizio ---------- */

.testa-esercizio { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 4px 16px; }

.stato-arancio { color: var(--attenzione); } .stato-grigio { color: var(--tenue); }

  background: var(--accento-tenue); cursor: pointer; display: grid; place-items: center; font-size: 1.6rem;
}

.scelta {

}

.confronto p { margin: 2px 0; overflow-wrap: anywhere; }

/* ---------- finestre ---------- */
#modale {
  position: fixed; inset: 0; z-index: 20; background: rgba(15, 20, 30, .45);
  display: grid; place-items: center;
  padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
}
.finestra { background: var(--foglio); border-radius: 16px; width: min(480px, 100%); max-height: calc(100vh - 32px); max-height: calc(100dvh - 32px - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; box-shadow: 0 20px 60px rgba(0,0,0,.3); }
.finestra.larga { width: min(820px, 100%); }
.finestra-testa { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 14px 18px; border-bottom: 1px solid var(--linea); }
.finestra-testa h2 { margin: 0; font: 600 1.15rem/1.3 var(--f-testo); text-wrap: balance; }

e","ar":"البطاقة","ar_translit":"al-biṭāqa"},{"id":188,"tema":"Salute e altro","it":"la lingua","it_alt":[],"en":"language","fr":"la langue","es":"el idioma","de":"die Sprache","ar":"اللغة","ar_translit":"al-lugha"},{"id":189,"tema":"Salute e altro","it":"la parola","it_alt":[],"en":"word","fr":"le mot","es":"la palabra","de":"das Wort","ar":"الكلمة","ar_translit":"al-kalima"},{"id":190,"tema":"Salute e altro","it":"la musica","it_alt":[],"en":"music","fr":"la musique","es":"la música","de":"die Musik","ar":"الموسيقى","ar_translit":"al-mūsīqā"}],"frasi4":[{"id":1,"tema":"Vita quotidiana","it":"Ogni mattina, prima di andare al lavoro, porto il cane a fare una lunga passeggiata nel parco vicino a casa.","en":"Every morning, before going to work, I take the dog for a long walk in the park near my house.","fr":"Chaque matin, avant d'aller au travail, j'emmène le chien faire une longue promenade dans le parc près de chez moi.","es":"Cada mañana, antes de ir al trabajo, saco al perro a dar un largo paseo por el parque cerca de mi casa.","de":"Jeden Morgen, bevor ich zur Arbeit gehe, mache ich mit dem Hund einen langen Spaziergang im Park in der Nähe meines Hauses.","ar":"كل صباح، قبل الذهاب إلى العمل، آخذ الكلب في نزهة طويلة في الحديقة القريبة من بيتي."},{"id":2,"tema":"Vita quotidiana","it":"Il fine settimana mi piace dormire fino a tardi e poi fare colazione con calma insieme alla mia famiglia.","en":"At the weekend I like to sleep late and then have a relaxed breakfast with my family.","fr":"Le week-end, j'aime dormir tard puis prendre le petit-déjeuner tranquillement avec ma famille.","es":"Los fines de semana me gusta dormir hasta tarde y luego desayunar con calma con mi familia.","de":"Am Wochenende schlafe ich gern lange und frühstücke dann in Ruhe mit meiner Familie.","ar":"في عطلة نهاية الأسبوع أحب أن أنام حتى وقت متأخر ثم أتناول الفطور بهدوء مع عائلتي."},{"id":3,"tema":"Vita quotidiana","it":"Abbiamo deciso di cambiare casa perché quella vecchia era troppo piccola per una famiglia con tre bambini.","en":"We decided to move house because the old one was too small for a family with three children.","fr":"Nous avons décidé de déménager parce que l'ancienne maison était trop petite pour une famille avec trois enfants.","es":"Decidimos cambiarnos de casa porque la antigua era demasiado pequeña para una familia con tres niños.","de":"Wir haben beschlossen umzuziehen, weil das alte Haus für eine Familie mit drei Kindern zu klein war.","ar":"قررنا الانتقال إلى بيت آخر لأن البيت القديم كان صغيرًا جدًا على عائلة لديها ثلاثة أطفال."},{"id":4,"tema":"Vita quotidiana","it":"Quando torno a casa la sera, di solito preparo la cena e poi guardo un film o leggo un buon libro.","en":"When I get home in the evening, I usually make dinner and then watch a film or read a good book.","fr":"Quand je rentre le soir, je prépare généralement le dîner puis je regarde un film ou je lis un bon livre.","es":"Cuando vuelvo a casa por la noche, normalmente preparo la cena y luego veo una película o leo un buen libro.","de":"Wenn ich abends nach Hause komme, koche ich normalerweise das Abendessen und schaue dann einen Film oder lese ein gutes Buch.","ar":"عندما أعود إلى البيت في المساء، أحضّر العشاء عادةً ثم أشاهد فيلمًا أو أقرأ كتابًا جيدًا."},{"id":5,"tema":"Vita quotidiana","it":"Mia sorella vive all'estero da molti anni, ma ci sentiamo al telefono quasi tutti i giorni.","en":"My sister has been living abroad for many years, but we talk on the phone almost every day.","fr":"Ma sœur vit à l'étranger depuis de nombreuses années, mais nous nous parlons au téléphone presque tous les jours.","es":"Mi hermana vive en el extranjero desde hace muchos años, pero hablamos por teléfono casi todos los días.","de":"Meine Schwester lebt seit vielen Jahren im Ausland, aber wir telefonieren fast jeden Tag.","ar":"تعيش أختي في الخارج منذ سنوات طويلة، لكننا نتحدث على الهاتف كل يوم تقريبًا."},{"id":6,"tema":"Vita quotidiana","it":"Il supermercato sotto casa chiude alle otto, quindi se vuoi comprare il pane devi sbrigarti.","en":"The supermarket downstairs closes at eight, so if you want to buy bread you need to hurry.","fr":"Le supermarché en bas de chez moi ferme à huit heures, donc si tu veux acheter du pain, tu dois te dépêcher.","es":"El supermercado de abajo cierra a las ocho, así que si quieres comprar pan tienes que darte prisa.","de":"Der Supermarkt unten im Haus schließt um acht, also musst du dich beeilen, wenn du Brot kaufen willst.","ar":"يغلق السوبرماركت تحت البيت في الساعة الثامنة، فإذا أردت شراء الخبز يجب أن تسرع."},{"id":7,"tema":"Vita quotidiana","it":"Domenica scorsa siamo andati a trovare i nonni in campagna e abbiamo pranzato tutti insieme in giardino.","en":"Last Sunday we went to visit our grandparents in the countryside and we all had lunch together in the garden.","fr":"Dimanche dernier, nous sommes allés voir nos grands-parents à la campagne et nous avons tous déjeuné ensemble dans le jardin.","es":"El domingo pasado fuimos a visitar a los abuelos al campo y comimos todos juntos en el jardín.","de":"Letzten Sonntag haben wir unsere Großeltern auf dem Land besucht und alle zusammen im Garten zu Mittag gegessen.","ar":"يوم الأحد الماضي ذهبنا لزيارة الجدّين في الريف وتناولنا الغداء معًا في الحديقة."},{"id":8,"tema":"Vita quotidiana","it":"Non riesco mai a trovare le chiavi della macchina quando ho fretta, perciò adesso le lascio sempre vicino alla porta.","en":"I can never find the car keys when I'm in a hurry, so now I always leave them near the door.","fr":"Je ne trouve jamais les clés de la voiture quand je suis pressé, alors maintenant je les laisse toujours près de la porte.","es":"Nunca encuentro las llaves del coche cuando tengo prisa, por eso ahora siempre las dejo junto a la puerta.","de":"Ich finde die Autoschlüssel nie, wenn ich es eilig habe, deshalb lege ich sie jetzt immer neben die Tür.","ar":"لا أجد مفاتيح السيارة أبدًا عندما أكون مستعجلًا، لذلك أتركها الآن دائمًا بجانب الباب."},{"id":9,"tema":"Vita quotidiana","it":"Il mio vicino di casa è molto gentile: quando parto per le vacanze, si occupa delle piante e del gatto.","en":"My neighbour is very kind: when I go on holiday, he looks after the plants and the cat.","fr":"Mon voisin est très gentil : quand je pars en vacances, il s'occupe des plantes et du chat.","es":"Mi vecino es muy amable: cuando me voy de vacaciones, se ocupa de las plantas y del gato.","de":"Mein Nachbar ist sehr nett: Wenn ich in den Urlaub fahre, kümmert er sich um die Pflanzen und die Katze.","ar":"جاري لطيف جدًا: عندما أسافر في العطلة يعتني بالنباتات وبالقطة."},{"id":10,"tema":"Vita quotidiana","it":"Da quando lavoro da casa ho più tempo per fare sport, ma a volte mi mancano i colleghi.","en":"Since I started working from home I have more time to do sport, but sometimes I miss my colleagues.","fr":"Depuis que je travaille à la maison, j'ai plus de temps pour faire du sport, mais parfois mes collègues me manquent.","es":"Desde que trabajo en casa tengo más tiempo para hacer deporte, pero a veces echo de menos a mis compañeros.","de":"Seit ich von zu Hause arbeite, habe ich mehr Zeit für Sport, aber manchmal vermisse ich meine Kollegen.","ar":"منذ أن بدأت العمل من البيت صار لديّ وقت أكثر لممارسة الرياضة، لكنني أحيانًا أشتاق إلى زملائي."},{"id":11,"tema":"Lavoro","it":"La riunione di domani è stata spostata alle dieci perché il direttore arriverà con un'ora di ritardo.","en":"Tomorrow's meeting has been moved to ten o'clock because the director will arrive an hour late.","fr":"La réunion de demain a été déplacée à dix heures parce que le directeur arrivera avec une heure de retard.","es":"La reunión de mañana se ha cambiado a las diez porque el director llegará con una hora de retraso.","de":"Die Besprechung morgen wurde auf zehn Uhr verschoben, weil der Direktor eine Stunde später kommt.","ar":"تم تأجيل اجتماع الغد إلى الساعة العاشرة لأن المدير سيصل متأخرًا ساعة."},{"id":12,"tema":"Lavoro","it":"Ho mandato il mio curriculum a diverse aziende, ma finora nessuno mi ha chiamato per un colloquio.","en":"I have sent my CV to several companies, but so far nobody has called me for an interview.","fr":"J'ai envoyé mon CV à plusieurs entreprises, mais jusqu'à présent personne ne m'a appelé pour un entretien.","es":"He enviado mi currículum a varias empresas, pero hasta ahora nadie me ha llamado para una entrevista.","de":"Ich habe meinen Lebenslauf an mehrere Firmen geschickt, aber bisher hat mich niemand zu einem Vorstellungsgespräch eingeladen.","ar":"أرسلت سيرتي الذاتية إلى عدة شركات، لكن حتى الآن لم يتصل بي أحد لإجراء مقابلة."},{"id":13,"tema":"Lavoro","it":"Il nostro ufficio si trova al terzo piano di un edificio moderno, proprio di fronte alla stazione centrale.","en":"Our office is on the third floor of a modern building, right opposite the central station.","fr":"Notre bureau se trouve au troisième étage d'un immeuble moderne, juste en face de la gare centrale.","es":"Nuestra oficina está en el tercer piso de un edificio moderno, justo enfrente de la estación central.","de":"Unser Büro befindet sich im dritten Stock eines modernen Gebäudes, direkt gegenüber dem Hauptbahnhof.","ar":"يقع مكتبنا في الطابق الثالث من مبنى حديث، مقابل المحطة المركزية تمامًا."},{"id":14,"tema":"Lavoro","it":"Il progetto deve essere consegnato entro venerdì, quindi questa settimana lavoreremo anche la sera.","en":"The project must be delivered by Friday, so this week we will also work in the evenings.","fr":"Le projet doit être livré avant vendredi, donc cette semaine nous travaillerons aussi le soir.","es":"El proyecto debe entregarse antes del viernes, así que esta semana trabajaremos también por la noche.","de":"Das Projekt muss bis Freitag abgegeben werden, deshalb arbeiten wir diese Woche auch abends.","ar":"يجب تسليم المشروع قبل يوم الجمعة، لذلك سنعمل هذا الأسبوع في المساء أيضًا."},{"id":15,"tema":"Lavoro","it":"La mia collega ha appena ottenuto una promozione e da lunedì guiderà un gruppo di quindici persone.","en":"My colleague has just been promoted and from Monday she will lead a team of fifteen people.","fr":"Ma collègue vient d'obtenir une promotion et à partir de lundi elle dirigera une équipe de quinze personnes.","es":"Mi compañera acaba de conseguir un ascenso y a partir del lunes dirigirá un equipo de quince personas.","de":"Meine Kollegin ist gerade befördert worden und leitet ab Montag ein Team von fünfzehn Personen.","ar":"حصلت زميلتي للتو على ترقية، وابتداءً من يوم الاثنين ستقود فريقًا من خمسة عشر شخصًا."},{"id":16,"tema":"Lavoro","it":"Prima di firmare il contratto, vorrei leggere con attenzione tutte le condizioni e fare qualche domanda.","en":"Before signing the contract, I would like to read all the conditions carefully and ask a few questions.","fr":"Avant de signer le contrat, je voudrais lire attentivement toutes les conditions et poser quelques questions.","es":"Antes de firmar el contrato, me gustaría leer con atención todas las condiciones y hacer algunas preguntas.","de":"Bevor ich den Vertrag unterschreibe, möchte ich alle Bedingungen sorgfältig lesen und ein paar Fragen stellen.","ar":"قبل توقيع العقد أودّ أن أقرأ جميع الشروط بعناية وأن أطرح بعض الأسئلة."},{"id":17,"tema":"Lavoro","it":"Molte persone oggi cambiano lavoro più volte nella vita per seguire le proprie passioni.","en":"Many people today change jobs several times in their lives to follow their passions.","fr":"Aujourd'hui, beaucoup de gens changent de travail plusieurs fois dans leur vie pour suivre leurs passions.","es":"Hoy en día muchas personas cambian de trabajo varias veces en la vida para seguir sus pasiones.","de":"Viele Menschen wechseln heute mehrmals im Leben den Beruf, um ihren Leidenschaften zu folgen.","ar":"يغيّر كثير من الناس اليوم عملهم عدة مرات في حياتهم ليتبعوا شغفهم."},{"id":18,"tema":"Lavoro","it":"Il computer dell'ufficio si è bloccato di nuovo e ho perso tutto il lavoro della mattina.","en":"The office computer froze again and I lost all the morning's work.","fr":"L'ordinateur du bureau s'est encore bloqué et j'ai perdu tout le travail de la matinée.","es":"El ordenador de la oficina se ha bloqueado otra vez y he perdido todo el trabajo de la mañana.","de":"Der Bürocomputer ist wieder abgestürzt und ich habe die ganze Arbeit des Vormittags verloren.","ar":"تعطّل حاسوب المكتب مرة أخرى وفقدت كل عمل الصباح."},{"id":19,"tema":"Lavoro","it":"Il mio capo mi ha chiesto di preparare una presentazione sui risultati dell'anno per il consiglio di amministrazione.","en":"My boss asked me to prepare a presentation on the year's results for the board of directors.","fr":"Mon patron m'a demandé de préparer une présentation sur les résultats de l'année pour le conseil d'administration.","es":"Mi jefe me ha pedido que prepare una presentación sobre los resultados del año para el consejo de administración.","de":"Mein Chef hat mich gebeten, für den Vorstand eine Präsentation über die Ergebnisse des Jahres vorzubereiten.","ar":"طلب مني مديري أن أعدّ عرضًا عن نتائج السنة لمجلس الإدارة."},{"id":20,"tema":"Lavoro","it":"Lavorare in un ambiente internazionale mi ha aiutato a migliorare le lingue e a capire culture diverse.","en":"Working in an international environment has helped me improve my languages and understand different cultures.","fr":"Travailler dans un environnement international m'a aidé à améliorer mes langues et à comprendre des cultures différentes.","es":"Trabajar en un ambiente internacional me ha ayudado a mejorar los idiomas y a entender culturas diferentes.","de":"Die Arbeit in einem internationalen Umfeld hat mir geholfen, meine Sprachen zu verbessern und andere Kulturen zu verstehen.","ar":"ساعدني العمل في بيئة دولية على تحسين لغاتي وفهم ثقافات مختلفة."},{"id":21,"tema":"Viaggi","it":"Il nostro volo è stato cancellato a causa della nebbia e abbiamo dovuto passare la notte in un albergo vicino all'aeroporto.","en":"Our flight was cancelled because of the fog and we had to spend the night in a hotel near the airport.","fr":"Notre vol a été annulé à cause du brouillard et nous avons dû passer la nuit dans un hôtel près de l'aéroport.","es":"Nuestro vuelo fue cancelado por la niebla y tuvimos que pasar la noche en un hotel cerca del aeropuerto.","de":"Unser Flug wurde wegen Nebel gestrichen und wir mussten die Nacht in einem Hotel in der Nähe des Flughafens verbringen.","ar":"أُلغيت رحلتنا بسبب الضباب واضطررنا إلى قضاء الليلة في فندق قريب من المطار."},{"id":22,"tema":"Viaggi","it":"Se prendi il treno delle sette, arrivi a Firenze in tempo per visitare il museo prima di pranzo.","en":"If you take the seven o'clock train, you will get to Florence in time to visit the museum before lunch.","fr":"Si tu prends le train de sept heures, tu arrives à Florence à temps pour visiter le musée avant le déjeuner.","es":"Si tomas el tren de las siete, llegas a Florencia a tiempo para visitar el museo antes de comer.","de":"Wenn du den Zug um sieben nimmst, kommst du rechtzeitig in Florenz an, um vor dem Mittagessen das Museum zu besichtigen.","ar":"إذا أخذت قطار الساعة السابعة تصل إلى فلورنسا في الوقت المناسب لزيارة المتحف قبل الغداء."},{"id":23,"tema":"Viaggi","it":"Durante il viaggio in Spagna abbiamo conosciuto una coppia molto simpatica con cui siamo ancora in contatto.","en":"During our trip to Spain we met a very nice couple with whom we are still in touch.","fr":"Pendant notre voyage en Espagne, nous avons rencontré un couple très sympathique avec qui nous sommes toujours en contact.","es":"Durante el viaje a España conocimos a una pareja muy simpática con la que seguimos en contacto.","de":"Während unserer Reise nach Spanien haben wir ein sehr nettes Paar kennengelernt, mit dem wir immer noch in Kontakt sind.","ar":"خلال رحلتنا إلى إسبانيا تعرّفنا على زوجين لطيفين جدًا وما زلنا على تواصل معهما."},{"id":24,"tema":"Viaggi","it":"L'albergo era bellissimo, ma la camera dava sulla strada e di notte c'era troppo rumore per dormire.","en":"The hotel was beautiful, but the room faced the street and at night it was too noisy to sleep.","fr":"L'hôtel était magnifique, mais la chambre donnait sur la rue et la nuit il y avait trop de bruit pour dormir.","es":"El hotel era precioso, pero la habitación daba a la calle y por la noche había demasiado ruido para dormir.","de":"Das Hotel war wunderschön, aber das Zimmer lag zur Straße hin und nachts war es zu laut zum Schlafen.","ar":"كان الفندق جميلًا جدًا، لكن الغرفة كانت تطل على الشارع وفي الليل كان الضجيج أكثر من أن ننام."},{"id":25,"tema":"Viaggi","it":"Ti consiglio di prenotare i biglietti con largo anticipo, perché in estate i prezzi aumentano molto.","en":"I advise you to book your tickets well in advance, because in summer prices go up a lot.","fr":"Je te conseille de réserver les billets bien à l'avance, car en été les prix augmentent beaucoup.","es":"Te aconsejo reservar los billetes con mucha antelación, porque en verano los precios suben mucho.","de":"Ich rate dir, die Tickets weit im Voraus zu buchen, denn im Sommer steigen die Preise stark.","ar":"أنصحك بحجز التذاكر قبل وقت طويل، لأن الأسعار ترتفع كثيرًا في الصيف."},{"id":26,"tema":"Viaggi","it":"Abbiamo noleggiato una macchina per visitare i piccoli paesi di montagna che non sono raggiungibili in autobus.","en":"We hired a car to visit the small mountain villages that cannot be reached by bus.","fr":"Nous avons loué une voiture pour visiter les petits villages de montagne qu'on ne peut pas rejoindre en bus.","es":"Alquilamos un coche para visitar los pequeños pueblos de montaña a los que no se puede llegar en autobús.","de":"Wir haben ein Auto gemietet, um die kleinen Bergdörfer zu besuchen, die mit dem Bus nicht erreichbar sind.","ar":"استأجرنا سيارة لزيارة القرى الجبلية الصغيرة التي لا يمكن الوصول إليها بالحافلة."},{"id":27,"tema":"Viaggi","it":"Alla dogana mi hanno chiesto di aprire la valigia, ma per fortuna era tutto in regola.","en":"At customs they asked me to open my suitcase, but luckily everything was in order.","fr":"À la douane, on m'a demandé d'ouvrir ma valise, mais heureusement tout était en règle.","es":"En la aduana me pidieron que abriera la maleta, pero por suerte todo estaba en regla.","de":"Am Zoll musste ich meinen Koffer öffnen, aber zum Glück war alles in Ordnung.","ar":"طلبوا مني في الجمارك أن أفتح الحقيبة، لكن لحسن الحظ كان كل شيء نظاميًا."},{"id":28,"tema":"Viaggi","it":"Quando viaggio da solo preferisco dormire negli ostelli, perché è più facile conoscere altre persone.","en":"When I travel alone I prefer to sleep in hostels, because it is easier to meet other people.","fr":"Quand je voyage seul, je préfère dormir dans des auberges de jeunesse, parce qu'il est plus facile de rencontrer d'autres personnes.","es":"Cuando viajo solo prefiero dormir en albergues, porque es más fácil conocer a otras personas.","de":"Wenn ich allein reise, übernachte ich lieber in Hostels, weil man dort leichter andere Leute kennenlernt.","ar":"عندما أسافر وحدي أفضّل النوم في نُزُل الشباب، لأنه من الأسهل التعرف على أشخاص آخرين."},{"id":29,"tema":"Viaggi","it":"Il centro storico è chiuso alle macchine, quindi conviene lasciare l'auto nel parcheggio fuori dalle mura.","en":"The historic centre is closed to cars, so it is best to leave the car in the car park outside the walls.","fr":"Le centre historique est fermé aux voitures, il vaut donc mieux laisser la voiture au parking à l'extérieur des remparts.","es":"El casco antiguo está cerrado a los coches, así que conviene dejar el coche en el aparcamiento fuera de las murallas.","de":"Die Altstadt ist für Autos gesperrt, deshalb lässt man das Auto am besten auf dem Parkplatz außerhalb der Stadtmauer.","ar":"المركز التاريخي مغلق أمام السيارات، لذلك من الأفضل ترك السيارة في الموقف خارج الأسوار."},{"id":30,"tema":"Viaggi","it":"Abbiamo perso la coincidenza a Parigi e siamo arrivati a destinazione con sei ore di ritardo.","en":"We missed our connection in Paris and arrived at our destination six hours late.","fr":"Nous avons raté notre correspondance à Paris et nous sommes arrivés à destination avec six heures de retard.","es":"Perdimos la conexión en París y llegamos a nuestro destino con seis horas de retraso.","de":"Wir haben in Paris den Anschluss verpasst und sind mit sechs Stunden Verspätung am Ziel angekommen.","ar":"فاتتنا رحلة الربط في باريس ووصلنا إلى وجهتنا متأخرين ست ساعات."},{"id":31,"tema":"Notizie e società","it":"Secondo le ultime notizie, il governo ha approvato una nuova legge per ridurre il traffico nelle grandi città.","en":"According to the latest news, the government has approved a new law to reduce traffic in big cities.","fr":"Selon les dernières nouvelles, le gouvernement a approuvé une nouvelle loi pour réduire la circulation dans les grandes villes.","es":"Según las últimas noticias, el gobierno ha aprobado una nueva ley para reducir el tráfico en las grandes ciudades.","de":"Nach den neuesten Nachrichten hat die Regierung ein neues Gesetz verabschiedet, um den Verkehr in den Großstädten zu verringern.","ar":"بحسب آخر الأخبار، وافقت الحكومة على قانون جديد لتقليل حركة المرور في المدن الكبرى."},{"id":32,"tema":"Notizie e società","it":"Migliaia di persone hanno partecipato alla manifestazione di ieri per chiedere salari più alti.","en":"Thousands of people took part in yesterday's demonstration to ask for higher wages.","fr":"Des milliers de personnes ont participé à la manifestation d'hier pour demander des salaires plus élevés.","es":"Miles de personas participaron en la manifestación de ayer para pedir salarios más altos.","de":"Tausende Menschen haben gestern an der Demonstration teilgenommen, um höhere Löhne zu fordern.","ar":"شارك آلاف الأشخاص في مظاهرة الأمس للمطالبة بأجور أعلى."},{"id":33,"tema":"Notizie e società","it":"Il prezzo della benzina è aumentato di nuovo e molte famiglie hanno deciso di usare di più i mezzi pubblici.","en":"The price of petrol has gone up again and many families have decided to use public transport more.","fr":"Le prix de l'essence a encore augmenté et beaucoup de familles ont décidé d'utiliser davantage les transports en commun.","es":"El precio de la gasolina ha vuelto a subir y muchas familias han decidido usar más el transporte público.","de":"Der Benzinpreis ist wieder gestiegen und viele Familien haben beschlossen, öfter öffentliche Verkehrsmittel zu nutzen.","ar":"ارتفع سعر البنزين مرة أخرى وقررت عائلات كثيرة استخدام وسائل النقل العام أكثر."},{"id":34,"tema":"Notizie e società","it":"La nuova biblioteca comunale, inaugurata la settimana scorsa, è già frequentata da centinaia di studenti.","en":"The new public library, opened last week, is already used by hundreds of students.","fr":"La nouvelle bibliothèque municipale, inaugurée la semaine dernière, est déjà fréquentée par des centaines d'étudiants.","es":"La nueva biblioteca municipal, inaugurada la semana pasada, ya la frecuentan cientos de estudiantes.","de":"Die neue Stadtbibliothek, die letzte Woche eröffnet wurde, wird bereits von Hunderten von Studenten besucht.","ar":"المكتبة البلدية الجديدة التي افتُتحت الأسبوع الماضي يرتادها بالفعل مئات الطلاب."},{"id":35,"tema":"Notizie e società","it":"Molti giovani lasciano i piccoli paesi per trasferirsi in città, dove ci sono più opportunità di lavoro.","en":"Many young people leave small villages to move to the city, where there are more job opportunities.","fr":"Beaucoup de jeunes quittent les petits villages pour s'installer en ville, où il y a plus d'opportunités de travail.","es":"Muchos jóvenes dejan los pueblos pequeños para mudarse a la ciudad, donde hay más oportunidades de trabajo.","de":"Viele junge Menschen verlassen die kleinen Dörfer und ziehen in die Stadt, wo es mehr Arbeitsmöglichkeiten gibt.","ar":"يترك كثير من الشباب القرى الصغيرة للانتقال إلى المدينة حيث تتوفر فرص عمل أكثر."},{"id":36,"tema":"Notizie e società","it":"Le elezioni si terranno a maggio e i partiti hanno già cominciato la campagna elettorale.","en":"The elections will be held in May and the parties have already started campaigning.","fr":"Les élections auront lieu en mai et les partis ont déjà commencé la campagne électorale.","es":"Las elecciones se celebrarán en mayo y los partidos ya han empezado la campaña electoral.","de":"Die Wahlen finden im Mai statt und die Parteien haben bereits mit dem Wahlkampf begonnen.","ar":"ستُجرى الانتخابات في شهر مايو وقد بدأت الأحزاب حملتها الانتخابية بالفعل."},{"id":37,"tema":"Notizie e società","it":"Il sindaco ha promesso di costruire nuove piste ciclabili e di piantare mille alberi entro la fine dell'anno.","en":"The mayor has promised to build new cycle lanes and to plant a thousand trees by the end of the year.","fr":"Le maire a promis de construire de nouvelles pistes cyclables et de planter mille arbres d'ici la fin de l'année.","es":"El alcalde ha prometido construir nuevos carriles bici y plantar mil árboles antes de que acabe el año.","de":"Der Bürgermeister hat versprochen, neue Radwege zu bauen und bis Ende des Jahres tausend Bäume zu pflanzen.","ar":"وعد رئيس البلدية ببناء مسارات جديدة للدراجات وزراعة ألف شجرة قبل نهاية السنة."},{"id":38,"tema":"Notizie e società","it":"Una ricerca recente mostra che gli adolescenti passano in media più di sei ore al giorno davanti a uno schermo.","en":"Recent research shows that teenagers spend on average more than six hours a day in front of a screen.","fr":"Une étude récente montre que les adolescents passent en moyenne plus de six heures par jour devant un écran.","es":"Un estudio reciente muestra que los adolescentes pasan de media más de seis horas al día delante de una pantalla.","de":"Eine aktuelle Studie zeigt, dass Jugendliche im Durchschnitt mehr als sechs Stunden am Tag vor einem Bildschirm verbringen.","ar":"تُظهر دراسة حديثة أن المراهقين يقضون في المتوسط أكثر من ست ساعات يوميًا أمام الشاشة."},{"id":39,"tema":"Salute","it":"Il medico mi ha consigliato di camminare almeno mezz'ora al giorno e di mangiare meno dolci.","en":"The doctor advised me to walk at least half an hour a day and to eat fewer sweets.","fr":"Le médecin m'a conseillé de marcher au moins une demi-heure par jour et de manger moins de sucreries.","es":"El médico me ha aconsejado caminar al menos media hora al día y comer menos dulces.","de":"Der Arzt hat mir geraten, mindestens eine halbe Stunde am Tag zu gehen und weniger Süßigkeiten zu essen.","ar":"نصحني الطبيب بأن أمشي نصف ساعة على الأقل يوميًا وأن آكل حلويات أقل."},{"id":40,"tema":"Salute","it":"Da qualche giorno ho mal di gola e un po' di febbre, quindi oggi resto a casa a riposare.","en":"For a few days I have had a sore throat and a slight fever, so today I am staying at home to rest.","fr":"Depuis quelques jours j'ai mal à la gorge et un peu de fièvre, alors aujourd'hui je reste à la maison pour me reposer.","es":"Desde hace unos días me duele la garganta y tengo algo de fiebre, así que hoy me quedo en casa descansando.","de":"Seit ein paar Tagen habe ich Halsschmerzen und etwas Fieber, deshalb bleibe ich heute zu Hause und ruhe mich aus.","ar":"منذ بضعة أيام أعاني من التهاب في الحلق وقليل من الحمى، لذلك سأبقى اليوم في البيت لأرتاح."},{"id":41,"tema":"Salute","it":"Dormire bene è importante quanto mangiare in modo sano, ma molte persone lo dimenticano.","en":"Sleeping well is as important as eating healthily, but many people forget it.","fr":"Bien dormir est aussi important que manger sainement, mais beaucoup de gens l'oublient.","es":"Dormir bien es tan importante como comer de forma sana, pero mucha gente lo olvida.","de":"Gut zu schlafen ist genauso wichtig wie sich gesund zu ernähren, aber viele Menschen vergessen das.","ar":"النوم الجيد مهم بقدر الأكل الصحي، لكن كثيرًا من الناس ينسون ذلك."},{"id":42,"tema":"Salute","it":"Ho prenotato una visita dal dentista per la prossima settimana perché mi fa male un dente da giorni.","en":"I have booked an appointment with the dentist for next week because a tooth has been hurting for days.","fr":"J'ai pris rendez-vous chez le dentiste pour la semaine prochaine parce que j'ai mal à une dent depuis des jours.","es":"He pedido cita con el dentista para la semana que viene porque me duele una muela desde hace días.","de":"Ich habe für nächste Woche einen Termin beim Zahnarzt gemacht, weil mir seit Tagen ein Zahn wehtut.","ar":"حجزت موعدًا عند طبيب الأسنان للأسبوع القادم لأن أحد أسناني يؤلمني منذ أيام."},{"id":43,"tema":"Salute","it":"Dopo l'incidente ha dovuto fare molti mesi di fisioterapia prima di poter camminare di nuovo senza dolore.","en":"After the accident he had to do many months of physiotherapy before he could walk again without pain.","fr":"Après l'accident, il a dû faire de nombreux mois de kinésithérapie avant de pouvoir remarcher sans douleur.","es":"Después del accidente tuvo que hacer muchos meses de fisioterapia antes de poder volver a caminar sin dolor.","de":"Nach dem Unfall musste er viele Monate Physiotherapie machen, bevor er wieder ohne Schmerzen gehen konnte.","ar":"بعد الحادث اضطر إلى الخضوع لأشهر طويلة من العلاج الطبيعي قبل أن يتمكن من المشي مجددًا بلا ألم."},{"id":44,"tema":"Salute","it":"In farmacia mi hanno dato uno sciroppo per la tosse e mi hanno detto di bere molta acqua.","en":"At the pharmacy they gave me a cough syrup and told me to drink a lot of water.","fr":"À la pharmacie, on m'a donné un sirop contre la toux et on m'a dit de boire beaucoup d'eau.","es":"En la farmacia me dieron un jarabe para la tos y me dijeron que bebiera mucha agua.","de":"In der Apotheke haben sie mir einen Hustensaft gegeben und gesagt, ich solle viel Wasser trinken.","ar":"أعطوني في الصيدلية شرابًا للسعال وقالوا لي أن أشرب الكثير من الماء."},{"id":45,"tema":"Salute","it":"Fare sport con gli amici è il modo migliore per restare in forma senza annoiarsi.","en":"Doing sport with friends is the best way to stay fit without getting bored.","fr":"Faire du sport avec des amis est la meilleure façon de rester en forme sans s'ennuyer.","es":"Hacer deporte con amigos es la mejor manera de mantenerse en forma sin aburrirse.","de":"Mit Freunden Sport zu treiben ist der beste Weg, fit zu bleiben, ohne sich zu langweilen.","ar":"ممارسة الرياضة مع الأصدقاء هي أفضل طريقة للحفاظ على اللياقة دون الشعور بالملل."},{"id":46,"tema":"Salute","it":"Mio nonno ha ottant'anni, ma ogni mattina fa ancora un giro in bicicletta lungo il fiume.","en":"My grandfather is eighty, but every morning he still goes for a bike ride along the river.","fr":"Mon grand-père a quatre-vingts ans, mais chaque matin il fait encore un tour à vélo le long de la rivière.","es":"Mi abuelo tiene ochenta años, pero cada mañana todavía da un paseo en bicicleta junto al río.","de":"Mein Großvater ist achtzig, aber jeden Morgen fährt er noch eine Runde mit dem Fahrrad am Fluss entlang.","ar":"جدي في الثمانين من عمره، لكنه ما زال يقوم كل صباح بجولة بالدراجة على ضفة النهر."},{"id":47,"tema":"Salute","it":"Se il dolore non passa entro tre giorni, è meglio fare un controllo in ospedale.","en":"If the pain does not go away within three days, it is better to have a check-up at the hospital.","fr":"Si la douleur ne passe pas d'ici trois jours, il vaut mieux faire un contrôle à l'hôpital.","es":"Si el dolor no se pasa en tres días, es mejor hacerse una revisión en el hospital.","de":"Wenn der Schmerz nicht innerhalb von drei Tagen vergeht, lässt man sich besser im Krankenhaus untersuchen.","ar":"إذا لم يزُل الألم خلال ثلاثة أيام فمن الأفضل إجراء فحص في المستشفى."},{"id":48,"tema":"Ambiente","it":"Ogni anno le estati diventano più calde e in molte regioni manca l'acqua per l'agricoltura.","en":"Every year the summers get hotter and in many regions there is not enough water for agriculture.","fr":"Chaque année, les étés deviennent plus chauds et dans de nombreuses régions l'eau manque pour l'agriculture.","es":"Cada año los veranos son más calurosos y en muchas regiones falta agua para la agricultura.","de":"Jedes Jahr werden die Sommer heißer, und in vielen Regionen fehlt Wasser für die Landwirtschaft.","ar":"تزداد حرارة الصيف كل عام، وفي مناطق كثيرة لا تكفي المياه للزراعة."},{"id":49,"tema":"Ambiente","it":"Nella nostra città la raccolta differenziata è obbligatoria e chi non la fa rischia una multa.","en":"In our city recycling is compulsory and anyone who does not do it risks a fine.","fr":"Dans notre ville, le tri sélectif est obligatoire et ceux qui ne le font pas risquent une amende.","es":"En nuestra ciudad el reciclaje es obligatorio y quien no lo hace se arriesga a una multa.","de":"In unserer Stadt ist die Mülltrennung Pflicht, und wer sie nicht macht, riskiert eine Geldstrafe.","ar":"في مدينتنا فرز النفايات إلزامي ومن لا يفعل ذلك يتعرض لغرامة."},{"id":50,"tema":"Ambiente","it":"Abbiamo installato i pannelli solari sul tetto e adesso la bolletta della luce è molto più bassa.","en":"We have installed solar panels on the roof and now the electricity bill is much lower.","fr":"Nous avons installé des panneaux solaires sur le toit et maintenant la facture d'électricité est beaucoup plus basse.","es":"Hemos instalado paneles solares en el tejado y ahora la factura de la luz es mucho más baja.","de":"Wir haben Solarzellen auf dem Dach installiert und jetzt ist die Stromrechnung viel niedriger.","ar":"ركّبنا ألواحًا شمسية على السطح وصارت فاتورة الكهرباء الآن أقل بكثير."},{"id":51,"tema":"Ambiente","it":"Per proteggere il mare, molte spiagge hanno vietato le bottiglie e i bicchieri di plastica.","en":"To protect the sea, many beaches have banned plastic bottles and cups.","fr":"Pour protéger la mer, de nombreuses plages ont interdit les bouteilles et les gobelets en plastique.","es":"Para proteger el mar, muchas playas han prohibido las botellas y los vasos de plástico.","de":"Um das Meer zu schützen, haben viele Strände Plastikflaschen und Plastikbecher verboten.","ar":"لحماية البحر منعت شواطئ كثيرة الزجاجات والأكواب البلاستيكية."},{"id":52,"tema":"Ambiente","it":"Il bosco dietro il paese è stato distrutto da un incendio e ci vorranno anni perché ricresca.","en":"The wood behind the village was destroyed by a fire and it will take years for it to grow back.","fr":"Le bois derrière le village a été détruit par un incendie et il faudra des années pour qu'il repousse.","es":"El bosque detrás del pueblo fue destruido por un incendio y harán falta años para que vuelva a crecer.","de":"Der Wald hinter dem Dorf wurde durch einen Brand zerstört und es wird Jahre dauern, bis er nachwächst.","ar":"دُمّرت الغابة التي خلف القرية بحريق، وستحتاج إلى سنوات حتى تنمو من جديد."},{"id":53,"tema":"Ambiente","it":"Sempre più persone scelgono di andare al lavoro in bicicletta, sia per risparmiare sia per inquinare meno.","en":"More and more people choose to cycle to work, both to save money and to pollute less.","fr":"De plus en plus de gens choisissent d'aller au travail à vélo, à la fois pour économiser et pour moins polluer.","es":"Cada vez más personas eligen ir al trabajo en bicicleta, tanto para ahorrar como para contaminar menos.","de":"Immer mehr Menschen fahren mit dem Fahrrad zur Arbeit, um sowohl Geld zu sparen als auch weniger Schadstoffe zu verursachen.","ar":"يختار عدد متزايد من الناس الذهاب إلى العمل بالدراجة، لتوفير المال ولتقليل التلوث معًا."},{"id":54,"tema":"Ambiente","it":"Gli scienziati avvertono che, se non riduciamo le emissioni, il livello del mare continuerà a salire.","en":"Scientists warn that if we do not reduce emissions, the sea level will keep rising.","fr":"Les scientifiques avertissent que, si nous ne réduisons pas les émissions, le niveau de la mer continuera à monter.","es":"Los científicos advierten que, si no reducimos las emisiones, el nivel del mar seguirá subiendo.","de":"Wissenschaftler warnen, dass der Meeresspiegel weiter steigen wird, wenn wir die Emissionen nicht verringern.","ar":"يحذّر العلماء من أن مستوى البحر سيستمر في الارتفاع إذا لم نخفض الانبعاثات."},{"id":55,"tema":"Ambiente","it":"Nel nostro quartiere hanno creato un orto comune dove ognuno può coltivare verdura e fiori.","en":"In our neighbourhood they have created a community garden where everyone can grow vegetables and flowers.","fr":"Dans notre quartier, on a créé un jardin partagé où chacun peut cultiver des légumes et des fleurs.","es":"En nuestro barrio han creado un huerto comunitario donde cada uno puede cultivar verduras y flores.","de":"In unserem Viertel wurde ein Gemeinschaftsgarten angelegt, in dem jeder Gemüse und Blumen anbauen kann.","ar":"أنشؤوا في حيّنا حديقة مشتركة يستطيع فيها كل شخص أن يزرع الخضار والزهور."},{"id":56,"tema":"Tecnologia","it":"Il mio telefono si scarica in fretta, quindi porto sempre con me un caricabatterie portatile.","en":"My phone runs out of battery quickly, so I always carry a portable charger with me.","fr":"Mon téléphone se décharge vite, alors j'ai toujours un chargeur portable avec moi.","es":"Mi teléfono se descarga enseguida, así que siempre llevo conmigo un cargador portátil.","de":"Mein Handy ist schnell leer, deshalb habe ich immer ein tragbares Ladegerät dabei.","ar":"تنفد بطارية هاتفي بسرعة، لذلك أحمل معي دائمًا شاحنًا محمولًا."},{"id":57,"tema":"Tecnologia","it":"Oggi è possibile seguire un corso universitario online senza mai uscire di casa.","en":"Today it is possible to take a university course online without ever leaving home.","fr":"Aujourd'hui, il est possible de suivre un cours universitaire en ligne sans jamais sortir de chez soi.","es":"Hoy es posible seguir un curso universitario en línea sin salir nunca de casa.","de":"Heute kann man einen Universitätskurs online belegen, ohne jemals das Haus zu verlassen.","ar":"اليوم يمكن متابعة دورة جامعية عبر الإنترنت دون الخروج من البيت أبدًا."},{"id":58,"tema":"Tecnologia","it":"Mia madre ha imparato a fare le videochiamate per vedere i nipoti che vivono lontano.","en":"My mother has learned to make video calls to see her grandchildren who live far away.","fr":"Ma mère a appris à faire des appels vidéo pour voir ses petits-enfants qui habitent loin.","es":"Mi madre ha aprendido a hacer videollamadas para ver a sus nietos que viven lejos.","de":"Meine Mutter hat gelernt, Videoanrufe zu machen, um ihre Enkel zu sehen, die weit weg wohnen.","ar":"تعلّمت أمي إجراء مكالمات الفيديو لترى أحفادها الذين يعيشون بعيدًا."},{"id":59,"tema":"Tecnologia","it":"Prima di comprare un nuovo computer, leggo sempre le recensioni e confronto i prezzi su diversi siti.","en":"Before buying a new computer, I always read the reviews and compare prices on different websites.","fr":"Avant d'acheter un nouvel ordinateur, je lis toujours les avis et je compare les prix sur différents sites.","es":"Antes de comprar un ordenador nuevo, siempre leo las opiniones y comparo los precios en varias páginas.","de":"Bevor ich einen neuen Computer kaufe, lese ich immer die Bewertungen und vergleiche die Preise auf verschiedenen Websites.","ar":"قبل شراء حاسوب جديد أقرأ دائمًا التقييمات وأقارن الأسعار في عدة مواقع."},{"id":60,"tema":"Tecnologia","it":"Non bisogna mai condividere la propria password, nemmeno con gli amici più stretti.","en":"You should never share your password, not even with your closest friends.","fr":"Il ne faut jamais partager son mot de passe, même pas avec ses amis les plus proches.","es":"Nunca hay que compartir la contraseña, ni siquiera con los amigos más cercanos.","de":"Man sollte sein Passwort nie weitergeben, nicht einmal an die engsten Freunde.","ar":"لا يجب أبدًا مشاركة كلمة المرور، ولا حتى مع أقرب الأصدقاء."},{"id":61,"tema":"Tecnologia","it":"Grazie alle traduzioni automatiche è più facile capire un testo straniero, ma non sono sempre precise.","en":"Thanks to machine translation it is easier to understand a foreign text, but it is not always accurate.","fr":"Grâce aux traductions automatiques, il est plus facile de comprendre un texte étranger, mais elles ne sont pas toujours précises.","es":"Gracias a las traducciones automáticas es más fácil entender un texto extranjero, pero no siempre son precisas.","de":"Dank maschineller Übersetzungen ist es leichter, einen fremdsprachigen Text zu verstehen, aber sie sind nicht immer genau.","ar":"بفضل الترجمة الآلية صار فهم النصوص الأجنبية أسهل، لكنها ليست دقيقة دائمًا."},{"id":62,"tema":"Tecnologia","it":"Il nuovo programma permette di controllare il riscaldamento di casa direttamente dal telefono.","en":"The new app lets you control the heating at home directly from your phone.","fr":"La nouvelle application permet de contrôler le chauffage de la maison directement depuis le téléphone.","es":"La nueva aplicación permite controlar la calefacción de casa directamente desde el teléfono.","de":"Mit der neuen App kann man die Heizung zu Hause direkt vom Handy aus steuern.","ar":"يتيح التطبيق الجديد التحكم في تدفئة البيت مباشرة من الهاتف."},{"id":63,"tema":"Tecnologia","it":"Mio figlio passa troppo tempo con i videogiochi, perciò abbiamo deciso di limitare l'uso a un'ora al giorno.","en":"My son spends too much time on video games, so we decided to limit his use to one hour a day.","fr":"Mon fils passe trop de temps aux jeux vidéo, alors nous avons décidé de limiter leur usage à une heure par jour.","es":"Mi hijo pasa demasiado tiempo con los videojuegos, por eso hemos decidido limitar su uso a una hora al día.","de":"Mein Sohn verbringt zu viel Zeit mit Videospielen, deshalb haben wir beschlossen, sie auf eine Stunde am Tag zu begrenzen.","ar":"يقضي ابني وقتًا طويلًا جدًا في ألعاب الفيديو، لذلك قررنا أن نحدد استخدامها بساعة واحدة يوميًا."},{"id":64,"tema":"Tecnologia","it":"Ho perso tutte le foto delle vacanze perché non avevo fatto una copia di sicurezza.","en":"I lost all my holiday photos because I had not made a backup copy.","fr":"J'ai perdu toutes les photos des vacances parce que je n'avais pas fait de copie de sauvegarde.","es":"Perdí todas las fotos de las vacaciones porque no había hecho una copia de seguridad.","de":"Ich habe alle Urlaubsfotos verloren, weil ich keine Sicherungskopie gemacht hatte.","ar":"فقدت كل صور العطلة لأنني لم أكن قد صنعت نسخة احتياطية."},{"id":65,"tema":"Cultura e tempo libero","it":"Ieri sera siamo andati a teatro a vedere una commedia così divertente che abbiamo riso per due ore.","en":"Last night we went to the theatre to see a comedy so funny that we laughed for two hours.","fr":"Hier soir, nous sommes allés au théâtre voir une comédie si drôle que nous avons ri pendant deux heures.","es":"Anoche fuimos al teatro a ver una comedia tan divertida que nos reímos durante dos horas.","de":"Gestern Abend waren wir im Theater und haben eine so lustige Komödie gesehen, dass wir zwei Stunden lang gelacht haben.","ar":"ذهبنا مساء أمس إلى المسرح لمشاهدة كوميديا مضحكة جدًا لدرجة أننا ضحكنا ساعتين."},{"id":66,"tema":"Cultura e tempo libero","it":"Il museo della città ospita una mostra dedicata ai pittori del Rinascimento fino alla fine di marzo.","en":"The city museum is hosting an exhibition dedicated to Renaissance painters until the end of March.","fr":"Le musée de la ville accueille une exposition consacrée aux peintres de la Renaissance jusqu'à la fin mars.","es":"El museo de la ciudad acoge una exposición dedicada a los pintores del Renacimiento hasta finales de marzo.","de":"Das Stadtmuseum zeigt bis Ende März eine Ausstellung über die Maler der Renaissance.","ar":"يستضيف متحف المدينة معرضًا مخصصًا لرسامي عصر النهضة حتى نهاية شهر مارس."},{"id":67,"tema":"Cultura e tempo libero","it":"Da bambino suonavo il pianoforte, ma purtroppo ho smesso quando ho cominciato le scuole superiori.","en":"As a child I played the piano, but unfortunately I stopped when I started secondary school.","fr":"Enfant, je jouais du piano, mais malheureusement j'ai arrêté quand je suis entré au lycée.","es":"De niño tocaba el piano, pero por desgracia lo dejé cuando empecé el instituto.","de":"Als Kind habe ich Klavier gespielt, aber leider habe ich aufgehört, als ich aufs Gymnasium kam.","ar":"كنت أعزف على البيانو في طفولتي، لكنني للأسف توقفت عندما بدأت المدرسة الثانوية."},{"id":68,"tema":"Cultura e tempo libero","it":"Questo romanzo racconta la storia di una famiglia che emigra in America all'inizio del Novecento.","en":"This novel tells the story of a family that emigrates to America at the beginning of the twentieth century.","fr":"Ce roman raconte l'histoire d'une famille qui émigre en Amérique au début du vingtième siècle.","es":"Esta novela cuenta la historia de una familia que emigra a América a principios del siglo veinte.","de":"Dieser Roman erzählt die Geschichte einer Familie, die Anfang des zwanzigsten Jahrhunderts nach Amerika auswandert.","ar":"تحكي هذه الرواية قصة عائلة تهاجر إلى أمريكا في بداية القرن العشرين."},{"id":69,"tema":"Cultura e tempo libero","it":"Ogni estate in piazza si organizza un festival di musica a cui partecipano artisti da tutto il mondo.","en":"Every summer a music festival is held in the square, with artists from all over the world taking part.","fr":"Chaque été, un festival de musique est organisé sur la place, avec des artistes du monde entier.","es":"Cada verano se organiza en la plaza un festival de música en el que participan artistas de todo el mundo.","de":"Jeden Sommer findet auf dem Platz ein Musikfestival statt, an dem Künstler aus der ganzen Welt teilnehmen.","ar":"يُنظَّم في الساحة كل صيف مهرجان موسيقي يشارك فيه فنانون من جميع أنحاء العالم."},{"id":70,"tema":"Cultura e tempo libero","it":"Il film era tratto da un libro famoso, ma secondo me il libro era molto più bello.","en":"The film was based on a famous book, but in my opinion the book was much better.","fr":"Le film était tiré d'un livre célèbre, mais à mon avis le livre était bien meilleur.","es":"La película estaba basada en un libro famoso, pero en mi opinión el libro era mucho mejor.","de":"Der Film beruhte auf einem berühmten Buch, aber meiner Meinung nach war das Buch viel besser.","ar":"كان الفيلم مقتبسًا من كتاب مشهور، لكن الكتاب في رأيي كان أجمل بكثير."},{"id":71,"tema":"Cultura e tempo libero","it":"Nel tempo libero mi piace dipingere paesaggi, anche se non sono mai stato bravo a disegnare le persone.","en":"In my free time I like painting landscapes, even though I have never been good at drawing people.","fr":"Pendant mon temps libre, j'aime peindre des paysages, même si je n'ai jamais été doué pour dessiner les personnes.","es":"En mi tiempo libre me gusta pintar paisajes, aunque nunca se me ha dado bien dibujar a las personas.","de":"In meiner Freizeit male ich gern Landschaften, auch wenn ich nie gut darin war, Menschen zu zeichnen.","ar":"في وقت فراغي أحب رسم المناظر الطبيعية، مع أنني لم أكن يومًا ماهرًا في رسم الأشخاص."},{"id":72,"tema":"Cultura e tempo libero","it":"La partita è finita in pareggio, ma i tifosi hanno cantato e festeggiato fino a tarda notte.","en":"The match ended in a draw, but the fans sang and celebrated until late at night.","fr":"Le match s'est terminé par un match nul, mais les supporters ont chanté et fait la fête jusque tard dans la nuit.","es":"El partido terminó en empate, pero los aficionados cantaron y celebraron hasta altas horas de la noche.","de":"Das Spiel endete unentschieden, aber die Fans sangen und feierten bis spät in die Nacht.","ar":"انتهت المباراة بالتعادل، لكن المشجعين غنّوا واحتفلوا حتى وقت متأخر من الليل."},{"id":73,"tema":"Cultura e tempo libero","it":"Ho cominciato a studiare una nuova lingua perché vorrei leggere i libri del mio autore preferito in originale.","en":"I started studying a new language because I would like to read my favourite author's books in the original.","fr":"J'ai commencé à étudier une nouvelle langue parce que je voudrais lire les livres de mon auteur préféré en version originale.","es":"He empezado a estudiar un idioma nuevo porque me gustaría leer los libros de mi autor favorito en versión original.","de":"Ich habe angefangen, eine neue Sprache zu lernen, weil ich die Bücher meines Lieblingsautors im Original lesen möchte.","ar":"بدأت أدرس لغة جديدة لأنني أودّ أن أقرأ كتب كاتبي المفضل بلغتها الأصلية."},{"id":74,"tema":"Cucina","it":"Per preparare un buon sugo di pomodoro bisogna farlo cuocere a fuoco lento per almeno un'ora.","en":"To make a good tomato sauce you need to let it simmer for at least an hour.","fr":"Pour préparer une bonne sauce tomate, il faut la laisser cuire à feu doux pendant au moins une heure.","es":"Para preparar una buena salsa de tomate hay que dejarla cocer a fuego lento durante al menos una hora.","de":"Für eine gute Tomatensoße muss man sie mindestens eine Stunde lang bei schwacher Hitze köcheln lassen.","ar":"لتحضير صلصة طماطم جيدة يجب طهيها على نار هادئة لمدة ساعة على الأقل."},{"id":75,"tema":"Cucina","it":"Mia nonna non usava mai una ricetta scritta, eppure i suoi dolci erano sempre perfetti.","en":"My grandmother never used a written recipe, yet her cakes were always perfect.","fr":"Ma grand-mère n'utilisait jamais de recette écrite, et pourtant ses gâteaux étaient toujours parfaits.","es":"Mi abuela nunca usaba una receta escrita y, sin embargo, sus dulces siempre eran perfectos.","de":"Meine Großmutter hat nie ein geschriebenes Rezept benutzt, und trotzdem waren ihre Kuchen immer perfekt.","ar":"لم تكن جدتي تستعمل وصفة مكتوبة أبدًا، ومع ذلك كانت حلوياتها دائمًا مثالية."},{"id":76,"tema":"Cucina","it":"Stasera abbiamo ospiti a cena, quindi devo passare al mercato a comprare il pesce fresco.","en":"We have guests for dinner tonight, so I need to stop at the market to buy fresh fish.","fr":"Ce soir nous avons des invités à dîner, donc je dois passer au marché acheter du poisson frais.","es":"Esta noche tenemos invitados a cenar, así que tengo que pasar por el mercado a comprar pescado fresco.","de":"Heute Abend haben wir Gäste zum Essen, deshalb muss ich auf dem Markt frischen Fisch kaufen.","ar":"لدينا ضيوف على العشاء الليلة، لذلك يجب أن أمرّ بالسوق لشراء سمك طازج."},{"id":77,"tema":"Cucina","it":"Questo ristorante è famoso per la sua pizza cotta nel forno a legna e per i prezzi molto onesti.","en":"This restaurant is famous for its wood-fired pizza and its very fair prices.","fr":"Ce restaurant est célèbre pour sa pizza cuite au feu de bois et pour ses prix très honnêtes.","es":"Este restaurante es famoso por su pizza hecha en horno de leña y por sus precios muy razonables.","de":"Dieses Restaurant ist berühmt für seine Pizza aus dem Holzofen und für seine sehr fairen Preise.","ar":"هذا المطعم مشهور ببيتزا مخبوزة في فرن الحطب وبأسعاره المعقولة جدًا."},{"id":78,"tema":"Cucina","it":"Sono allergico alle noci, quindi al ristorante chiedo sempre quali ingredienti ci sono nei piatti.","en":"I am allergic to nuts, so at restaurants I always ask which ingredients are in the dishes.","fr":"Je suis allergique aux noix, alors au restaurant je demande toujours quels ingrédients il y a dans les plats.","es":"Soy alérgico a los frutos secos, así que en los restaurantes siempre pregunto qué ingredientes llevan los platos.","de":"Ich bin allergisch gegen Nüsse, deshalb frage ich im Restaurant immer, welche Zutaten in den Gerichten sind.","ar":"عندي حساسية من المكسرات، لذلك أسأل دائمًا في المطعم عن مكونات الأطباق."},{"id":79,"tema":"Cucina","it":"Se aggiungi un po' di limone all'insalata, il sapore diventa più fresco e leggero.","en":"If you add a little lemon to the salad, the taste becomes fresher and lighter.","fr":"Si tu ajoutes un peu de citron à la salade, le goût devient plus frais et plus léger.","es":"Si añades un poco de limón a la ensalada, el sabor se vuelve más fresco y ligero.","de":"Wenn du etwas Zitrone in den Salat gibst, schmeckt er frischer und leichter.","ar":"إذا أضفت قليلًا من الليمون إلى السلطة يصبح طعمها أكثر انتعاشًا وخفة."},{"id":80,"tema":"Cucina","it":"In questa regione si mangia molto formaggio e il pane viene ancora fatto a mano nei piccoli forni.","en":"In this region people eat a lot of cheese and bread is still made by hand in small bakeries.","fr":"Dans cette région, on mange beaucoup de fromage et le pain est encore fait à la main dans les petites boulangeries.","es":"En esta región se come mucho queso y el pan todavía se hace a mano en los pequeños hornos.","de":"In dieser Region isst man viel Käse, und das Brot wird in kleinen Bäckereien noch von Hand gemacht.","ar":"يأكل الناس في هذه المنطقة الكثير من الجبن، وما زال الخبز يُصنع باليد في المخابز الصغيرة."},{"id":81,"tema":"Cucina","it":"Abbiamo prenotato un tavolo in terrazza per goderci il tramonto mentre ceniamo.","en":"We have booked a table on the terrace to enjoy the sunset while we have dinner.","fr":"Nous avons réservé une table en terrasse pour profiter du coucher de soleil pendant le dîner.","es":"Hemos reservado una mesa en la terraza para disfrutar de la puesta de sol mientras cenamos.","de":"Wir haben einen Tisch auf der Terrasse reserviert, um beim Abendessen den Sonnenuntergang zu genießen.","ar":"حجزنا طاولة في الشرفة لنستمتع بغروب الشمس ونحن نتعشى."},{"id":82,"tema":"Racconti","it":"Quando aprì la porta, la casa era silenziosa e sul tavolo c'era una lettera senza firma.","en":"When he opened the door, the house was silent and on the table there was an unsigned letter.","fr":"Quand il ouvrit la porte, la maison était silencieuse et sur la table il y avait une lettre sans signature.","es":"Cuando abrió la puerta, la casa estaba en silencio y sobre la mesa había una carta sin firma.","de":"Als er die Tür öffnete, war das Haus still, und auf dem Tisch lag ein Brief ohne Unterschrift.","ar":"عندما فتح الباب كان البيت صامتًا، وكانت على الطاولة رسالة بلا توقيع."},{"id":83,"tema":"Racconti","it":"Il vecchio pescatore guardava il mare ogni mattina, aspettando una barca che non tornava da anni.","en":"The old fisherman looked at the sea every morning, waiting for a boat that had not come back for years.","fr":"Le vieux pêcheur regardait la mer chaque matin, attendant un bateau qui n'était pas revenu depuis des années.","es":"El viejo pescador miraba el mar cada mañana, esperando un barco que no volvía desde hacía años.","de":"Der alte Fischer schaute jeden Morgen aufs Meer und wartete auf ein Boot, das seit Jahren nicht zurückgekommen war.","ar":"كان الصياد العجوز ينظر إلى البحر كل صباح، منتظرًا قاربًا لم يعد منذ سنوات."},{"id":84,"tema":"Racconti","it":"Era una notte di tempesta e il treno si fermò all'improvviso in mezzo alla campagna.","en":"It was a stormy night and the train suddenly stopped in the middle of the countryside.","fr":"C'était une nuit de tempête et le train s'arrêta soudain au milieu de la campagne.","es":"Era una noche de tormenta y el tren se detuvo de repente en medio del campo.","de":"Es war eine stürmische Nacht, und der Zug hielt plötzlich mitten auf dem Land an.","ar":"كانت ليلة عاصفة، وتوقف القطار فجأة في وسط الريف."},{"id":85,"tema":"Racconti","it":"La bambina trovò in soffitta una vecchia scatola piena di fotografie di persone che non conosceva.","en":"The little girl found an old box in the attic full of photographs of people she did not know.","fr":"La petite fille trouva au grenier une vieille boîte pleine de photographies de personnes qu'elle ne connaissait pas.","es":"La niña encontró en el desván una caja vieja llena de fotografías de personas que no conocía.","de":"Das kleine Mädchen fand auf dem Dachboden eine alte Schachtel voller Fotos von Menschen, die es nicht kannte.","ar":"وجدت الطفلة في العلية صندوقًا قديمًا مليئًا بصور أشخاص لا تعرفهم."},{"id":86,"tema":"Racconti","it":"Dopo vent'anni lontano dal suo paese, tornò e scoprì che nessuno si ricordava più di lui.","en":"After twenty years away from his village, he came back and found out that nobody remembered him anymore.","fr":"Après vingt ans loin de son village, il revint et découvrit que plus personne ne se souvenait de lui.","es":"Después de veinte años lejos de su pueblo, volvió y descubrió que ya nadie se acordaba de él.","de":"Nach zwanzig Jahren fern von seinem Dorf kehrte er zurück und stellte fest, dass sich niemand mehr an ihn erinnerte.","ar":"بعد عشرين عامًا بعيدًا عن قريته عاد واكتشف أن أحدًا لم يعد يتذكره."},{"id":87,"tema":"Racconti","it":"Il gatto aspettava sempre davanti alla finestra, come se sapesse quando il suo padrone sarebbe tornato.","en":"The cat always waited by the window, as if it knew when its owner would come back.","fr":"Le chat attendait toujours devant la fenêtre, comme s'il savait quand son maître reviendrait.","es":"El gato siempre esperaba delante de la ventana, como si supiera cuándo iba a volver su dueño.","de":"Die Katze wartete immer am Fenster, als wüsste sie, wann ihr Besitzer zurückkommen würde.","ar":"كانت القطة تنتظر دائمًا أمام النافذة، كأنها تعرف متى سيعود صاحبها."},{"id":88,"tema":"Racconti","it":"Nessuno credeva alla sua storia, finché un giorno arrivò un uomo con le prove di quello che diceva.","en":"Nobody believed his story, until one day a man arrived with proof of what he was saying.","fr":"Personne ne croyait à son histoire, jusqu'au jour où un homme arriva avec les preuves de ce qu'il disait.","es":"Nadie creía su historia, hasta que un día llegó un hombre con las pruebas de lo que decía.","de":"Niemand glaubte seine Geschichte, bis eines Tages ein Mann mit Beweisen für das kam, was er erzählte.","ar":"لم يصدّق أحد قصته، إلى أن جاء رجل ذات يوم بأدلة على ما كان يقوله."},{"id":89,"tema":"Racconti","it":"La lettera era arrivata con dieci anni di ritardo, ma le parole scritte erano ancora piene d'amore.","en":"The letter had arrived ten years late, but the words written in it were still full of love.","fr":"La lettre était arrivée avec dix ans de retard, mais les mots écrits étaient encore pleins d'amour.","es":"La carta había llegado con diez años de retraso, pero las palabras escritas seguían llenas de amor.","de":"Der Brief war zehn Jahre zu spät angekommen, aber die geschriebenen Worte waren immer noch voller Liebe.","ar":"وصلت الرسالة متأخرة عشر سنوات، لكن الكلمات المكتوبة فيها كانت لا تزال مليئة بالحب."},{"id":90,"tema":"Racconti","it":"Camminarono tutta la notte attraverso il bosco e all'alba videro finalmente le luci del villaggio.","en":"They walked all night through the wood and at dawn they finally saw the lights of the village.","fr":"Ils marchèrent toute la nuit à travers le bois et à l'aube ils virent enfin les lumières du village.","es":"Caminaron toda la noche a través del bosque y al amanecer por fin vieron las luces del pueblo.","de":"Sie gingen die ganze Nacht durch den Wald und sahen bei Sonnenaufgang endlich die Lichter des Dorfes.","ar":"مشوا طوال الليل عبر الغابة، وعند الفجر رأوا أخيرًا أضواء القرية."},{"id":91,"tema":"Racconti","it":"Il professore entrò in classe con un sorriso misterioso e disse che quel giorno non ci sarebbe stata lezione.","en":"The teacher came into the classroom with a mysterious smile and said that there would be no lesson that day.","fr":"Le professeur entra en classe avec un sourire mystérieux et dit qu'il n'y aurait pas de cours ce jour-là.","es":"El profesor entró en clase con una sonrisa misteriosa y dijo que ese día no habría clase.","de":"Der Lehrer kam mit einem geheimnisvollen Lächeln in die Klasse und sagte, dass es an diesem Tag keinen Unterricht geben würde.","ar":"دخل الأستاذ إلى الصف بابتسامة غامضة وقال إنه لن يكون هناك درس في ذلك اليوم."},{"id":92,"tema":"Scuola e studio","it":"Mio figlio deve studiare molto per l'esame di matematica, che è la materia che trova più difficile.","en":"My son has to study a lot for the maths exam, which is the subject he finds most difficult.","fr":"Mon fils doit beaucoup étudier pour l'examen de mathématiques, qui est la matière qu'il trouve la plus difficile.","es":"Mi hijo tiene que estudiar mucho para el examen de matemáticas, que es la asignatura que le resulta más difícil.","de":"Mein Sohn muss viel für die Matheprüfung lernen, denn das ist das Fach, das er am schwierigsten findet.","ar":"يجب على ابني أن يدرس كثيرًا لامتحان الرياضيات، وهي المادة التي يجدها الأصعب."},{"id":93,"tema":"Scuola e studio","it":"Per imparare bene una lingua straniera, è utile ascoltarla ogni giorno, anche solo per pochi minuti.","en":"To learn a foreign language well, it is useful to listen to it every day, even if only for a few minutes.","fr":"Pour bien apprendre une langue étrangère, il est utile de l'écouter tous les jours, même quelques minutes seulement.","es":"Para aprender bien un idioma extranjero, es útil escucharlo todos los días, aunque sea solo unos minutos.","de":"Um eine Fremdsprache gut zu lernen, ist es nützlich, sie jeden Tag zu hören, auch wenn es nur ein paar Minuten sind.","ar":"لتعلّم لغة أجنبية جيدًا من المفيد الاستماع إليها كل يوم، ولو لبضع دقائق فقط."},{"id":94,"tema":"Scuola e studio","it":"L'università organizza corsi gratuiti di italiano per gli studenti che arrivano dall'estero.","en":"The university organises free Italian courses for students who come from abroad.","fr":"L'université organise des cours d'italien gratuits pour les étudiants qui viennent de l'étranger.","es":"La universidad organiza cursos gratuitos de italiano para los estudiantes que llegan del extranjero.","de":"Die Universität bietet kostenlose Italienischkurse für Studenten an, die aus dem Ausland kommen.","ar":"تنظّم الجامعة دورات مجانية في اللغة الإيطالية للطلاب القادمين من الخارج."},{"id":95,"tema":"Scuola e studio","it":"Dopo la laurea vorrei fare un'esperienza di lavoro all'estero prima di tornare nel mio paese.","en":"After graduating I would like to have some work experience abroad before going back to my country.","fr":"Après mon diplôme, je voudrais faire une expérience de travail à l'étranger avant de rentrer dans mon pays.","es":"Después de licenciarme me gustaría tener una experiencia de trabajo en el extranjero antes de volver a mi país.","de":"Nach dem Studienabschluss möchte ich Arbeitserfahrung im Ausland sammeln, bevor ich in mein Land zurückkehre.","ar":"بعد التخرج أودّ أن أكتسب خبرة عمل في الخارج قبل أن أعود إلى بلدي."},{"id":96,"tema":"Scuola e studio","it":"La maestra ha chiesto ai bambini di scrivere un tema sulle loro vacanze estive.","en":"The teacher asked the children to write an essay about their summer holidays.","fr":"La maîtresse a demandé aux enfants d'écrire une rédaction sur leurs vacances d'été.","es":"La maestra pidió a los niños que escribieran una redacción sobre sus vacaciones de verano.","de":"Die Lehrerin hat die Kinder gebeten, einen Aufsatz über ihre Sommerferien zu schreiben.","ar":"طلبت المعلمة من الأطفال أن يكتبوا موضوعًا عن عطلتهم الصيفية."},{"id":97,"tema":"Scuola e studio","it":"Studiare in gruppo mi aiuta a capire meglio gli argomenti difficili e a non perdere la motivazione.","en":"Studying in a group helps me understand difficult topics better and not lose motivation.","fr":"Étudier en groupe m'aide à mieux comprendre les sujets difficiles et à ne pas perdre ma motivation.","es":"Estudiar en grupo me ayuda a entender mejor los temas difíciles y a no perder la motivación.","de":"In der Gruppe zu lernen hilft mir, schwierige Themen besser zu verstehen und die Motivation nicht zu verlieren.","ar":"تساعدني الدراسة في مجموعة على فهم المواضيع الصعبة بشكل أفضل وعلى عدم فقدان الحماس."},{"id":98,"tema":"Scuola e studio","it":"La biblioteca resta aperta fino a mezzanotte durante il periodo degli esami.","en":"The library stays open until midnight during the exam period.","fr":"La bibliothèque reste ouverte jusqu'à minuit pendant la période des examens.","es":"La biblioteca permanece abierta hasta medianoche durante el periodo de exámenes.","de":"Die Bibliothek bleibt während der Prüfungszeit bis Mitternacht geöffnet.","ar":"تبقى المكتبة مفتوحة حتى منتصف الليل خلال فترة الامتحانات."},{"id":99,"tema":"Relazioni e sentimenti","it":"Ci siamo conosciuti per caso su un treno e da quel giorno non ci siamo più lasciati.","en":"We met by chance on a train and since that day we have never been apart.","fr":"Nous nous sommes rencontrés par hasard dans un train et depuis ce jour nous ne nous sommes plus quittés.","es":"Nos conocimos por casualidad en un tren y desde aquel día no nos hemos vuelto a separar.","de":"Wir haben uns zufällig in einem Zug kennengelernt und sind seit diesem Tag nicht mehr auseinandergegangen.","ar":"تعارفنا صدفةً في قطار ومنذ ذلك اليوم لم نفترق."},{"id":100,"tema":"Relazioni e sentimenti","it":"Mi dispiace di non essere venuto alla tua festa, ma avevo un impegno di lavoro che non potevo rimandare.","en":"I am sorry I did not come to your party, but I had a work commitment that I could not postpone.","fr":"Je suis désolé de ne pas être venu à ta fête, mais j'avais un engagement professionnel que je ne pouvais pas reporter.","es":"Siento no haber ido a tu fiesta, pero tenía un compromiso de trabajo que no podía aplazar.","de":"Es tut mir leid, dass ich nicht zu deiner Party gekommen bin, aber ich hatte einen beruflichen Termin, den ich nicht verschieben konnte.","ar":"آسف لأنني لم أحضر حفلتك، لكن كان لديّ التزام في العمل لم أستطع تأجيله."},{"id":101,"tema":"Relazioni e sentimenti","it":"Quando ho saputo la notizia, ero così felice che ho chiamato subito tutti i miei amici.","en":"When I heard the news, I was so happy that I immediately called all my friends.","fr":"Quand j'ai appris la nouvelle, j'étais si heureux que j'ai tout de suite appelé tous mes amis.","es":"Cuando me enteré de la noticia, estaba tan contento que llamé enseguida a todos mis amigos.","de":"Als ich die Nachricht erfuhr, war ich so glücklich, dass ich sofort alle meine Freunde angerufen habe.","ar":"عندما عرفت الخبر كنت سعيدًا جدًا لدرجة أنني اتصلت فورًا بكل أصدقائي."},{"id":102,"tema":"Relazioni e sentimenti","it":"Abbiamo litigato per una sciocchezza, ma il giorno dopo ci siamo chiesti scusa e abbiamo riso insieme.","en":"We argued about something silly, but the next day we apologised to each other and laughed together.","fr":"Nous nous sommes disputés pour une bêtise, mais le lendemain nous nous sommes excusés et nous avons ri ensemble.","es":"Discutimos por una tontería, pero al día siguiente nos pedimos perdón y nos reímos juntos.","de":"Wir haben uns wegen einer Kleinigkeit gestritten, aber am nächsten Tag haben wir uns entschuldigt und zusammen gelacht.","ar":"تشاجرنا بسبب أمر تافه، لكننا في اليوم التالي اعتذر كلٌّ منا للآخر وضحكنا معًا."},{"id":103,"tema":"Relazioni e sentimenti","it":"La mia migliore amica si sposa a giugno e mi ha chiesto di farle da testimone.","en":"My best friend is getting married in June and she has asked me to be her witness.","fr":"Ma meilleure amie se marie en juin et elle m'a demandé d'être son témoin.","es":"Mi mejor amiga se casa en junio y me ha pedido que sea su testigo.","de":"Meine beste Freundin heiratet im Juni und hat mich gebeten, ihre Trauzeugin zu sein.","ar":"ستتزوج صديقتي المقرّبة في شهر يونيو وطلبت مني أن أكون شاهدة على زواجها."},{"id":104,"tema":"Relazioni e sentimenti","it":"Anche se viviamo in città diverse, cerchiamo di vederci almeno una volta al mese.","en":"Even though we live in different cities, we try to see each other at least once a month.","fr":"Même si nous vivons dans des villes différentes, nous essayons de nous voir au moins une fois par mois.","es":"Aunque vivimos en ciudades distintas, intentamos vernos al menos una vez al mes.","de":"Obwohl wir in verschiedenen Städten wohnen, versuchen wir, uns mindestens einmal im Monat zu sehen.","ar":"مع أننا نعيش في مدن مختلفة، نحاول أن نلتقي مرة في الشهر على الأقل."},{"id":105,"tema":"Relazioni e sentimenti","it":"Era molto nervoso prima del colloquio, ma alla fine è andato tutto meglio del previsto.","en":"He was very nervous before the interview, but in the end everything went better than expected.","fr":"Il était très nerveux avant l'entretien, mais finalement tout s'est mieux passé que prévu.","es":"Estaba muy nervioso antes de la entrevista, pero al final todo salió mejor de lo previsto.","de":"Er war vor dem Vorstellungsgespräch sehr nervös, aber am Ende lief alles besser als erwartet.","ar":"كان متوترًا جدًا قبل المقابلة، لكن في النهاية سار كل شيء أفضل مما كان متوقعًا."},{"id":106,"tema":"Relazioni e sentimenti","it":"Ringrazio di cuore tutti quelli che mi sono stati vicini in questo periodo difficile.","en":"I sincerely thank everyone who stood by me during this difficult period.","fr":"Je remercie de tout cœur tous ceux qui ont été à mes côtés pendant cette période difficile.","es":"Agradezco de corazón a todos los que han estado a mi lado en este periodo difícil.","de":"Ich danke von Herzen allen, die mir in dieser schwierigen Zeit beigestanden haben.","ar":"أشكر من كل قلبي كل من وقفوا إلى جانبي في هذه الفترة الصعبة."},{"id":107,"tema":"Città e servizi","it":"Per rinnovare il passaporto bisogna prendere un appuntamento online e portare due fotografie recenti.","en":"To renew your passport you need to make an appointment online and bring two recent photographs.","fr":"Pour renouveler le passeport, il faut prendre rendez-vous en ligne et apporter deux photos récentes.","es":"Para renovar el pasaporte hay que pedir cita por internet y llevar dos fotografías recientes.","de":"Um den Reisepass zu verlängern, muss man online einen Termin vereinbaren und zwei aktuelle Fotos mitbringen.","ar":"لتجديد جواز السفر يجب حجز موعد عبر الإنترنت وإحضار صورتين حديثتين."},{"id":108,"tema":"Città e servizi","it":"La banca è chiusa il sabato pomeriggio, ma puoi prelevare i soldi allo sportello automatico.","en":"The bank is closed on Saturday afternoon, but you can withdraw money from the cash machine.","fr":"La banque est fermée le samedi après-midi, mais tu peux retirer de l'argent au distributeur automatique.","es":"El banco está cerrado el sábado por la tarde, pero puedes sacar dinero del cajero automático.","de":"Die Bank ist am Samstagnachmittag geschlossen, aber du kannst am Geldautomaten Geld abheben.","ar":"البنك مغلق يوم السبت بعد الظهر، لكن يمكنك سحب المال من الصراف الآلي."},{"id":109,"tema":"Città e servizi","it":"L'autobus numero dodici passa ogni quindici minuti e ti porta direttamente all'ospedale.","en":"Bus number twelve comes every fifteen minutes and takes you straight to the hospital.","fr":"Le bus numéro douze passe toutes les quinze minutes et t'emmène directement à l'hôpital.","es":"El autobús número doce pasa cada quince minutos y te lleva directamente al hospital.","de":"Der Bus Nummer zwölf fährt alle fünfzehn Minuten und bringt dich direkt zum Krankenhaus.","ar":"تمرّ الحافلة رقم اثني عشر كل خمس عشرة دقيقة وتوصلك مباشرة إلى المستشفى."},{"id":110,"tema":"Città e servizi","it":"Il comune ha chiuso la strada principale per lavori, quindi bisogna fare un lungo giro per arrivare in centro.","en":"The council has closed the main road for roadworks, so you have to take a long detour to get to the centre.","fr":"La mairie a fermé la rue principale pour des travaux, il faut donc faire un long détour pour arriver au centre.","es":"El ayuntamiento ha cerrado la calle principal por obras, así que hay que dar un gran rodeo para llegar al centro.","de":"Die Gemeinde hat die Hauptstraße wegen Bauarbeiten gesperrt, deshalb muss man einen großen Umweg machen, um ins Zentrum zu kommen.","ar":"أغلقت البلدية الشارع الرئيسي بسبب الأشغال، لذلك يجب القيام بلفّة طويلة للوصول إلى المركز."},{"id":111,"tema":"Città e servizi","it":"Ho spedito il pacco una settimana fa, ma secondo il sito della posta non è ancora arrivato.","en":"I sent the parcel a week ago, but according to the post office website it has not arrived yet.","fr":"J'ai envoyé le colis il y a une semaine, mais d'après le site de la poste il n'est pas encore arrivé.","es":"Envié el paquete hace una semana, pero según la página de correos todavía no ha llegado.","de":"Ich habe das Paket vor einer Woche verschickt, aber laut der Website der Post ist es noch nicht angekommen.","ar":"أرسلت الطرد قبل أسبوع، لكن بحسب موقع البريد لم يصل بعد."},{"id":112,"tema":"Città e servizi","it":"In questo quartiere ci sono molti negozi, due scuole e un grande parco dove giocano i bambini.","en":"In this neighbourhood there are many shops, two schools and a large park where children play.","fr":"Dans ce quartier, il y a beaucoup de magasins, deux écoles et un grand parc où jouent les enfants.","es":"En este barrio hay muchas tiendas, dos colegios y un gran parque donde juegan los niños.","de":"In diesem Viertel gibt es viele Geschäfte, zwei Schulen und einen großen Park, in dem die Kinder spielen.","ar":"في هذا الحي توجد محلات كثيرة ومدرستان وحديقة كبيرة يلعب فيها الأطفال."},{"id":113,"tema":"Città e servizi","it":"Se perdi la carta d'identità, devi denunciarne lo smarrimento alla polizia prima di richiederne una nuova.","en":"If you lose your identity card, you must report the loss to the police before applying for a new one.","fr":"Si tu perds ta carte d'identité, tu dois déclarer la perte à la police avant d'en demander une nouvelle.","es":"Si pierdes el carné de identidad, tienes que denunciar la pérdida a la policía antes de pedir uno nuevo.","de":"Wenn du deinen Personalausweis verlierst, musst du den Verlust bei der Polizei melden, bevor du einen neuen beantragst.","ar":"إذا فقدت بطاقة الهوية، يجب أن تبلّغ الشرطة عن فقدانها قبل أن تطلب بطاقة جديدة."}],"testi":{"Scrivi la frase in {nome} e premi Invio":{"en":"Write the sentence in {nome} and press Enter","fr":"Écris la phrase en {nome} et appuie sur Entrée","es":"Escribe la frase en {nome} y pulsa Intro","de":"Schreib den Satz auf {nome} und drück die Eingabetaste","ar":"اكتب الجملة باللغة {nome} واضغط Enter"},"Scrivi in {nome} la frase che hai sentito e premi Invio":{"en":"Write in {nome} the sentence you heard and press Enter","fr":"Écris en {nome} la phrase que tu as entendue et appuie sur Entrée","es":"Escribe en {nome} la frase que has oído y pulsa Intro","de":"Schreib den gehörten Satz auf {nome} und drück die Eingabetaste","ar":"اكتب باللغة {nome} الجملة التي سمعتها واضغط Enter"},"Frasi superate: {giuste} su {x}":{"en":"Passed: {giuste} of {x}","fr":"Réussis : {giuste} sur {x}","es":"Superadas: {giuste} de {x}","de":"Bestanden: {giuste} von {x}","ar":"الناجحة: {giuste} من {x}"},"Ascolta la frase in {lingua}...":{"en":"Listen to the sentence in {lingua}...","fr":"Écoute la phrase en {lingua}...","es":"Escucha la frase en {lingua}...","de":"Hör dir den Satz auf {lingua} an...","ar":"استمع إلى الجملة بال
