»، «حاول مرة أخرى»...)"},"Esci":{"en":"Exit","fr":"Quitter","es":"Salir","de":"Beenden","ar":"خروج"},"Voce {lingua}: voce online Microsoft (serve internet la prima volta che si sente ogni frase)":{"en":"{lingua} voice: Microsoft online voice (internet needed the first time each sentence is heard)","fr":"Voix ({lingua}) : voix en ligne Microsoft (internet nécessaire la première fois qu'on entend chaque phrase)","es":"Voz ({lingua}): voz en línea de Microsoft (hace falta internet la primera vez que se oye cada frase)","de":"Stimme ({lingua}): Microsoft-Online-Stimme (Internet nötig, wenn ein Satz zum ersten Mal gesprochen wird)","ar":"الصوت ({lingua}): صوت Microsoft عبر الإنترنت (يلزم الإنترنت أول مرة تُسمع فيها كل جملة)"},"Voce {lingua}: NON INSTALLATA":{"en":"{lingua} voice: NOT INSTALLED","fr":"Voix ({lingua}) : NON INSTALLÉE","es":"Voz ({lingua}): NO INSTALADA","de":"Stimme ({lingua}): NICHT INSTALLIERT","ar":"الصوت ({lingua}): غير مثبّت"},"Verifica":{"en":"Check","fr":"Vérifier","es":"Comprobar","de":"Prüfen","ar":"تحقّق"},"Salta frase":{"en":"Skip","fr":"Passer","es":"Saltar","de":"Überspringen","ar":"تخطَّ"},"Non lo so":{"en":"I don't know","fr":"Je ne sais pas","es":"No lo sé","de":"Weiß ich nicht","ar":"لا أعرف"},"Termina sessione":{"en":"End session","fr":"Terminer la séance","es":"Terminar la sesión","de":"Sitzung beenden","ar":"إنهاء الجلسة"},"Dalla tua lingua ({lingua}) a:":{"en":"From your language ({lingua}) to:","fr":"De ta langue ({lingua}) vers :","es":"De tu idioma ({lingua}) a:","de":"Von deiner Sprache ({lingua}) nach:","ar":"من لغتك ({lingua}) إلى:"},"  Livello {livello}: bloccato.":{"en":"  Level {livello}: locked.","fr":"  Niveau {livello} : verrouillé.","es":"  Nivel {livello}: bloqueado.","de":"  Stufe {livello}: gesperrt.","ar":"  المستوى {livello}: مقفل."},"Chiudi":{"en":"Close","fr":"Fermer","es":"Cerrar","de":"Schließen","ar":"إغلاق"},"Per passare al livello successivo, in una sessione:":{"en":"To move to the next level, in one session:","fr":"Pour passer au niveau suivant, en une séance :","es":"Para pasar al nivel siguiente, en una sesión:","de":"Für die nächste Stufe, in einer Sitzung:","ar":"للانتقال إلى المستوى التالي، في جلسة واحدة:"},"Errori massimi (% delle risposte):":{"en":"Maximum errors (% of answers):","fr":"Erreurs maximum (% des réponses) :","es":"Errores máximos (% de las respuestas):","de":"Höchstens Fehler (% der Antworten):","ar":"الحد الأقصى للأخطاء (% من الإجابات):"},"Frasi minime nella sessione:":{"en":"Minimum items per session:","fr":"Minimum d'éléments par séance :","es":"Mínimo de elementos por sesión:","de":"Mindestanzahl pro Sitzung:","ar":"الحد الأدنى من العناصر في الجلسة:"},"Ogni sessione si valuta da sola: le sessioni precedenti non contano. Le sessioni con meno frasi del minimo valgono come allenamento. La percentuale di errori si calcola sulle risposte: ogni tentativo valutato (ripetizione, traduzione a voce, scritto, pronuncia) è una risposta, e ogni tentativo sbagliato o frase saltata è un errore. Un livello sbloccato resta sbloccato anche se cambi queste impostazioni.":{"en":"Each session is judged on its own: previous sessions do not count. Sessions with fewer items than the minimum count as practice. The error percentage is calculated on the answers: each graded attempt (repetition, spoken translation, written answer, pronunciation) is one answer, and each wrong attempt or skipped item is one error. An unlocked level stays unlocked even if you change these settings.","fr":"Chaque séance est évaluée seule : les séances précédentes ne comptent pas. Les séances avec moins d'éléments que le minimum comptent comme entraînement. Le pourcentage d'erreurs se calcule sur les réponses : chaque essai évalué (répétition, traduction orale, écrit, prononciation) est une réponse, et chaque essai faux ou élément passé est une erreur. Un niveau débloqué reste débloqué même si tu modifies ces paramètres.","es":"Cada sesión se valora por sí sola: las sesiones anteriores no cuentan. Las sesiones con menos elementos del mínimo cuentan como práctica. El porcentaje de errores se calcula sobre las respuestas: cada intento evaluado (repetición, traducción oral, escrito, pronunciación) es una respuesta, y cada intento fallido o elemento saltado es un error. Un nivel desbloqueado sigue desbloqueado aunque cambies estos ajustes.","de":"Jede Sitzung wird für sich bewertet: frühere Sitzungen zählen nicht. Sitzungen mit weniger Einträgen als dem Minimum gelten als Übung. Die Fehlerquote wird auf die Antworten berechnet: Jeder bewertete Versuch (Nachsprechen, mündliche Übersetzung, Schreiben, Aussprache) ist eine Antwort, und jeder falsche Versuch oder übersprungene Eintrag ist ein Fehler. Eine freigeschaltete Stufe bleibt freigeschaltet, auch wenn du diese Einstellungen änderst.","ar":"تُقيَّم كل جلسة وحدها: الجلسات السابقة لا تُحتسب. الجلسات التي فيها عناصر أقل من الحد الأدنى تُعدّ تدريبًا. تُحسب نسبة الأخطاء من الإجابات: كل محاولة مقيَّمة (تكرار، ترجمة شفهية، كتابة، نطق) هي إجابة، وكل محاولة خاطئة أو عنصر متخطى خطأ. يبقى المستوى المفتوح مفتوحًا حتى لو غيّرت هذه الإعدادات."},"Microfono":{"en":"Microphone","fr":"Micro","es":"Micrófono","de":"Mikrofon","ar":"الميكروفون"},"Secondi di attesa della risposta:":{"en":"Seconds to wait for the answer:","fr":"Secondes d'attente de la réponse :","es":"Segundos de espera de la respuesta:","de":"Wartezeit auf die Antwort (Sekunden):","ar":"ثواني انتظار الإجابة:"},"Quanto tempo il programma ti aspetta dopo il bip prima di dire «Non ti ho sentito».":{"en":"How long the program waits for you after the beep before saying “I didn't hear you”.","fr":"Combien de temps le programme t'attend après le bip avant de dire « Je ne t'ai pas entendu ».","es":"Cuánto tiempo te espera el programa después del pitido antes de decir «No te he oído».","de":"Wie lange das Programm nach dem Piepton wartet, bevor es „Ich habe dich nicht gehört“ sagt.","ar":"المدة التي ينتظرك فيها البرنامج بعد الصفارة قبل أن يقول «لم أسمعك»."},"Inserisci nu on not available ({errore})","fr":"Traduction indisponible ({errore})","es":"Traducción no disponible ({errore})","de":"Übersetzung nicht verfügbar ({errore})","ar":"الترجمة غير متاحة ({errore})"},"superata":{"en":"passed","fr":"réussie","es":"superada","de":"bestanden","ar":"ناجحة"},"non superata":{"en":"not passed","fr":"non réussie","es":"no superada","de":"nicht bestanden","ar":"غير ناجحة"},"0 - Vocaboli: scopri, riconosci e ricorda le parole":{"en":"0 - Vocabulary: discover, recognize and remember words","fr":"0 - Vocabulaire : découvre, reconnais et retiens les mots","es":"0 - Vocabulario: descubre, reconoce y recuerda las palabras","de":"0 - Wortschatz: Wörter entdecken, erkennen und behalten","ar":"0 - المفردات: اكتشف الكلمات وتعرّف عليها وتذكّرها"},"1 - Ascolta, ripeti e traduci":{"en":"1 - Listen, repeat and translate","fr":"1 - Écoute, répète et traduis","es":"1 - Escucha, repite y traduce","de":"1 - Hören, nachsprechen, übersetzen","ar":"1 - استمع وكرّر وترجم"},"2 - Frasi miste: traduci a voce e per iscritto":{"en":"2 - Mixed sentences: translate aloud and in writing","fr":"2 - Phrases mélangées : traduis à l'oral et à l'écrit","es":"2 - Frases mixtas: traduce oralmente y por escrito","de":"2 - Gemischte Sätze: mündlich und schriftlich übersetzen","ar":"2 - جمل مختلطة: ترجم شفهيًا وكتابيًا"},"3 - Dettato: ascolta, scrivi, pronuncia e traduci":{"en":"3 - Dictation: listen, write, say and translate","fr":"3 - Dictée : écoute, écris, prononce et traduis","es":"3 - Dictado: escucha, escribe, pronuncia y traduce","de":"3 - Diktat: hören, schreiben, sprechen, übersetzen","ar":"3 - إملاء: استمع واكتب وانطق وترجم"},"Per chi parte da zero. Parole e verbi di base, per temi, in tre passi:\n1. Scopri le parole nuove (senti, vedi la traduzione e ripeti, senza voto)  2. Riconosci: scegli la traduzione giusta tra quattro  3. Ricorda: ripeti e traduci a voce.":{"en":"For complete beginners. Basic words and verbs, by topic, in three steps:\n1. Discover the new words (listen, see the translation and repeat, not graded)  2. Recognize: choose the right translation out of four  3. Remember: repeat and translate aloud.","fr":"Pour les grands débutants. Mots et verbes de base, par thème, en trois étapes :\n1. Découvre les nouveaux mots (écoute, vois la traduction et répète, sans note)  2. Reconnais : choisis la bonne traduction parmi quatre  3. Retiens : répète et traduis à voix haute.","es":"Para quien empieza de cero. Palabras y verbos básicos, por temas, en tres pasos:\n1. Descubre las palabras nuevas (escucha, mira la traducción y repite, sin nota)  2. Reconoce: elige la traducción correcta entre cuatro  3. Recuerda: repite y traduce en voz alta.","de":"Für Anfänger ohne Vorkenntnisse. Grundwörter und Verben nach Themen, in drei Schritten:\n1. Neue Wörter entdecken (hören, Übersetzung sehen und nachsprechen, ohne Bewertung)  2. Erkennen: die richtige von vier Übersetzungen wählen  3. Behalten: nachsprechen und mündlich übersetzen.","ar":"لمن يبدأ من الصفر. كلمات وأفعال أساسية حسب المواضيع، في ثلاث خطوات:\n1. اكتشف الكلمات الجديدة (استمع وشاهد الترجمة وكرّر، بدون تقييم)  2. تعرّف: اختر الترجمة الصحيحة من بين أربع  3. تذكّر: كرّر وترجم شفهيًا."},"Ascolti la frase, la ripeti e la traduci a voce nella tua lingua.":{"en":"You listen to the sentence, repeat it and translate it aloud into your language.","fr":"Tu écoutes la phrase, tu la répètes et tu la traduis à voix haute dans ta langue.","es":"Escuchas la frase, la repites y la traduces en voz alta a tu idioma.","de":"Du hörst den Satz, sprichst ihn nach und übersetzt ihn mündlich in deine Sprache.","ar":"تستمع إلى الجملة وتكررها ثم تترجمها شفهيًا إلى لغتك."},"Le frasi arrivano a caso in una delle due lingue. Dalla lingua straniera: ripeti e traduci a voce.\nDalla tua lingua: scrivi la traduzione e poi pronunciala.":{"en":"Sentences come at random in one of the two languages. From the foreign language: repeat and translate aloud.\nFrom your language: write the translation and then say it.","fr":"Les phrases arrivent au hasard dans l'une des deux langues. Depuis la langue étrangère : répète et traduis à voix haute.\nDepuis ta langue : écris la traduction puis prononce-la.","es":"Las frases llegan al azar en uno de los dos idiomas. Desde el idioma extranjero: repite y traduce en voz alta.\nDesde tu idioma: escribe la traducción y luego pronúnciala.","de":"Die Sätze kommen zufällig in einer der beiden Sprachen. Aus der Fremdsprache: nachsprechen und mündlich übersetzen.\nAus deiner Sprache: Übersetzung schreiben und dann aussprechen.","ar":"تأتي الجمل عشوائيًا بإحدى اللغتين. من اللغة الأجنبية: كرّر وترجم شفهيًا.\nمن لغتك: اكتب الترجمة ثم انطقها."},"La frase si sente soltanto, senza testo, a caso in una delle due lingue.\nIn lingua straniera: scrivila, pronunciala e di' la traduzione nella tua lingua.\nNella tua lingua: scrivi la traduzione nella lingua straniera e poi pronunciala.":{"en":"You only hear the sentence, with no text, at random in one of the two languages.\nIn the foreign language: write it, say it and give the translation in your language.\nIn your language: write the translation in the foreign language and then say it.","fr":"Tu entends seulement la phrase, sans texte, au hasard dans l'une des deux langues.\nEn langue étrangère : écris-la, prononce-la et dis la traduction dans ta langue.\nDans ta langue : écris la traduction en langue étrangère puis prononce-la.","es":"Solo oyes la frase, sin texto, al azar en uno de los dos idiomas.\nEn el idioma extranjero: escríbela, pronúnciala y di la traducción en tu idioma.\nEn tu idioma: escribe la traducción en el idioma extranjero y luego pronúnciala.","de":"Du hörst den Satz nur, ohne Text, zufällig in einer der beiden Sprachen.\nIn der Fremdsprache: aufschreiben, aussprechen und in deine Sprache übersetzen.\nIn deiner Sprache: die Übersetzung in der Fremdsprache schreiben und dann aussprechen.","ar":"تسمع الجملة فقط، بدون نص، عشوائيًا بإحدى اللغتين.\nباللغة الأجنبية: اكتبها وانطقها وقل ترجمتها بلغتك.\nبلغتك: اكتب الترجمة باللغة الأجنبية ثم انطقها."},"Scopri":{"en":"Discover","fr":"Découvre","es":"Descubre","de":"Entdecken","ar":"اكتشف"},"Riconosci":{"en":"Recognize","fr":"Reconnais","es":"Reconoce","de":"Erkennen","ar":"تعرّف"},"Ricorda":{"en":"Remember","fr":"Retiens","es":"Recuerda","de":"Behalten","ar":"تذكّر"},"Ripetizione":{"en":"Repetition","fr":"Répétition","es":"Repetición","de":"Nachsprechen","ar":"التكرار"},"Pronuncia":{"en":"Pronunciation","fr":"Prononciation","es":"Pronunciación","de":"Aussprache","ar":"النطق"},"Ripeti":{"en":"Repeat","fr":"Répète","es":"Repite","de":"Nachsprechen","ar":"كرّر"},"Saluti e cortesia":{"en":"Greetings and courtesy","fr":"Salutations et politesse","es":"Saludos y cortesía","de":"Begrüßung und Höflichkeit","ar":"التحية والمجاملة"},"Parole per domandare":{"en":"Question words","fr":"Mots pour poser des questions","es":"Palabras para preguntar","de":"Fragewörter","ar":"كلمات السؤال"},"Persone":{"en":"People","fr":"Personnes","es":"Personas","de":"Personen","ar":"الأشخاص"},"Famiglia":{"en":"Family","fr":"Famille","es":"Familia","de":"Familie","ar":"العائلة"},"Numeri":{"en":"Numbers","fr":"Nombres","es":"Números","de":"Zahlen","ar":"الأرقام"},"Cibo e bevande":{"en":"Food and drink","fr":"Nourriture et boissons","es":"Comida y bebida","de":"Essen und Trinken","ar":"الطعام والشراب"},"Luoghi e trasporti":{"en":"Places and transport","fr":"Lieux et transports","es":"Lugares y transporte","de":"Orte und Verkehr","ar":"الأماكن والمواصلات"},"Indicazioni":{"en":"Directions","fr":"Directions","es":"Direcciones","de":"Wegbeschreibung","ar":"الاتجاهات"},"Casa e oggetti":{"en":"Home and objects","fr":"Maison et objets","es":"Casa y objetos","de":"Haus und Gegenstände","ar":"البيت والأشياء"},"Tempo":{"en":"Time and weather","fr":"Temps et météo","es":"Tiempo","de":"Zeit und Wetter","ar":"الوقت والطقس"},"Aggettivi":{"en":"Adjectives","fr":"Adjectifs","es":"Adjetivos","de":"Adjektive","ar":"الصفات"},"Verbi":{"en":"Verbs","fr":"Verb ":{"en":"Levels","fr":"Niveaux","es":"Niveles","de":"Stufen","ar":"المستويات"},"Esercizi":{"en":"Exercises","fr":"Exercices","es":"Ejercicios","de":"Übungen","ar":"التمارين"},"Microfono e voce":{"en":"Microphone and voice","fr":"Micro et voix","es":"Micrófono y voz","de":"Mikrofon und Stimme","ar":"الميكروفون والصوت"},"Modalità collaudo: tutti i livelli sbloccati":{"en":"Test mode: all levels unlocked","fr":"Mode test : tous les niveaux débloqués","es":"Modo de prueba: todos los niveles desbloqueados","de":"Testmodus: alle Stufen freigeschaltet","ar":"وضع الاختبار: كل المستويات مفتوحة"},"Per provare il programma senza superare i livelli precedenti. Le sessioni fatte in collaudo sono segnate nel registro e non sbloccano livelli.":{"en":"To try the program without passing the previous levels. Sessions done in test mode are marked in the results and do not unlock levels.","fr":"Pour essayer le programme sans réussir les niveaux précédents. Les séances en mode test sont marquées dans les résultats et ne débloquent pas de niveaux.","es":"Para probar el programa sin superar los niveles anteriores. Las sesiones en modo de prueba se marcan en el registro y no desbloquean niveles.","de":"Um das Programm auszuprobieren, ohne die vorherigen Stufen zu bestehen. Sitzungen im Testmodus werden in den Ergebnissen markiert und schalten keine Stufen frei.","ar":"لتجربة البرنامج دون اجتياز المستويات السابقة. الجلسات في وضع الاختبار تُعلَّم في السجل ولا تفتح مستويات."},"MODALITÀ COLLAUDO: tutti i livelli sono sbloccati (si disattiva da Impostazioni)":{"en":"TEST MODE: all levels are unlocked (turn it off in Settings)","fr":"MODE TEST : tous les niveaux sont débloqués (à désactiver dans Paramètres)","es":"MODO DE PRUEBA: todos los niveles están desbloqueados (se desactiva en Ajustes)","de":"TESTMODUS: alle Stufen sind freigeschaltet (in den Einstellungen abschalten)","ar":"وضع الاختبار: كل المستويات مفتوحة (يُلغى من الإعدادات)"},"collaudo":{"en":"test","fr":"test","es":"prueba","de":"Test","ar":"اختبار"},"Tentativi per ogni prova:":{"en":"Attempts per task:","fr":"Essais par épreuve :","es":"Intentos por prueba:","de":"Versuche pro Aufgabe:","ar":"المحاولات لكل تمرين:"},"Quante volte puoi riprovare una ripetizione, una traduzione o uno scritto prima che il programma mostri la soluzione.":{"en":"How many times you can retry a repetition, a translation or a written answer before the program shows the solution.","fr":"Combien de fois tu peux réessayer une répétition, une traduction ou un écrit avant que le programme montre la solution.","es":"Cuántas veces puedes reintentar una repetición, una traducción o un escrito antes de que el programa muestre la solución.","de":"Wie oft du Nachsprechen, Übersetzen oder Schreiben wiederholen kannst, bevor das Programm die Lösung zeigt.","ar":"عدد المرات التي يمكنك فيها إعادة التكرار أو الترجمة أو الكتابة قبل أن يعرض البرنامج الحل."},"Parole nuove per sessione (livello 0):":{"en":"New words per session (level 0):","fr":"Nouveaux mots par séance (niveau 0) :","es":"Palabras nuevas por sesión (nivel 0):","de":"Neue Wörter pro Sitzung (Stufe 0):","ar":"كلمات جديدة في كل جلسة (المستوى 0):"},"Pronuncia valutata con indulgenza:":{"en":"Lenient pronunciation check:","fr":"Prononciation évaluée avec indulgence :","es":"Pronunciación evaluada con indulgencia:","de":"Nachsichtige Bewertung der Aussprache:","ar":"تقييم متساهل للنطق:"},"mai":{"en":"never","fr":"jamais","es":"nunca","de":"nie","ar":"أبدًا"},"solo livello 0":{"en":"level 0 only","fr":"niveau 0 seulement","es":"solo nivel 0","de":"nur Stufe 0","ar":"المستوى 0 فقط"},"livelli 0 e 1":{"en":"levels 0 and 1","fr":"niveaux 0 et 1","es":"niveles 0 y 1","de":"Stufen 0 und 1","ar":"المستويان 0 و1"},"livelli 0, 1 e 2":{"en":"levels 0, 1 and 2","fr":"niveaux 0, 1 et 2","es":"niveles 0, 1 y 2","de":"Stufen 0, 1 und 2","ar":"المستويات 0 و1 و2"},"tutti i livelli":{"en":"all levels","fr":"tous les niveaux","es":"todos los niveles","de":"alle Stufen","ar":"كل المستويات"},"Con l'indulgenza una pronuncia imperfetta viene accettata, purché le parole siano quelle giuste. La traduzione nella tua lingua è sempre valutata con indulgenza.":{"en":"With leniency an imperfect pronunciation is accepted, as long as the words are the right ones. The translation into your language is always checked leniently.","fr":"Avec l'indulgence, une prononciation imparfaite est acceptée, pourvu que les mots soient les bons. La traduction dans ta langue est toujours évaluée avec indulgence.","es":"Con indulgencia se acepta una pronunciación imperfecta, siempre que las palabras sean las correctas. La traducción a tu idioma siempre se evalúa con indulgencia.","de":"Mit Nachsicht wird eine unvollkommene Aussprache akzeptiert, solange die Wörter stimmen. Die Übersetzung in deine Sprache wird immer nachsichtig bewertet.","ar":"مع التساهل يُقبل النطق غير المتقن ما دامت الكلمات صحيحة. تُقيَّم الترجمة إلى لغتك دائمًا بتساهل."},"Margine dopo la voce del computer (secondi):":{"en":"Margin after the computer's voice (seconds):","fr":"Marge après la voix de l'ordinateur (secondes) :","es":"Margen tras la voz del ordenador (segundos):","de":"Abstand nach der Computerstimme (Sekunden):","ar":"الهامش بعد صوت الحاسوب (بالثواني):"},"Aumentalo se il programma registra la fine della propria voce; diminuiscilo se perde l'inizio delle tue risposte.":{"en":"Increase it if the program records the end of its own voice; decrease it if it misses the start of your answers.","fr":"Augmente-la si le programme enregistre la fin de sa propre voix ; diminue-la s'il perd le début de tes réponses.","es":"Auméntalo si el programa graba el final de su propia voz; redúcelo si pierde el comienzo de tus respuestas.","de":"Erhöhe ihn, wenn das Programm das Ende seiner eigenen Stimme aufnimmt; verringere ihn, wenn der Anfang deiner Antworten fehlt.","ar":"زِده إذا كان البرنامج يسجّل نهاية صوته؛ وقلّله إذا كان يفقد بداية إجاباتك."},"Precisione del riconoscimento vocale:":{"en":"Speech recognition accuracy:","fr":"Précision de la reconnaissance vocale :","es":"Precisión del reconocimiento de voz:","de":"Genauigkeit der Spracherkennung:","ar":"دقة التعرّف على الكلام:"},"base (veloce)":{"en":"base (fast)","fr":"base (rapide)","es":"base (rápido)","de":"base (schnell)","ar":"base (سريع)"},"small (consigliato)":{"en":"small (recommended)","fr":"small (conseillé)","es":"small (recomendado)","de":"small (empfohlen)","ar":"small (موصى به)"},"medium (preciso, lento)":{"en":"medium (accurate, slow)","fr":"medium (précis, lent)","es":"medium (preciso, lento)","de":"medium (genau, langsam)","ar":"medium (دقيق، بطيء)"},"Vale dal prossimo avvio. «medium» capisce meglio ma è più lento e la prima volta scarica circa 1,5 GB.":{"en":"Applies from the next start. “medium” understands better but is slower and the first time downloads about 1.5 GB.","fr":"S'applique au prochain démarrage. « medium » comprend mieux mais il est plus lent et télécharge environ 1,5 Go la première fois.","es":"Se aplica desde el próximo inicio. «medium» entiende mejor pero es más lento y la primera vez descarga unos 1,5 GB.","de":"Gilt ab dem nächsten Start. „medium“ versteht besser, ist aber langsamer und lädt beim ersten Mal etwa 1,5 GB herunter.","ar":"يُطبَّق من التشغيل القادم. «medium» يفهم أفضل لكنه أبطأ وينزّل نحو 1.5 غيغابايت في المرة الأولى."},"La nuova precisione del riconoscimento vocale vale dal prossimo avvio del programma.":{"en":"The new speech recognition accuracy applies from the next start of the program.","fr":"La nouvelle précision de la reconnaissance vocale s'applique au prochain démarrage du programme.","es":"La nueva precisión del reconocimiento de voz se aplica desde el próximo inicio del programa.","de":"Die neue Genauigkeit der Spracherkennung gilt ab dem nächsten Programmstart.","ar":"تُطبَّق دقة التعرّف على الكلام الجديدة من التشغيل القادم للبرنامج."},"(nessun libro scelto)":{"en":"(no book chosen)","fr":"(aucun livre choisi)","es":"(ningún libro elegido)","de":"(kein Buch gewählt)","ar":"(لم يتم اختيار كتاب)"},"(non disponibile: valuta in base a quello che hai capito)":{"en":"(not available: judge from what you understood)","fr":"(non disponible : juge d'après ce que tu as compris)","es":"(no disponible: valora según lo que has entendido)","de":"(nicht verfügbar: bewerte nach dem, was du verstanden hast)","ar":"(غير متوفرة: قيّم بحسب ما فهمته)"},"4 - Testi veri: leggi, traduci e valuta":{"en":"4 - Real texts: read, translate and evaluate","fr":"4 - Vrais textes : lis, traduis et évalue","es":"4 - Textos reales: lee, traduce y evalúa","de":"4 - Echte Texte: lesen, übersetzen und bewerten","ar":"4 - نصوص حقيقية: اقرأ وترجم وقيّم"},"Aderenza minima della traduzione (livello 4, %):":{"en":"Minimum translation accuracy (level 4, %):","fr":"Fidélité minimale de la traduction (niveau 4, %) :","es":"Fidelidad mínima de la traducción (nivel 4, %):","de":"Mindesttreue der Übersetzung (Stufe 4, %):","ar":"الحد الأدنى لمطابقة الترجمة (المستوى 4، %):"},"Aderenza {perc}%: da migliorare (minimo {minima}%)":{"en":"Accuracy {perc}%: to improve (minimum {minima}%)","fr":"Fidélité {perc}% : à améliorer (minimum {minima}%)","es":"Fidelidad {perc}%: hay que mejorar (mínimo {minima}%)","de":"Treue {perc}%: noch zu verbessern (mindestens {minima}%)","ar":"المطابقة {perc}%: تحتاج إلى تحسين (الحد الأدنى {minima}%)"},"Aderenza {perc}%: traduzione giusta":{"en":"Accuracy {perc}%: correct translation","fr":"Fidélité {perc}% : traduction correcte","es":"Fidelidad {perc}%: traducción correcta","de":"Treue {perc}%: richtige Übersetzung","ar":"المطابقة {perc}%: ترجمة صحيحة"},"Al livello 4 sei tu a dire quanto la tua traduzione aderiva al significato: da questa percentuale in su conta come giusta.":{"en":"At level 4 you decide how closely your translation matched the meaning: from this percentage up it counts as correct.","fr":"Au niveau 4, c'est toi qui dis à quel point ta traduction respectait le sens : à partir de ce pourcentage, elle compte comme juste.","es":"En el ticle from the Internet","fr":"Article depuis Internet","es":"Artículo de Internet","de":"Artikel aus dem Internet","ar":"مقال من الإنترنت"},"Da un indirizzo Internet...":{"en":"From an Internet address...","fr":"Depuis une adresse Internet...","es":"Desde una dirección de Internet...","de":"Von einer Internetadresse...","ar":"من عنوان على الإنترنت..."},"Hai finito questo articolo! Vuoi rileggerlo dall'inizio?\n(Altrimenti scegline uno nuovo.)":{"en":"You have finished this article! Do you want to read it again from the beginning?\n(Otherwise choose a new one.)","fr":"Tu as fini cet article ! Veux-tu le relire depuis le début ?\n(Sinon, choisis-en un nouveau.)","es":"¡Has terminado este artículo! ¿Quieres volver a leerlo desde el principio?\n(Si no, elige uno nuevo.)","de":"Du hast diesen Artikel beendet! Möchtest du ihn von vorne lesen?\n(Sonst wähle einen neuen.)","ar":"لقد أنهيت هذا المقال! هل تريد إعادة قراءته من البداية؟\n(وإلا فاختر مقالًا جديدًا.)"},"In quella pagina non ho trovato il testo dell'articolo. Prova a copiarlo e usa «Incolla il testo...».":{"en":"I couldn't find the article text on that page. Try copying it and use «Paste the text...».","fr":"Je n'ai pas trouvé le texte de l'article sur cette page. Essaie de le copier et utilise «Coller le texte...».","es":"No he encontrado el texto del artículo en esa página. Prueba a copiarlo y usa «Pegar el texto...».","de":"Auf dieser Seite habe ich den Artikeltext nicht gefunden. Kopiere ihn und benutze «Text einfügen...».","ar":"لم أجد نص المقال في تلك الصفحة. جرّب نسخه واستخدم «الصق النص...»."},"Incolla il testo...":{"en":"Paste the text...","fr":"Coller le texte...","es":"Pegar el texto...","de":"Text einfügen...","ar":"الصق النص..."},"Incolla l'articolo":{"en":"Paste the article","fr":"Coller l'article","es":"Pegar el artículo","de":"Artikel einfügen","ar":"الصق المقال"},"Indirizzo (URL) di un articolo in {lingua}:":{"en":"Address (URL) of an article in {lingua}:","fr":"Adresse (URL) d'un article en {lingua} :","es":"Dirección (URL) de un artículo en {lingua}:","de":"Adresse (URL) eines Artikels auf {lingua}:","ar":"عنوان (URL) لمقال بـ{lingua}:"},"Nel testo non ho trovato abbastanza frasi da leggere.":{"en":"I didn't find enough sentences to read in the text.","fr":"Je n'ai pas trouvé assez de phrases à lire dans le texte.","es":"No he encontrado suficientes frases para leer en el texto.","de":"Im Text habe ich nicht genug Sätze zum Lesen gefunden.","ar":"لم أجد في النص جملًا كافية للقراءة."},"Non ho trovato un articolo abbastanza lungo: riprova.":{"en":"I couldn't find a long enough article: try again.","fr":"Je n'ai pas trouvé d'article assez long : réessaie.","es":"No he encontrado un artículo suficientemente largo: inténtalo de nuevo.","de":"Ich habe keinen ausreichend langen Artikel gefunden: versuch es noch einmal.","ar":"لم أجد مقالًا طويلًا بما يكفي: حاول مرة أخرى."},"Non sono riuscito a scaricare l'articolo:\n{errore}":{"en":"I couldn't download the article:\n{errore}","fr":"Je n'ai pas réussi à télécharger l'article :\n{errore}","es":"No he podido descargar el artículo:\n{errore}","de":"Ich konnte den Artikel nicht herunterladen:\n{errore}","ar":"لم أتمكن من تنزيل المقال:\n{errore}"},"Nuovo articolo:":{"en":"New article:","fr":"Nouvel article :","es":"Nuevo artículo:","de":"Neuer Artikel:","ar":"مقال جديد:"},"Scarico l'articolo...":{"en":"Downloading the article...","fr":"Je télécharge l'article...","es":"Descargando el artículo...","de":"Ich lade den Artikel herunter...","ar":"جارٍ تنزيل المقال..."},"Scegli prima un articolo con i pulsanti del livello 5.":{"en":"First choose an article with the level 5 buttons.","fr":"Choisis d'abord un article avec les boutons du niveau 5.","es":"Primero elige un artículo con los botones del nivel 5.","de":"Wähle zuerst einen Artikel mit den Schaltflächen von Stufe 5.","ar":"اختر أولًا مقالًا بأزرار المستوى 5."},"Testo dell'articolo in {lingua} (Ctrl+V per incollare):":{"en":"Article text in {lingua} (Ctrl+V to paste):" ne o il significato in {lingua}":{"en":"Say the translation or the meaning in {lingua}","fr":"Dis la traduction ou le sens en {lingua}","es":"Di la traducción o el significado en {lingua}","de":"Sag die Übersetzung oder die Bedeutung auf {lingua}","ar":"قل الترجمة أو المعنى بـ{lingua}"},"Le frasi lunghe (preparate, dal libro o dall'articolo) si sentono soltanto, a velocità normale.\nRipetile, poi di' la traduzione o almeno il significato; infine valuta quanto ci sei andato vicino.":{"en":"The long sentences (prepared, from the book or from the article) are only heard, at normal speed.\nRepeat them, then say the translation or at least the meaning; finally rate how close you got.","fr":"Les phrases longues (préparées, du livre ou de l'article) sont seulement entendues, à vitesse normale.\nRépète-les, puis dis la traduction ou au moins le sens ; enfin évalue à quel point tu t'en es approché.","es":"Las frases largas (preparadas, del libro o del artículo) solo se oyen, a velocidad normal.\nRepítelas, luego di la traducción o al menos el significado; por último valora cuánto te has acercado.","de":"Die langen Sätze (vorbereitet, aus dem Buch oder aus dem Artikel) sind nur zu hören, in normalem Tempo.\nWiederhole sie, sag dann die Übersetzung oder wenigstens die Bedeutung; bewerte zum Schluss, wie nah du dran warst.","ar":"الجمل الطويلة (المُعدّة أو من الكتاب أو من المقال) تُسمع فقط، بسرعة عادية.\nكرّرها، ثم قل الترجمة أو المعنى على الأقل؛ وأخيرًا قيّم مدى اقترابك."},"«{titolo}»\n\n{inizio}\n\n({totale} frasi)\n\nVuoi usare questo articolo?\nSì = usalo    ·    No = cercane un altro    ·    Annulla = lascia quello di prima":{"en":"«{titolo}»\n\n{inizio}\n\n({totale} sentences)\n\nDo you want to use this article?\nYes = use it    ·    No = find another    ·    Cancel = keep the previous one","fr":"«{titolo}»\n\n{inizio}\n\n({totale} phrases)\n\nVeux-tu utiliser cet article ?\nOui = l'utiliser    ·    Non = en chercher un autre    ·    Annuler = garder le précédent","es":"«{titolo}»\n\n{inizio}\n\n({totale} frases)\n\n¿Quieres usar este artículo?\nSí = usarlo    ·    No = buscar otro    ·    Cancelar = mantener el anterior","de":"«{titolo}»\n\n{inizio}\n\n({totale} Sätze)\n\nMöchtest du diesen Artikel verwenden?\nJa = verwenden    ·    Nein = einen anderen suchen    ·    Abbrechen = den vorherigen behalten","ar":"«{titolo}»\n\n{inizio}\n\n({totale} جملة)\n\nهل تريد استخدام هذا المقال؟\nنعم = استخدمه    ·    لا = ابحث عن غيره    ·    إلغاء = احتفظ بالسابق"},"% di frasi in {lingua} (livello 4):":{"en":"% of sentences in {lingua} (level 4):","fr":"% de phrases en {lingua} (niveau 4) :","es":"% de frases en {lingua} (nivel 4):","de":"% der Sätze auf {lingua} (Stufe 4):","ar":"نسبة الجمل بـ{lingua} (المستوى 4) %:"},"Queste frasi arrivano nella tua lingua e le traduci nella lingua da imparare; le altre arrivano nella lingua da imparare. 0 = nessuna, 100 = tutte.":{"en":"These sentences come in your language and you translate them into the language you are learning; the others come in the language you are learning. 0 = none, 100 = all.","fr":"Ces phrases arrivent dans ta langue et tu les traduis dans la langue à apprendre ; les autres arrivent dans la langue à apprendre. 0 = aucune, 100 = toutes.","es":"Estas frases llegan en tu idioma y las traduces al idioma que aprendes; las demás llegan en el idioma que aprendes. 0 = ninguna, 100 = todas.","de":"Diese Sätze kommen in deiner Sprache und du übersetzt sie in die Lernsprache; die anderen kommen in der Lernsprache. 0 = keine, 100 = alle.","ar":"تأتي هذه الجمل بلغتك فتترجمها إلى اللغة التي تتعلمها؛ أما الباقي فيأتي باللغة التي تتعلمها. 0 = لا شيء، 100 = الكل."}},"testi_extra":{"Esatto!":{"en":"Correct!","fr":"Exact !","es":"¡Correcto!","de":"Richtig!","ar":"صحيح!"},"OK":{"en":"OK","fr":"OK","es":"OK","de":"OK","ar":"موافق"},"Sì":{"en":"Yes","fr":"Oui","es":"Sí","de":"Ja","ar":"نعم"},"No":{"en":"No","fr":"Non","es":"No","de":"Nein","ar":"لا"},"Copia dei dati":{"en":"Data backup","fr":"Copie des <script>
// =============================================================================
// Impara le Lingue – logica di confronto (traduzione fedele della versione Python)
// =============================================================================
"use strict";

// ---------------------------------------------------------------- SequenceMatcher (difflib)
class SequenceMatcher {
  constructor(a, b, autojunk = true) {
    this.a = typeof a === "string" ? Array.from(a) : a;
    this.b = typeof b === "string" ? Array.from(b) : b;
    const b2j = new Map();
    this.b.forEach((x, j) => {
      if (!b2j.has(x)) b2j.set(x, []);
      b2j.get(x).push(j);
    });
    const n = this.b.length;
    if (autojunk && n >= 200) {
      const ntest = Math.floor(n / 100) + 1;
      for (const [x, idx] of [...b2j]) if (idx.length > ntest) b2j.delete(x);
    }
    this.b2j = b2j;
    this._blocks = null;
  }
  findLongestMatch(alo, ahi, blo, bhi) {
    let besti = alo, bestj = blo, bestsize = 0;
    let j2len = new Map();
    for (let i = alo; i < ahi; i++) {
      const nuovo = new Map();
      for (const j of this.b2j.get(this.a[i]) || []) {
        if (j < blo) continue;
        if (j >= bhi) break;
        const k = (j2len.get(j - 1) || 0) + 1;
        nuovo.set(j, k);
        if (k > bestsize) { besti = i - k + 1; bestj = j - k + 1; bestsize = k; }
      }
      j2len = nuovo;
    }
    return [besti, bestj, bestsize];
  }
  getMatchingBlocks() {
    if (this._blocks) return this._blocks;
    const la = this.a.length, lb = this.b.length;
    const coda = [[0, la, 0, lb]], blocchi = [];
    while (coda.length) {
      const [alo, ahi, blo, bhi] = coda.pop();
      const [i, j, k] = this.findLongestMatch(alo, ahi, blo, bhi);
      if (k) {
        blocchi.push([i, j, k]);
        if (alo < i && blo < j) coda.push([alo, i, blo, j]);
        if (i + k < ahi && j + k < bhi) coda.push([i + k, ahi, j + k, bhi]);
      }
    }
    blocchi.sort((x, y) => x[0] - y[0] || x[1] - y[1] || x[2] - y[2]);
    const uniti = [];
    let i1 = 0, j1 = 0, k1 = 0;
    for (const [i2, j2, k2] of blocchi) {
      if (i1 + k1 === i2 && j1 + k1 === j2) k1 += k2;
      else { if (k1) uniti.push([i1, j1, k1]); i1 = i2; j1 = j2; k1 = k2; }
    }
    if (k1) uniti.push([i1, j1, k1]);
    uniti.push([la, lb, 0]);
    return (this._blocks = uniti);
  }
  getOpcodes() {
    let i = 0, j = 0;
    const risultato = [];
    for (const [ai, bj, size] of this.getMatchingBlocks()) {
      let tag = "";
      if (i < ai && j < bj) tag = "replace";
      else if (i < ai) tag = "delete";
      else if (j < bj) tag = "insert";
      if (tag) risultato.push([tag, i, ai, j, bj]);
      i = ai + size; j = bj + size;
      if (size) risultato.push(["equal", ai, i, bj, j]);
    }
    return risultato;
  }
  ratio() {
    const m = this.getMatchingBlocks().reduce((s, b) => s + b[2], 0);
    const tot = this.a.length + this.b.length;
    return tot ? 2 * m / tot : 1.0;
  }
}
const rapporto = (a, b) => new SequenceMatcher(a, b).ratio();

// ---------------------------------------------------------------- soglie
const SOGLIE = {
  RIPETIZIONE: 0.80, TRADUZIONE: 0.75, PAROLA_PRONUNCIA: 0.60, PAROLA_TRADUZIONE: 0.75,
  SCRITTO: 0.80, LETTURA: 0.75, LETTURA_FACILE: 0.65, RIPETIZIONE_FACILE: 0.65,
  PAROLA_PRONUNCIA_FACILE: 0.70, PAROLA_CORTA: 0.90, SOMIGLIANZA_PAROLA_FACILE: 0.60,
};
const PAROLE_FRASE_TESTO = [4, 40];

// ---------------------------------------------------------------- normalizzazione
const CONTRAZIONI_EN = {
  "i'd": "i would", "i'm": "i am", "i've": "i have", "i'll": "i will",
  "don't": "do not", "doesn't": "does not", "didn't": "did not", "isn't": "is not",
  "aren't": "are not", "can't": "can not", "cannot": "can not", "won't": "will not",
  "it's": "it is", "what's": "what is", "where's": "where is", "that's": "that is",
  "you're": "you are", "we're": "we are", "they're": "they are", "let's": "let us",
};
const ARABO_UNIFICA = { "أ": "ا", "إ": "ا", "آ": "ا", "ٱ": "ا", "ى": "ي", "ة": "ه", "ؤ": "و", "ئ": "ي" };
const NUMERI_IN_LETTERE = {
  it: "zero uno due tre quattro cinque sei sette otto nove dieci",
  en: "zero one two three four five six seven eight nine ten",
  fr: "zéro un deux trois quatre cinq six sept huit neuf dix",
  es: "cero uno dos tres cuatro cinco seis siete ocho nueve diez",
  de: "null eins zwei drei vier fünf sechs sieben acht neun zehn",
  ar: "صفر واحد اثنان ثلاثة أربعة خمسة ستة سبعة ثمانية تسعة عشرة",
};

function valoreCifre(s) {
  let n = 0;
  for (const c of s) {
    const cp = c.codePointAt(0);
    let d;
    if (cp >= 0x30 && cp <= 0x39) d = cp - 0x30;
    else if (cp >= 0x660 && cp <= 0x669) d = cp - 0x660;
    else if (cp >= 0x6f0 && cp <= 0x6f9) d = cp - 0x6f0;
    else return null;
    n = n * 10 + d;
  }
  return n;
}

function numeriInLettere(testo, lingua) {
  const parole = (NUMERI_IN_LETTERE[lingua] || "").split(" ");
  return testo.replace(/\p{Nd}+/gu, (m) => {
    const n = valoreCifre(m);
    return n !== null && n < parole.length ? ` ${parole[n]} ` : m;
  });
}

const senzaAccenti = (t) => t.normalize("NFD").replace(/\p{Mn}/gu, "");

function normalizza(testo, lingua) {
  let t = (testo || "").normalize("NFKC").toLowerCase().replace(/’/g, "'").replace(/`/g, "'");
  t = numeriInLettere(t, lingua);
  if (lingua === "en") t = t.replace(/[a-z]+'[a-z]+|cannot/g, (m) => CONTRAZIONI_EN[m] || m);
  if (lingua === "ar") {
    t = t.replace(/[ً-ٰٟـ]/g, "");
    t = t.replace(/[أإآٱىةؤئ]/g, (c) => ARABO_UNIFICA[c]);
  } else {
    t = t.replace(/ß/g, "ss").replace(/œ/g, "oe").replace(/æ/g, "ae");
    t = senzaAccenti(t);
  }
  t = t.replace(/[^\p{L}\p{N}_\s]/gu, " ").replace(/_/g, " ");
  return t.split(/\s+/).filter(Boolean);
}

function distanza(a, b) {
  a = Array.from(a); b = Array.from(b);
  let prec = Array.from({ length: b.length + 1 }, (_, i) => i);
  a.forEach((ca, i) => {
    const corr = [i + 1];
    b.forEach((cb, j) => corr.push(Math.min(prec[j + 1] + 1, corr[j] + 1, prec[j] + (ca !== cb ? 1 : 0))));
    prec = corr;
  });
  return prec[prec.length - 1];
}

const lung = (s) => Array.from(s).length;

function simili(a, b) {
  if (a === b) return true;
  return Math.min(lung(a), lung(b)) >= 5 && distanza(a, b) <= 1;
}

const FONETICA_SOSTITUZIONI = [["sch", "s"], ["sh", "s"], ["ch", "s"], ["ph", "f"], ["th", "t"], ["gh", "g"],
  ["qu", "k"], ["ck", "k"], ["gn", "n"], ["ou", "u"], ["oo", "u"], ["ee", "i"],
  ["ai", "e"], ["ei", "e"], ["ay", "e"], ["au", "o"], ["eau", "o"]];
const FONETICA_LETTERE = { c: "k", q: "k", z: "s", x: "s", w: "v", y: "i", j: "i", h: "" };

function fonetica(parola, lingua) {
  if (lingua === "ar") return parola;
  let p = parola;
  for (const [v, n] of FONETICA_SOSTITUZIONI) p = p.split(v).join(n);
  p = p.replace(/[cqzxwyjh]/g, (c) => FONETICA_LETTERE[c]);
  p = p.replace(/(.)\1+/gu, "$1");
  if (lung(p) > 3 && p.endsWith("e")) p = p.slice(0, -1);
  return p || parola;
}

function similiFacile(a, b, lingua) {
  const fa = fonetica(a, lingua), fb = fonetica(b, lingua);
  if (fa === fb) return true;
  if (Math.min(lung(fa), lung(fb)) <= 2) return false;
  return rapporto(fa, fb) >= SOGLIE.SOMIGLIANZA_PAROLA_FACILE;
}

function _parole(testo, lingua) {
  const token = (testo || "").split(/\s+/).filter(Boolean);
  const norm = [];
  token.forEach((t, i) => normalizza(t, lingua).forEach((p) => norm.push([p, i])));
  return [token, norm];
}

function confronta(riferimento, detto, lingua, soglia, indulgente = false) {
  const [tokR, rif] = _parole(riferimento, lingua);
  const [tokD, det] = _parole(detto || "", lingua);
  const okR = rif.map(() => false), okD = det.map(() => false);
  const seqR = indulgente ? rif.map(([p]) => fonetica(p, lingua)) : rif.map(([p]) => p);
  const seqD = indulgente ? det.map(([p]) => fonetica(p, lingua)) : det.map(([p]) => p);
  const sm = new SequenceMatcher(seqR, seqD, false);
  for (const [tag, i1, i2, j1, j2] of sm.getOpcodes()) {
    if (tag === "equal") {
      for (let k = 0; k < i2 - i1; k++) okR[i1 + k] = okD[j1 + k] = true;
    } else if (tag === "replace") {
      for (let k = 0; k < Math.min(i2 - i1, j2 - j1); k++) {
        const a = rif[i1 + k][0], b = det[j1 + k][0];
        if (indulgente ? similiFacile(a, b, lingua) : simili(a, b)) okR[i1 + k] = okD[j1 + k] = true;
      }
      if (indulgente && i2 - i1 !== j2 - j1) {
        const gr = seqR.slice(i1, i2).join(""), gd = seqD.slice(j1, j2).join("");
        if (rapporto(gr, gd) >= 0.75) {
          for (let k = i1; k < i2; k++) okR[k] = true;
          for (let k = j1; k < j2; k++) okD[k] = true;
        }
      }
    }
  }
  const corrette = okR.filter(Boolean).length;
  let punteggio;
  if (indulgente) {
    const pesoR = seqR.map((x) => Math.max(1, lung(x))), pesoD = seqD.map((x) => Math.max(1, lung(x)));
    const somma = (v) => v.reduce((s, x) => s + x, 0);
    const totale = Math.max(somma(pesoR), somma(pesoD));
    punteggio = totale ? pesoR.reduce((s, w, i) => s + (okR[i] ? w : 0), 0) / totale : 0;
  } else {
    const totale = Math.max(rif.length, det.length);
    punteggio = totale ? corrette / totale : 0;
  }
  const perToken = (tokens, norm, ok) => {
    const stato = tokens.map(() => true);
    norm.forEach(([, i], k) => { if (!ok[k]) stato[i] = false; });
    return tokens.map((t, i) => [t, stato[i]]);
  };
  return {
    punteggio, superata: corrette > 0 && punteggio >= soglia,
    rif: perToken(tokR, rif, okR), detto: perToken(tokD, det, okD), testo_detto: detto || "",
  };
}

const PAROLE_FACOLTATIVE = {
  it: new Set(["il", "lo", "la", "i", "gli", "le", "l", "un", "uno", "una", "io", "tu", "a"]),
  en: new Set(["the", "a", "an", "i", "you", "to"]),
  fr: new Set(["le", "la", "les", "l", "un", "une", "je", "j", "tu"]),
  es: new Set(["el", "la", "los", "las", "un", "una", "yo", "tu", "tú"]),
  de: new Set(["der", "die", "das", "ein", "eine", "ich", "du"]),
  ar: new Set(),
};

function variantiParola(parola, lingua) {
  const varianti = new Set([parola]);
  const parti = parola.replace(/'/g, "' ").split(/\s+/).filter(Boolean);
  if (parti.length > 1) {
    const n = normalizza(parti[0], lingua);
    if (n.length && (PAROLE_FACOLTATIVE[lingua] || new Set()).has(n[0])) varianti.add(parti.slice(1).join(" "));
  }
  return [...varianti];
}

function confrontaParola(riferimento, detto, lingua, soglia, indulgente = false) {
  let rif = normalizza(riferimento, lingua).join("");
  let tok = normalizza(detto || "", lingua);
  let parti = normalizza(riferimento, lingua);
  if (indulgente) {
    const fac = PAROLE_FACOLTATIVE[lingua] || new Set();
    if (parti.length > 1 && fac.has(parti[0])) parti = parti.slice(1);
    rif = parti.map((p) => fonetica(p, lingua)).join("");
    const filtrati = tok.filter((p) => !fac.has(p)).map((p) => fonetica(p, lingua));
    tok = filtrati.length ? filtrati : tok.map((p) => fonetica(p, lingua));
  }
  const lunghezza = indulgente ? Math.max(1, parti.length) : Math.max(1, normalizza(riferimento, lingua).length);
  let migliore = 0;
  for (let i = 0; i < tok.length; i++) {
    for (let j = i + 1; j <= Math.min(tok.length, i + lunghezza + 1); j++) {
      migliore = Math.max(migliore, rapporto(rif, tok.slice(i, j).join("")));
    }
  }
  let superata = migliore >= soglia;
  if (indulgente && lung(rif) <= 3) superata = migliore >= SOGLIE.PAROLA_CORTA;
  return {
    punteggio: migliore, superata,
    rif: riferimento.split(/\s+/).filter(Boolean).map((w) => [w, superata]),
    detto: (detto || "").split(/\s+/).filter(Boolean).map((w) => [w, superata]),
    testo_detto: detto || "",
  };
}

function avvisiAccenti(riferimento, scritto) {
  const pulisci = (p) => p.toLowerCase().replace(/[^\p{L}\p{N}_\p{M}]/gu, "");
  const attese = {};
  riferimento.replace(/'/g, " ").split(/\s+/).filter(Boolean).forEach((w) => {
    attese[senzaAccenti(pulisci(w))] = pulisci(w);
  });
  const avvisi = [];
  scritto.replace(/['’]/g, " ").split(/\s+/).filter(Boolean).forEach((w) => {
    w = pulisci(w);
    const giusta = attese[senzaAccenti(w)];
    if (giusta && giusta !== w && !avvisi.includes(giusta)) avvisi.push(giusta);
  });
  return avvisi;
}

const compatta = (t) => senzaAccenti((t || "").toLowerCase()).replace(/[ʿʾ]/g, "").replace(/[^\p{L}\p{N}]/gu, "");
const haArabo = (t) => /[؀-ۿ]/.test(t || "");

function migliorEsito(esiti) {
  return esiti.reduce((m, e) => (e.punteggio > m.punteggio ? e : m));
}

function valutaScritto(frase, scritto, lingua, soloPrincipale = false) {
  if (lingua === "ar" && scritto && !haArabo(scritto)) {
    const a = compatta(frase.ar_translit || ""), b = compatta(scritto);
    const punteggio = a && b ? rapporto(a, b) : 0;
    const superata = punteggio >= 0.85;
    return { punteggio, superata, detto: [[scritto, superata]], rif: [], testo_detto: scritto,
             riferimento: frase.ar, avvisi: [] };
  }
  const candidati = [frase[lingua], ...(soloPrincipale ? [] : frase[`${lingua}_alt`] || [])];
  const prova = (trasforma) => candidati.map((c) => {
    const e = confronta(trasforma(c), trasforma(scritto), lingua, SOGLIE.SCRITTO);
    e.riferimento = c;
    return e;
  });
  let esito = migliorEsito(prova((x) => x));
  if (!esito.superata && lingua !== "en") {
    const esito2 = migliorEsito(prova((x) => x.replace(/['’]/g, "")));
    if (esito2.punteggio > esito.punteggio) esito = esito2;
  }
  esito.avvisi = esito.superata && lingua !== "ar" ? avvisiAccenti(esito.riferimento, scritto) : [];
  return esito;
}

// ---------------------------------------------------------------- testi lunghi (libri, articoli)
function isUpperPy(s) { return s !== s.toLowerCase() && s === s.toUpperCase(); }
function isTitlePy(s) {
  const parole = s.match(/\p{L}+/gu);
  if (!parole) return false;
  let cased = false;
  for (const w of parole) {
    const prima = w[0], resto = w.slice(1);
    if (prima.toUpperCase() !== prima.toLowerCase()) {
      cased = true;
      if (prima !== prima.toUpperCase() || resto !== resto.toLowerCase()) return false;
    } else if (resto !== resto.toLowerCase()) return false;
  }
  return cased;
}

function dividiInFrasi(testo) {
  testo = testo.replace(/\r/g, "").replace(/[ \t ]+/g, " ");
  testo = testo.split("\n").map((r) => {
    const s = r.trim();
    return s && s.split(/\s+/).length <= 6 && !/[.!?…؟,;:»"”]\s*$/.test(r) && (isUpperPy(s) || isTitlePy(s))
      ? r + "\n" : r;
  }).join("\n");
  testo = testo.replace(/(?<![.!?:;»"”])\n(?!\n)/g, " ");
  const pezzi = testo.split(/(?<=[.!?…؟])[»"”’)]*\s+|\n{2,}/);
  const [minimo, massimo] = PAROLE_FRASE_TESTO;
  const frasi = [];
  for (let pezzo of pezzi) {
    pezzo = pezzo.split(/\s+/).filter(Boolean).join(" ").trim();
    const n = pezzo.split(" ").filter(Boolean).length;
    const parti = n <= massimo ? [pezzo] : pezzo.split(";").map((x) => x.trim() + ";");
    for (let frase of parti) {
      if (frase.endsWith(";;")) frase = frase.replace(/;+$/, "");
      const np = frase.split(/\s+/).filter(Boolean).length;
      if (np >= minimo && np <= massimo && /[\p{L}\p{N}_]/u.test(frase)) frasi.push(frase);
    }
  }
  return frasi;
}

// ---------------------------------------------------------------- scelta delle frasi
function mescola(v) {
  for (let i = v.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [v[i], v[j]] = [v[j], v[i]];
  }
  return v;
}

function scegliFrasi(frasi, progressi, quante) {
  const priorita = (f) => {
    const s = progressi[String(f.id)];
    if (!s) return [1, 0];
    if (s.da_ripassare) return [0, 0];
    return [2, s.superate || 0];
  };
  const scelte = mescola([...frasi]).sort((x, y) => {
    const a = priorita(x), b = priorita(y);
    return a[0] - b[0] || a[1] - b[1];
  }).slice(0, quante);
  return mescola(scelte);
}

function scegliParole(parole, progressi, quante, nuoveMax) {
  const stato = (p) => progressi[String(p.id)];
  const ripassare = mescola(parole.filter((p) => stato(p) && stato(p).da_ripassare));
  const nuove = parole.filter((p) => !stato(p));
  const viste = mescola(parole.filter((p) => stato(p) && !stato(p).da_ripassare))
    .sort((a, b) => (stato(a).superate || 0) - (stato(b).superate || 0));
  const scelte = ripassare.slice(0, quante);
  const prese = nuove.slice(0, Math.max(0, Math.min(nuoveMax, quante - scelte.length)));
  scelte.push(...prese.map((p) => ({ ...p, _nuova: true })));
  scelte.push(...viste.slice(0, quante - scelte.length));
  return scelte;
}

function distrattori(parola, tutte, lingua, madre, quante = 3) {
  const valida = (p) => p.id !== parola.id && p[madre] && p[lingua] && p[madre] !== parola[madre] && p[lingua] !== parola[lingua];
  const stesso = mescola(tutte.filter((p) => p.tema === parola.tema && valida(p)));
  const altre = mescola(tutte.filter((p) => p.tema !== parola.tema && valida(p)));
  const scelte = [];
  for (const p of [...stesso, ...altre]) {
    if (!scelte.some((s) => s[madre] === p[madre])) scelte.push(p);
    if (scelte.length === quante) break;
  }
  return scelte;
}

if (typeof module !== "undefined") {
  module.exports = { SequenceMatcher, normalizza, fonetica, confronta, confrontaParola, variantiParola,
    valutaScritto, dividiInFrasi, scegliFrasi, scegliParole, distrattori, compatta, SOGLIE, simili, similiFacile };
}

// Libri: il testo diviso in frasi sta in IndexedDB (può essere grande)
const LibriDB = {
  apri() {
    return new Promise((ok, ko) => {
      try {
        const r = indexedDB.open("impara_lingue_libri", 1);
        r.onupgradeneeded = () => r.result.createObjectStore("libri");
        r.onsuccess = () => ok(r.result);
        r.onerror = () => ko(r.error);
      } catch (e) { ko(e); }
    });
  },
  async leggi(chiave) {
    try {
      const db = await this.apri();
      return await new Promise((ok) => {
        const r = db.transaction("libri").objectStore("libri").get(chiave);
        r.onsuccess = () => ok(r.result || null);
        r.onerror = () => ok(null);
      });
    } catch (e) { return LibriDB.memoria[chiave] || null; }
  },
  async scrivi(chiave, valore) {
    LibriDB.memoria[chiave] = valore;
    try {
      const db = await this.apri();
      await new Promise((ok) => {
        const t = db.transaction("libri", "readwrite");
        t.objectStore("libri").put(valore, chiave);
        t.oncomplete = ok; t.onerror = ok;
      });
    } catch (e) { /* resta in memoria */ }
  },
  memoria: {},
};

  },
